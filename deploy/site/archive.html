,"checked":"2026-09-11"},{"id":"m-future","topic":"museum","title":"趋势观察：把预言改写成假设","subtitle":"观察信号，不给未来伪造精确时间表。","intro":"把未来讨论拆为可观察变化：任务覆盖、部署成本、可靠性、人机协作与风险边界。每一项都要说明现有证据及仍然未知的条件。","mechanism":"本站的前瞻卡片是编辑提出的观察框架，不是未来事实：例如用同一任务的质量、费用、时延去观察端侧模型，而不是仅看新的发布名称。","practice":"写出一个你关心的变化，以及未来哪些结果会让你放弃这项判断。","check":"你的预测有适用范围、观察指标和反证条件。","pitfall":"不要把厂商路线图、研究可能性与已经交付的能力混为一谈。","sources":["m-agi"],"level":"入门","checked":"2026-09-11"},{"id":"m-life-agents","topic":"museum","title":"生活中的 Agent：先做草案，再做行动","subtitle":"用行程、票据与学习材料建立可控边界。","intro":"生活场景也可以按目标、工具、权限和验收拆分。起步时只做可核对的草稿：行程不自动购买，票据不连接银行，学习材料不采集不必要的个人信息。","mechanism":"同样的模型能力放进不同工具权限中，风险会改变。让代码处理计数与算术，模型组织文字；让用户明确确认高影响动作。","practice":"选择一个生活任务，列出必须使用和不应提供的工具，再定义交付物。","check":"任何写入、发送或购买都有单独的授权与验证，报告明确标注未核验信息。","pitfall":"不要让“自动化”成为取消人工判断的理由。","sources":["m-safe","m-harness"],"level":"入门","checked":"2026-09-11"}],"terms":[{"en":"AI","zh":"人工智能","definition":"让机器完成通常需要智能的任务的广泛领域。","caution":"不等于聊天机器人。","article":"ai-map"},{"en":"Machine Learning","zh":"机器学习","definition":"通过数据学习规律的方法集合。","caution":"不是所有问题都需要深度学习。","article":"ai-map"},{"en":"Deep Learning","zh":"深度学习","definition":"使用多层神经网络的机器学习方法。","caution":"模型更深不自动代表任务更合适。","article":"ai-map"},{"en":"LLM","zh":"大语言模型","definition":"主要处理语言理解与生成的模型类别。","caution":"不是完整应用。","article":"ai-map"},{"en":"Token","zh":"词元","definition":"模型处理文本的基本单位，依分词器而不同。","caution":"不等同于一个字。","article":"tokens-context"},{"en":"Context Window","zh":"上下文窗口","definition":"一次模型处理所能承载的上下文容量。","caution":"不等于最大输出。","article":"tokens-context"},{"en":"Embedding","zh":"向量表示","definition":"将内容映射成数值向量。","caution":"向量不是自然语言答案。","article":"rag-basics"},{"en":"Transformer","zh":"Transformer 架构","definition":"以注意力机制等组件构建的神经网络架构家族。","caution":"大模型并非只有一种架构。","article":"train-infer"},{"en":"Attention","zh":"注意力机制","definition":"根据相关程度组合输入表示的机制。","caution":"不是人的主观注意力。","article":"train-infer"},{"en":"Pre-training","zh":"预训练","definition":"在后续任务适配前进行的大规模训练。","caution":"不是简单把文本存进数据库。","article":"train-infer"},{"en":"Inference","zh":"推理 / 推断","definition":"用已有模型参数处理输入并生成结果。","caution":"与产品中的“深度思考”不是同一个分类维度。","article":"train-infer"},{"en":"Fine-tuning","zh":"微调","definition":"在已有模型基础上继续训练参数。","caution":"上传文件一般不等于微调。","article":"rag-or-finetune"},{"en":"SFT","zh":"监督微调","definition":"用输入和期望输出样例进行微调。","caution":"样例质量与授权很重要。","article":"train-infer"},{"en":"Distillation","zh":"蒸馏","definition":"让模型学习教师模型的行为或输出。","caution":"不是无损复制所有能力。","article":"train-infer"},{"en":"Quantization","zh":"量化","definition":"降低部分数值表示精度的技术。","caution":"量化位宽不等于总运行内存。","article":"quantization"},{"en":"MoE","zh":"混合专家","definition":"由路由机制选择部分专家参与计算的架构。","caution":"激活参数不等于总权重。","article":"local-models"},{"en":"KV Cache","zh":"键值缓存","definition":"复用部分注意力计算中间结果的缓存。","caution":"长上下文与并发会影响占用。","article":"local-models"},{"en":"RAG","zh":"检索增强生成","definition":"先找相关资料，再结合资料生成回答。","caution":"不保证引用一定正确。","article":"rag-basics"},{"en":"Chunking","zh":"分块","definition":"把资料切成适合索引和检索的片段。","caution":"切得更小不总是更好。","article":"rag-basics"},{"en":"Reranking","zh":"重排序","definition":"对已检索候选重新排序以提升相关性。","caution":"无法补回根本没有进入候选的证据。","article":"rag-basics"},{"en":"Grounding","zh":"依据约束","definition":"将回答与给定资料或工具结果关联。","caution":"有引用仍需要检查支持关系。","article":"rag-basics"},{"en":"Hallucination","zh":"幻觉","definition":"生成缺乏支持或不正确的内容。","caution":"流畅语气不代表事实可靠。","article":"eval-basics"},{"en":"Agent","zh":"智能体","definition":"围绕目标利用模型和工具进行反馈循环的系统。","caution":"不等于某个模型。","article":"agent-basics"},{"en":"Workflow","zh":"工作流","definition":"按设计的步骤、分支与规则组织执行。","caution":"可以包含 Agent 步骤。","article":"agent-basics"},{"en":"Tool Calling","zh":"工具调用","definition":"模型提出结构化动作，运行时校验并执行。","caution":"模型提议不等于已执行。","article":"tool-calling"},{"en":"MCP","zh":"模型上下文协议","definition":"AI 应用与工具、资源、提示模板的交换协议。","caution":"不是模型或安全认证。","article":"mcp-skills"},{"en":"Skills","zh":"技能包","definition":"封装特定任务指令与资源的方式，依产品而异。","caution":"不同工具的格式与能力不能互推。","article":"mcp-skills"},{"en":"Harness","zh":"Agent 运行与约束系统","definition":"围绕模型组织工具执行、状态、上下文、权限、预算与验收的工程系统。","caution":"不同框架或作者的边界可能不同；不是某个模型、MCP 或万能提示词的别名。","article":"h-01"},{"en":"Human-in-the-loop","zh":"人工介入","definition":"在指定环节由人检查、修改或批准。","caution":"必须定义介入点与责任。","article":"permission-boundary"},{"en":"Sandbox","zh":"沙箱","definition":"对执行环境与资源访问进行隔离的机制。","caution":"沙箱仍需要正确配置。","article":"permission-boundary"},{"en":"Prompt Injection","zh":"提示注入","definition":"不可信输入试图改变系统行为或操作边界。","caution":"过滤几个词无法完整防御。","article":"permission-boundary"},{"en":"Structured Output","zh":"结构化输出","definition":"按规定字段或格式产生结果。","caution":"格式正确不保证内容正确。","article":"api-to-app"},{"en":"Evaluation","zh":"评估","definition":"按定义的任务与标准测量系统表现。","caution":"少量样例不能证明普遍可靠。","article":"eval-basics"},{"en":"Benchmark","zh":"基准测试","definition":"在固定任务和方法下比较结果。","caution":"不能替代自己的业务验收。","article":"choose-model"},{"en":"TTFT","zh":"首字延迟","definition":"请求开始到首个输出 Token 的时间。","caution":"不等于完整任务耗时。","article":"local-models"},{"en":"Throughput","zh":"吞吐量","definition":"单位时间处理的请求或 Token 数。","caution":"应同时说明并发与硬件。","article":"local-models"},{"en":"Open Weights","zh":"开放权重","definition":"可按相应许可获取模型权重。","caution":"不自动等于数据、训练代码均开放。","article":"model-product"},{"en":"Model Alias","zh":"模型别名","definition":"可能映射到某个实际模型版本的调用名称。","caution":"别名可能随时间改路由。","article":"choose-model"},{"en":"ASR","zh":"语音识别","definition":"把音频中的语音转成文本。","caution":"与 TTS 方向相反。","article":"ai-map"},{"en":"TTS","zh":"语音合成","definition":"由文本生成语音。","caution":"克隆声音需授权。","article":"ai-map"},{"en":"VPS","zh":"VPS","definition":"虚拟专用服务器，使用物理资源的一部分形成独立管理环境。","caution":"不等于现成 VPN 服务。","article":"vps-what-is-vps","domain":"VPS"},{"en":"VDS","zh":"VDS","definition":"Virtual Dedicated Server；不同商家可能用它强调资源分配。","caution":"不是统一的“绝不超售”认证。","article":"vps-what-is-vps","domain":"VPS"},{"en":"KVM","zh":"KVM","definition":"Linux 的完整虚拟化基础，虚拟机可运行自己的内核。","caution":"不说明 CPU 是否独占。","article":"vps-what-is-vps","domain":"VPS"},{"en":"LXC","zh":"LXC","definition":"共享宿主机内核的系统容器环境。","caution":"权限与内核能力依宿主机。","article":"vps-what-is-vps","domain":"VPS"},{"en":"独服 / Dedicated","zh":"独服 / Dedicated","definition":"租用整台物理服务器。","caution":"仍须看带宽、支持和用途条款。","article":"vps-what-is-vps","domain":"VPS"},{"en":"vCPU","zh":"vCPU","definition":"分配给虚拟环境的逻辑 CPU 资源。","caution":"不自动等于独占物理核心。","article":"vps-what-is-vps","domain":"VPS"},{"en":"NAT 鸡","zh":"NAT 鸡","definition":"社区常指共享公网 IPv4、按规则映射端口的实例。","caution":"核实分配端口、UDP 与 IPv6。","article":"vps-what-is-vps","domain":"VPS"},{"en":"IPv6-only","zh":"IPv6-only","definition":"仅提供 IPv6 连接的交付选项。","caution":"IPv4 访客需其他兼容方案。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Looking Glass / LG","zh":"Looking Glass / LG","definition":"运营商或商家提供的网络观察与探测入口。","caution":"只代表其探测位置和方向。","article":"vps-what-is-vps","domain":"VPS"},{"en":"去程","zh":"去程","definition":"本站默认指本地用户到 VPS 的路径。","caution":"不要拿回程结果替代。","article":"vps-what-is-vps","domain":"VPS"},{"en":"回程","zh":"回程","definition":"本站默认指 VPS 到本地用户的路径。","caution":"要对应用户的实际运营商。","article":"vps-what-is-vps","domain":"VPS"},{"en":"三网","zh":"三网","definition":"中文 VPS 讨论里通常指电信、联通、移动。","caution":"三网可达不等于三网都快。","article":"vps-what-is-vps","domain":"VPS"},{"en":"BGP","zh":"BGP","definition":"自治系统之间交换可达性与路由信息的协议。","caution":"不是低延迟或优化线路保证。","article":"vps-what-is-vps","domain":"VPS"},{"en":"ASN","zh":"ASN","definition":"自治系统编号。","caution":"不要把型号 AS3 当作 AS 路径。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Peering","zh":"Peering","definition":"网络间针对约定流量互联。","caution":"覆盖范围与容量依协议。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Transit","zh":"Transit","definition":"通过上游获得更广泛的网络可达性。","caution":"上游品牌不能代替实测。","article":"vps-what-is-vps","domain":"VPS"},{"en":"CN2 / GIA / GT","zh":"CN2 / GIA / GT","definition":"中国电信相关网络及商业线路标签。","caution":"识别单个跳不能证明全程商业等级。","article":"vps-what-is-vps","domain":"VPS"},{"en":"9929","zh":"9929","definition":"VPS 讨论中常用来指联通相关精品网络 AS9929。","caution":"仍要看方向和完整路径。","article":"vps-what-is-vps","domain":"VPS"},{"en":"CMI / CMIN2","zh":"CMI / CMIN2","definition":"移动国际网络相关标签。","caution":"不同网络产品和路由实现需分别核验。","article":"vps-what-is-vps","domain":"VPS"},{"en":"IIJ","zh":"IIJ","definition":"日本网络运营商 Internet Initiative Japan 的简称。","caution":"线路标签不保证每段只走一家网络。","article":"vps-what-is-vps","domain":"VPS"},{"en":"RTT","zh":"RTT","definition":"Round-Trip Time，往返响应时间。","caution":"不是单向时延。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Jitter / 抖动","zh":"Jitter / 抖动","definition":"延迟随时间的变化程度。","caution":"要比较相同的测量口径。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Loss / 丢包","zh":"Loss / 丢包","definition":"探测未收到预期响应的比例。","caution":"中间跳不响应不等于业务丢包。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Mbps / MB/s","zh":"Mbps / MB/s","definition":"兆比特每秒 / 兆字节每秒，十进制下相差 8 倍。","caution":"MiB/s 是另一种二进制单位。","article":"vps-what-is-vps","domain":"VPS"},{"en":"入口 / 落地","zh":"入口 / 落地","definition":"首次接入的服务节点 / 最终出口节点，社区语境。","caution":"两者地理位置未必一致。","article":"vps-what-is-vps","domain":"VPS"},{"en":"中转","zh":"中转","definition":"在客户端与最终目标之间增加转发节点。","caution":"可能改善路径，也增加成本和故障点。","article":"vps-what-is-vps","domain":"VPS"},{"en":"绕路 / 绕美","zh":"绕路 / 绕美","definition":"社区对路径偏离直观地理路线的描述。","caution":"路由地理库不总是精确；以证据为准。","article":"vps-what-is-vps","domain":"VPS"},{"en":"晚高峰","zh":"晚高峰","definition":"用户所在地常见的晚间高负载时段。","caution":"不是固定且普遍一致的时刻。","article":"vps-what-is-vps","domain":"VPS"},{"en":"NQ","zh":"NQ","definition":"本站将 NodeQuality 相关语境与其他同缩写项目分开。","caution":"请核对原报告链接与抬头。","article":"vps-nq-rq","domain":"VPS"},{"en":"RQ","zh":"RQ","definition":"本版未能核实其唯一项目指代，保留歧义。","caution":"不擅自扩写为 RouteQuality，也不改成 RN。","article":"vps-nq-rq","domain":"VPS"},{"en":"NetQuality","zh":"NetQuality","definition":"xykt 的网络质量检测项目。","caution":"与 NodeQuality、IPQuality 不混为一谈。","article":"vps-what-is-vps","domain":"VPS"},{"en":"IPQuality","zh":"IPQuality","definition":"xykt 的 IP 质量与服务探测项目。","caution":"结果不等于目标平台内部风控。","article":"vps-what-is-vps","domain":"VPS"},{"en":"YABS","zh":"YABS","definition":"整合 fio、iperf3、Geekbench 等的基准测试脚本。","caution":"比较时统一版本和条件。","article":"vps-what-is-vps","domain":"VPS"},{"en":"MTR","zh":"MTR","definition":"综合路径探测与多次响应统计的诊断工具。","caution":"先看终点与连续趋势。","article":"vps-what-is-vps","domain":"VPS"},{"en":"NextTrace","zh":"NextTrace","definition":"可展示路由与相关网络信息的追踪工具。","caution":"标注依赖可见路径和数据源。","article":"vps-what-is-vps","domain":"VPS"},{"en":"IOPS","zh":"IOPS","definition":"每秒输入输出操作数。","caution":"块大小、读写比例和队列深度很重要。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Steal time","zh":"Steal time","definition":"虚拟机等待宿主机调度 CPU 的时间信号。","caution":"持续异常时需结合负载和商家限制排查。","article":"vps-what-is-vps","domain":"VPS"},{"en":"原生 IP","zh":"原生 IP","definition":"商家/社区常用于表达地址登记与使用地区等关系。","caution":"没有覆盖所有用法的统一定义。","article":"vps-what-is-vps","domain":"VPS"},{"en":"广播 IP","zh":"广播 IP","definition":"社区常见的地址来源或异地宣告标签。","caution":"BGP 宣告是路由机制，标签本身不能评价优劣。","article":"vps-what-is-vps","domain":"VPS"},{"en":"住宅 / 家宽 IP","zh":"住宅 / 家宽 IP","definition":"可能指住宅接入来源，也可能只是数据库分类。","caution":"标签不证明实体家庭连接或低风控。","article":"vps-what-is-vps","domain":"VPS"},{"en":"双 ISP","zh":"双 ISP","definition":"营销中对多个数据库/归属标签的说法可能不同。","caution":"先要求定义和对应证据。","article":"vps-what-is-vps","domain":"VPS"},{"en":"解锁","zh":"解锁","definition":"某服务的地区功能或接口当时可访问。","caution":"不保证完整登录、支付、内容或未来状态。","article":"vps-what-is-vps","domain":"VPS"},{"en":"送中","zh":"送中","definition":"社区俗语，可能指服务把出口归入中国地区。","caution":"具体是 DNS、地理库还是账户地区，需定位。","article":"vps-what-is-vps","domain":"VPS"},{"en":"鸡 / 小鸡","zh":"鸡 / 小鸡","definition":"中文社区里对服务器或 VPS 的俗称。","caution":"不是技术规格。","article":"vps-what-is-vps","domain":"VPS"},{"en":"母鸡 / 邻居","zh":"母鸡 / 邻居","definition":"宿主机 / 与你共享底层资源的其他实例。","caution":"邻居负载可能影响共享资源。","article":"vps-what-is-vps","domain":"VPS"},{"en":"超售","zh":"超售","definition":"分配或出售超过某类底层资源的并发承载能力。","caution":"需要明确资源类别与争用情况。","article":"vps-what-is-vps","domain":"VPS"},{"en":"传家宝 / 神机","zh":"传家宝 / 神机","definition":"社区对稀缺、低续费或体验好的旧套餐的评价。","caution":"不是官方价值认证。","article":"vps-what-is-vps","domain":"VPS"},{"en":"黑五 / BF","zh":"黑五 / BF","definition":"Black Friday 促销背景。","caution":"一定要附年份与完整 SKU。","article":"vps-what-is-vps","domain":"VPS"},{"en":"AFF","zh":"AFF","definition":"联盟推广/返佣链接的简称。","caution":"本站外链不附加推广参数。","article":"vps-what-is-vps","domain":"VPS"},{"en":"工单 / Ticket","zh":"工单 / Ticket","definition":"服务商的支持请求渠道。","caution":"保留问题时间、实例和复现资料。","article":"vps-what-is-vps","domain":"VPS"},{"en":"探针","zh":"探针","definition":"监测主机或服务状态的程序/节点。","caution":"避免泄露管理凭据。","article":"vps-what-is-vps","domain":"VPS"},{"en":"跑分 / 跑脚本","zh":"跑分 / 跑脚本","definition":"执行基准测试或诊断工具。","caution":"先评估权限、消耗与上传行为。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Push","zh":"Push","definition":"商家支持的服务转移流程的常见叫法。","caution":"能否转移与费用由该商家条款决定。","article":"vps-what-is-vps","domain":"VPS"},{"en":"原邮 / 带邮箱","zh":"原邮 / 带邮箱","definition":"初始注册邮箱 / 连同邮箱交付的社区说法。","caution":"不等于官方授权或无法找回。","article":"vps-what-is-vps","domain":"VPS"},{"en":"剩余价值 / 残值","zh":"剩余价值 / 残值","definition":"按已付服务剩余期限折算的协商参考。","caution":"不是官方退款或可保证回收的资金。","article":"vps-what-is-vps","domain":"VPS"},{"en":"溢价","zh":"溢价","definition":"报价高于所采用价值基准的部分。","caution":"先说明基准、币种、时间与费用。","article":"vps-what-is-vps","domain":"VPS"},{"en":"折价","zh":"折价","definition":"报价低于所采用价值基准的部分。","caution":"低价不消除账户和交易风险。","article":"vps-what-is-vps","domain":"VPS"},{"en":"续费价","zh":"续费价","definition":"下个计费周期适用的费用。","caution":"与首付、转让报价分开。","article":"vps-what-is-vps","domain":"VPS"},{"en":"永久循环优惠","zh":"永久循环优惠","definition":"社区对优惠持续用于后续周期的描述。","caution":"实际期限、转移与调整依条款。","article":"vps-what-is-vps","domain":"VPS"},{"en":"AUP / ToS","zh":"AUP / ToS","definition":"可接受使用政策 / 服务条款。","caution":"付款前阅读，不能用社区传闻替代。","article":"vps-what-is-vps","domain":"VPS"},{"en":"2FA / MFA","zh":"2FA / MFA","definition":"双因素 / 多因素认证。","caution":"恢复码与设备同样需要保护。","article":"vps-what-is-vps","domain":"VPS"},{"en":"SLA","zh":"SLA","definition":"服务等级协议，含范围、条件与补偿规则。","caution":"不是永不停机保证。","article":"vps-what-is-vps","domain":"VPS"},{"en":"DDoS","zh":"DDoS","definition":"分布式拒绝服务攻击。","caution":"防护有容量、范围和业务适配边界。","article":"vps-what-is-vps","domain":"VPS"},{"en":"快照 / Snapshot","zh":"快照 / Snapshot","definition":"保存实例或磁盘在某时点的状态。","caution":"不自动替代独立可恢复备份。","article":"vps-what-is-vps","domain":"VPS"},{"en":"DNS","zh":"DNS","definition":"把域名映射到资源信息的分布式命名系统。","caution":"不直接承载网站文件。","article":"vps-what-is-vps","domain":"VPS"},{"en":"CDN","zh":"CDN","definition":"通过分布式边缘节点交付内容。","caution":"效果取决于缓存、路径与业务。","article":"vps-what-is-vps","domain":"VPS"},{"en":"源站","zh":"源站","definition":"提供原始内容或后端服务的服务器。","caution":"接了 CDN 仍需要源站防护。","article":"vps-what-is-vps","domain":"VPS"},{"en":"TLS / HTTPS","zh":"TLS / HTTPS","definition":"加密传输及验证对端的协议体系 / 安全 HTTP。","caution":"不代表网站业务本身可信。","article":"vps-what-is-vps","domain":"VPS"},{"en":"TTL","zh":"TTL","definition":"DNS 记录允许缓存的时长。","caution":"不等于全球刷新完成倒计时。","article":"vps-what-is-vps","domain":"VPS"},{"en":"反代","zh":"反代","definition":"反向代理，代表服务端接收并转发请求。","caution":"不能与账号共享或正向代理直接等同。","article":"vps-what-is-vps","domain":"VPS"},{"en":"ICP","zh":"ICP","definition":"中国大陆网站接入等语境涉及的备案/许可核查项。","caution":"须按业务与官方平台核对，不作一概判断。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Clash Verge Rev","zh":"Clash Verge Rev","definition":"基于 Mihomo 的图形客户端。","caution":"软件安装与购买远程节点是两件事。","article":"vps-what-is-vps","domain":"VPS"},{"en":"v2rayN","zh":"v2rayN","definition":"支持多种连接核心的图形客户端。","caution":"不是某一个 VPS 或代理供应商。","article":"vps-what-is-vps","domain":"VPS"},{"en":"sing-box","zh":"sing-box","definition":"通用代理工具与配置体系。","caution":"核对版本、平台和配置格式。","article":"vps-what-is-vps","domain":"VPS"},{"en":"商业 VPN","zh":"商业 VPN","definition":"服务方运营出口并提供客户端和账户的交付模式。","caution":"不要与 VPN 协议或单独客户端混淆。","article":"vps-what-is-vps","domain":"VPS"},{"en":"Virtual card","zh":"虚拟卡","definition":"只提供数字支付凭证而不必持有实体卡的卡片形态。","caution":"虚拟不代表信用、借记或预付的具体类别。","article":"card-eligibility","domain":"新增"},{"en":"Recurring payment","zh":"循环扣款","definition":"由商户按周期或约定触发的付款。","caution":"一次性卡未必支持；取消须在原购买渠道确认。","article":"subscription-channels","domain":"新增"},{"en":"3D Secure","zh":"支付身份验证","definition":"发卡行与商户支付流程中的持卡人验证机制。","caution":"不要把验证码交给代付方。","article":"payment-failure","domain":"新增"},{"en":"Copyleft","zh":"互惠许可","definition":"在指定条件下要求受覆盖作品保留相应自由与源码权利的许可机制。","caution":"不同许可的触发行为与覆盖范围不同。","article":"license-basics","domain":"新增"},{"en":"Source available","zh":"源码可见","definition":"能取得源代码，但具体权利可能受到用途或商业限制。","caution":"不能自动等同于 OSI 开源。","article":"open-source-vs-weights","domain":"新增"},{"en":"Open weights","zh":"开放权重","definition":"模型参数可获得，权利依所附许可而定。","caution":"不自动包含训练代码、数据说明和无条件商用权。","article":"open-source-vs-weights","domain":"新增"},{"en":"SPDX","zh":"许可证标识","definition":"用标准标识描述许可证等软件供应链信息。","caution":"SPDX 收录不等于 OSI 认可。","article":"release-checklist","domain":"新增"},{"en":"Dual licensing","zh":"双许可","definition":"同一权利人对相应作品提供两种授权路径。","caution":"需要拥有足够权利，不能擅自更改第三方授权。","article":"publishing-path","domain":"新增"},{"en":"Open core","zh":"开放核心","definition":"基础组件与其他商业组件分别设计授权和交付的模式。","caution":"接口、代码边界与贡献者授权需清楚。","article":"publishing-path","domain":"新增"},{"en":"Arena","zh":"模型竞技场","definition":"原 LMArena 的社区模型对比与偏好评测入口。","caution":"名次不能替代自己的业务测试；别上传秘密。","article":"arena-reading","domain":"新增"},{"en":"Checkpoint","zh":"检查点","definition":"在安全的状态边界记录任务进度、观察和待执行动作，供后续恢复。","caution":"恢复不自动保证外部副作用恰好执行一次。","article":"h-06"},{"en":"Idempotency","zh":"幂等性","definition":"用明确标识与状态校验，让同一动作重复请求不会产生多份预期外产物。","caution":"外部系统仍需事务、唯一键等设计。","article":"h-06"},{"en":"Action approval","zh":"动作审批","definition":"用户对具体参数、目标和任务版本的一次授权。","caution":"不是给模型后续任意操作的通行证。","article":"h-07"}],"paths":[{"id":"developer","name":"开发工程师","icon":"code","goal":"交付一个可验证的 AI 应用","description":"从调用模型到工程闭环，先交付小而完整的功能。","steps":["ai-map","model-product","task-spec","coding-loop","api-to-app","eval-basics"],"deliverable":"模拟工单分类器：包含接口、失败处理、验收集和运行说明。"},{"id":"tester","name":"测试工程师","icon":"check","goal":"为不确定性建立验收标准","description":"把模型输出、工具动作与业务风险拆开验证。","steps":["tokens-context","test-ai-code","tool-calling","rag-basics","eval-basics","permission-boundary"],"deliverable":"一份覆盖典型、边界、无答案与越权输入的回归测试集。"},{"id":"ops","name":"运维 / 安全","icon":"server","goal":"构建只读的排障辅助流程","description":"从资源、权限和故障处理出发，不急于自动写入。","steps":["model-product","local-models","agent-basics","tool- t.com/product/lighthouse","kind":"商家官网","status":"本次正文未取得；仅收录官方入口","checked":"2026-09-11"},"icp":{"id":"icp","name":"工业和信息化部 · ICP 备案入口","url":"https://beian.miit.gov.cn/","kind":"官方入口","status":"本次正文未取得；办理要求需在官方平台复核","checked":"2026-09-11"},"clash-verge":{"id":"clash-verge","name":"Clash Verge Rev · 原项目仓库","url":"https://github.com/clash-verge-rev/clash-verge-rev","kind":"项目原仓库","status":"已核对正文","checked":"2026-09-11"},"v2rayn":{"id":"v2rayn","name":"v2rayN · 原项目仓库","url":"https://github.com/2dust/v2rayN","kind":"项目原仓库","status":"已核对正文","checked":"2026-09-11"},"singbox":{"id":"singbox","name":"sing-box · 官方文档","url":"https://sing-box.sagernet.org/","kind":"官方文档","status":"已核对正文","checked":"2026-09-11"},"protonvpn":{"id":"protonvpn","name":"Proton VPN · 商业 VPN 服务示例","url":"https://protonvpn.com/","kind":"服务官网","status":"已核对正文","checked":"2026-09-11"}},"categories":[{"id":"basics","title":"VPS 基础","subtitle":"先弄懂你买的到底是什么","icon":"layers","color":"mint"},{"id":"network","title":"网络与线路","subtitle":"从去回程到真实使用体验","icon":"route","color":"blue"},{"id":"reports","title":"测评与报告","subtitle":"把跑分翻译成购买判断","icon":"activity","color":"orange"},{"id":"buying","title":"选购与交易","subtitle":"算清成本，也看清风险","icon":"wallet","color":"purple"},{"id":"hosting","title":"建站与运维","subtitle":"从域名到可靠运行","icon":"terminal","color":"blue"},{"id":"security","title":"安全与风控","subtitle":"保护数据、账户和预算","icon":"shield","color":"mint"}],"articles":[{"id":"what-is-vps","cat":"basics","title":"VPS 是什么？先把“服务器”想明白","summary":"你租到的是远程计算环境，不是默认开通的一条网络服务。","blocks":[{"title":"一句话理解","text":"VPS 是 Virtual Private Server（虚拟专用服务器）。服务商把物理服务器的资源划分给多个虚拟环境，你获得其中一份计算、内存、存储与网络资源，并在允许的范围内管理操作系统和应用。它可以承载网站、开发环境、监控或个人文件服务。"},{"title":"你负责什么","text":"常见的自管理 VPS 由商家维护机房、物理硬件与底层平台；系统更新、应用配置、账户权限和数据备份通常由你负责。不要把“云”理解成有人替你处理一切。托管服务的范围需要读合同。"},{"title":"买之前问自己","text":"先写用途和用户所在地，再写最低内存、存储、月流量及可承受停机时间。新手学习优先考虑可重装、可救援、能短周期付费的环境，而不是追求最大的参数。"}],"refs":["aws-vps"],"level":"入门","tags":["服务器","云服务器","入门"],"minutes":2},{"id":"vps-vpn-airport","cat":"basics","title":"VPS、机场、VPN、代理客户端：四件不同的事","summary":"区分基础设施、代运营服务、隧道技术与本地软件。","blocks":[{"title":"VPS：一台可配置的远程机器","text":"购买 VPS 后你仍需要安装和配置应用。能运行网站不代表已经提供代理；能远程登录不代表所有本地流量都经过它。维护责任通常更多地落在自己身上。"},{"title":"机场：社区俗称的订阅式代理服务","text":"“机场”不是统一的技术标准。常见模式是服务方运营多个入口或出口，用户购买流量与访问凭据。服务质量、透明度、隐私政策、支持协议和适用范围依商家而异。这里说明术语，不推荐未核实的订阅商。"},{"title":"VPN：技术，也可能是商业服务","text":"WireGuard、OpenVPN 是用于构建加密隧道的软件/技术；商业 VPN 则通常把客户端、出口和账户计费打包出售。Tailscale 偏重设备之间的组网与访问控制，不能仅按“几个国家出口”来比较。"},{"title":"客户端：不是节点来源","text":"Mihomo 一类核心负责规则、协议和流量处理，图形客户端负责界面。软件装好了仍需要有效配置和可达端点。“系统代理”“TUN”“路由表”和“DNS”控制的范围不同；应用不走代理不一定是 VPS 出了问题。"}],"refs":["aws-vps","wireguard","openvpn","mihomo","tailscale"],"level":"入门","tags":["机场","VPN","Clash","客户端"],"minutes":2},{"id":"virtualization","cat":"basics","title":"KVM、LXC、独服：隔离方式怎么选","summary":"虚拟化类别和 CPU 是否独占，是两个维度。","blocks":[{"title":"KVM 与系统容器","text":"KVM 提供完整虚拟化基础，虚拟机可运行自己的内核。LXC 属于系统容器，使用宿主机内核，通过隔离机制形成环境。容器的内核能力与权限约束要提前确认，不应照搬虚拟机教程。"},{"title":"独服、独立 vCPU 与共享 vCPU","text":"独服是租用整台物理机器；独立 vCPU 通常仍在虚拟机内，只是 CPU 分配方式不同。共享 vCPU 的峰值表现可能很好，但不代表允许持续满载。读清 CPU 公平使用政策。"},{"title":"不要混淆分类","text":"“KVM + ARM + NAT + 存储型”可以同时成立：依次描述虚拟化、处理器架构、网络方式和用途。低价不必然质量差，KVM 也不意味着绝不超售。"}],"refs":["kvm","lxc","do"],"level":"入门","tags":["KVM","LXC","OpenVZ","独服"],"minutes":2},{"id":"ip-types","cat":"basics","title":"独立 IPv4、NAT、IPv6-only 与家宽标签","summary":"能否监听端口，比宣传里的“独享”更具体。","blocks":[{"title":"独立地址与共享出口","text":"独立 IPv4 通常方便直接接收公网连接。NAT 产品可能共享一个公网 IPv4，只分配部分端口；是否支持端口映射、UDP、自定义端口和 IPv6 要逐项确认。独立 IP 并不等于独立带宽或独立物理服务器。"},{"title":"IPv6-only 的前提","text":"本地接入和目标服务都要有可用的 IPv6 路径，或另有转换/代理设施。只有 AAAA 记录不能自动让 IPv4 用户访问。用于公开网站时，要确认双栈访客覆盖方式。"},{"title":"原生、广播、住宅：分开判断","text":"“原生”常被用于描述地址注册与使用地区相符，但商家口径并不统一。所谓广播 IP 并不能单独证明质量差；住宅标签也不能证明它来自真实家庭线路。核对地址数据库、ASN、实际路径、商家交付描述和目标业务。"}],"refs":["ipquality","netcup","bgp"],"level":"入门","tags":["IPv4","IPv6","NAT","原生IP","家宽"],"minutes":2},{"id":"read-specs","cat":"basics","title":"配置单怎么读：2C / 2G / 40G / 1T","summary":"先找单位，再看计费口径与资源约束。","blocks":[{"title":"计算和存储","text":"2C 常指 2 个 vCPU；2G 常指 2 GB/GiB 内存；40G 常指磁盘容量。共享核心不等于两颗完整物理核心，磁盘“NVMe”也不能代替 IOPS、延迟与持续性能测试。ARM 镜像和二进制兼容性需要单独检查。"},{"title":"流量不等于带宽","text":"1T 通常是一个计费周期的流量额度；1Gbps 是端口速率。二者都不是到你家必达的速度。确认 TB/TiB、单向或双向统计、入站/出站、流量重置日、超额收费还是限速停机。"},{"title":"常被省略的成本","text":"IPv4、快照、备份、额外磁盘、税费和跨区域流量可能另计。关机不一定停止计费；释放实例也可能留下磁盘和地址收费。最终依据账单项目与商家说明。"}],"refs":["do","lightsail","netcup"],"level":"入门","tags":["配置","流量","带宽","计费"],"minutes":2},{"id":"managed-cloud","cat":"basics","title":"云服务器、轻量服务器和共享主机","summary":"名字不同，真正要比较的是控制权与服务边界。","blocks":[{"title":"三种交付视角","text":"共享主机通常围绕网站空间与管理面板交付；VPS/云实例提供系统级环境；轻量应用服务器常把实例、镜像、流量套餐和简化面板打包。名称不构成性能或高可用保证。"},{"title":"哪些事情适合托管","text":"只做静态展示站，不一定需要 VPS。需要数据库、常驻进程、自定义运行时或网络配置时，系统级环境更灵活。没有运维精力时，应比较托管平台与自管服务器的总成本。"},{"title":"从业务反推","text":"把系统管理、补丁、备份、故障处理、恢复支持分别列出来。由谁做、收费多少、多久响应，比“企业级”“高性能”等字眼更有决策价值。"}],"refs":["aws-vps","ali","do"],"level":"入门","tags":["轻量","托管","云服务器"],"minutes":2},{"id":"round-trip","cat":"network","title":"去程与回程：同一对端点，两条可能不同的路","summary":"去程看本地到 VPS，回程看 VPS 到本地。","blocks":[{"title":"先固定观察者","text":"本站默认以用户为参照：本地 → VPS 为去程；VPS → 本地为回程。从服务器发起的 traceroute 只能提供那个方向的路径信息，不能据此断言用户去程完全相同。"},{"title":"为什么会不对称","text":"不同网络依据各自策略选择出口和上游。BGP 并不要求两端选择相同的运营商或相同路径。路由可随拥塞、故障、上游和策略调整发生变化。"},{"title":"怎样验证","text":"在真实本地网络跑去程；在 VPS 或商家 Looking Glass 跑到对应本地网络的回程。家宽不响应探测时，说明可见性限制，不要随便用一个省会公共 IP 代替全部用户。保留时间、协议、IP 版本和原始结果。"}],"refs":["bgp","nexttrace","mtr"],"level":"入门","tags":["去程","回程","双向","路由"],"minutes":2},{"id":"latency-loss","cat":"network","title":"延迟、抖动、丢包：不能只盯着一个 Ping","summary":"交互顺畅、长连接稳定、下载速度快，是不同目标。","blocks":[{"title":"三个指标","text":"延迟看响应往返需要多久，常用 RTT 毫秒表示；抖动看延迟随时间的波动；丢包看发送与收到的比例。比较时要统一样本数、时间段和测量方式。P95/P99 能辅助发现平均数掩盖的尾部波动。"},{"title":"中间跳不回，不等于业务丢包","text":"路由器可能限速或不回应发给自身的探测，但仍正常转发业务。中间一跳显示很高丢包，后续跳和终点正常时，不能直接判为线路丢包。终点持续异常也需要与 TCP 和真实应用互证。"},{"title":"把晚高峰纳入验收","text":"用同一家庭网络，在日间和通常拥塞的晚间进行多轮测量，再测试真实任务。不要把一次极高跑分当成长期承诺；也不要把一次 ICMP 异常直接解释成断网。"}],"refs":["mtr","iperf","nexttrace"],"level":"入门","tags":["Ping","RTT","抖动","丢包","MTR"],"minutes":2},{"id":"asn-bgp","cat":"network","title":"ASN、BGP、Peering、Transit 是什么","summary":"看到某个 AS 号，只是获得一个线索。","blocks":[{"title":"AS 和 ASN","text":"自治系统是实施统一路由策略的网络集合，ASN 是它的编号。BGP 交换网络可达性和路径信息。一个数据中心、一个 IP 地址归属和一条实际路径，不一定对应同一个运营主体。"},{"title":"Peering 与 Transit","text":"Peering 是网络间针对约定流量互联；Transit 是通过上游获得更广泛的互联网可达性。是否收费、覆盖哪些前缀、互联容量有多少，均依具体安排，不能把某个标签理解成全球最短路。"},{"title":"BGP 不等于“优化线路”","text":"几乎所有跨自治系统互联网路由都涉及 BGP。商家写 BGP 可能指多线接入等产品设计，而不是无条件低延迟。看具体起终点、实际 AS 路径与测试日期，比看三个字母更可靠。"}],"refs":["bgp","nexttrace"],"level":"入门","tags":["ASN","BGP","Peering","Transit","上游"],"minutes":2},{"id":"china-routes","cat":"network","title":"CN2、9929、CMI、IIJ：线路标签如何理解","summary":"识别运营商与网络产品，不把标签排成绝对榜单。","blocks":[{"title":"看运营商，也看路由全貌","text":"CN2、联通精品网、移动国际网络、IIJ 等标签描述不同运营商网络或服务。识别常见 AS 号能辅助读图，但标签、单个可见跳或 IP 数据库不能独立证明套餐享有某个商业等级。"},{"title":"GIA / GT / EB / PRO 不是同一维度","text":"有的是运营商商业产品，有的是 VPS 商家的系列名称。DMIT 官方把 Premium、Eyeball、Tier 1 分为不同网络系列；硬件系列另外命名。不要直接用 A 商家的 PRO 对齐 B 商家的 Pro。"},{"title":"地域和方向优先","text":"一条线路可能联通表现合适、移动不合适，也可能去程普通但回程优化。辽宁的实际表现不能从广东的单张图外推。首选本地同运营商、同 IP 版本、晚间和真实业务验证。"}],"refs":["dmit","bgp","netquality"],"level":"入门","tags":["CN2","GIA","GT","9929","CMI","CMIN2","IIJ"],"minutes":2},{"id":"node-roles","cat":"network","title":"入口、中转、落地：节点承担什么角色","summary":"机房位置、连接入口与最终出口，可以不是同一处。","blocks":[{"title":"入口和出口","text":"入口是设备最先连到的服务端点；出口是目标业务看到的来源。所谓落地常指最终对外访问的节点。目标服务看到的出口地区，不必等于你连接的入口域名标注的地区。"},{"title":"中转的代价","text":"多一跳可能绕开差的互联，也可能增加延迟、成本和故障点。只有端到端实测改善，才值得增加中转。把“本地到入口”和“入口到出口”分别测量，再看总体结果。"},{"title":"专线字样需要证据","text":"IEPL、IPLC 等有具体网络交付含义，但社区营销可能混用。询问交付边界、承载范围、SLA 与故障处理，不能仅凭订阅中的文字判断独享容量或合规性。"}],"refs":["bgp","wireguard","mihomo"],"level":"入门","tags":["入口","中转","落地","IEPL","IPLC","节点"],"minutes":2},{"id":"bandwidth-throughput","cat":"network","title":"1Gbps 为什么下不到 125MB/s？","summary":"端口上限不是整个链路的吞吐保证。","blocks":[{"title":"单位先换算","text":"十进制下 1 Gbps = 1000 Mbps，除以 8 得 125 MB/s。这是未扣除任何协议开销的理论值。MiB/s 还涉及二进制换算；页面里的 Mbps、MB/s 与 MiB/s 不应混写。"},{"title":"瓶颈可能在任何一段","text":"共享端口、上游拥塞、本地接入、丢包重传、磁盘、CPU 加密能力、目标服务器限速、单连接拥塞控制都可能降低速度。多线程测速高，不代表单连接下载或远程桌面体验同样好。"},{"title":"公平对比","text":"明确测试方向、并发连接数、目标和持续时间，进行单连接与多连接两类测试。iperf3 测试需要授权和对端配合，测试本身会消耗流量，避免影响生产业务。"}],"refs":["iperf","yabs"],"level":"入门","tags":["Gbps","Mbps","MB/s","单线程","多线程"],"minutes":2},{"id":"local-test","cat":"network","title":"把全国测评变成本地验收：辽宁示例","summary":"一张可复用的对比方法，不是当地速度保证。","blocks":[{"title":"建立对照组","text":"保留现有可用线路作为 A，再把新实例作为 B。分别在辽宁联通与辽宁移动实际接入环境测试，不把两家运营商的结果混为一个平均分。记录所在城市、接入方式和是否经过其他代理。"},{"title":"选三个实际任务","text":"交互类观察页面首字节和请求失败；持续类观察长连接中断与抖动；大流量类观察单连接下载与持续吞吐。目标业务、账户和应用设置保持一致，减少混杂因素。"},{"title":"决定是否续费","text":"按自己的最低可用标准验收。拿不到测试 IP、不能短期验证或交易权属不清时，降低预付金额。一次改善可以成为继续测试的依据，但不足以证明全年稳定。"}],"refs":["mtr","iperf","netquality"],"level":"实践","tags":["辽宁","联通","移动","晚高峰","验收"],"minutes":2},{"id":"nq-rq","cat":"reports","title":"NQ、NetQuality、RQ：先认报告来源","summary":"缩写不能代替项目名、原始链接和运行版本。","blocks":[{"title":"NQ 先看页面与报告抬头","text":"社区中 NQ 可以指向 NodeQuality 相关测评页面；本站收录其入口，但本次未取得其可解析说明文档，因此不虚构统一报告字段或固定分数规则。拿到具体报告后，以页面实际工具、版本和模块为准。"},{"title":"NetQuality 与 IPQuality 各司其职","text":"xykt/NetQuality 的项目说明覆盖网络/BGP、TCP 延迟、回程与测速等；IPQuality 更偏 IP 类型、数据库风险和服务可达性。名字相近，不应自动当成同一个项目。"},{"title":"RQ：本版保留待核实","text":"没有核实到能唯一对应你这里“RQ”的项目来源，不能擅自展开为 RouteQuality，也不能直接改成 RN。需要具体链接、截图或项目全名。本站的报告解读器只识别有证据的字段，不生成不存在的 RQ 评分。"}],"refs":["nq","netquality","ipquality"],"level":"入门","tags":["NQ","RQ","NodeQuality","NetQuality","报告"],"minutes":2},{"id":"read-report","cat":"reports","title":"一份测试报告的正确阅读顺序","summary":"先看时间和条件，再看性能，最后看适用性。","blocks":[{"title":"第一层：证据完整吗","text":"记录测试日期、工具和版本、实例规格、机房、IP 版本、测量点、方向和本地网络。缺少这些信息时，报告最多是线索。截图可裁剪、文本可修改，分享链接也不能证明交易控制权。"},{"title":"第二层：分开阅读","text":"CPU/内存测试对应计算任务；磁盘测试区分顺序吞吐和小块随机 I/O；网络测试区分路径、延迟和吞吐；IP 测试区分各数据库与具体业务。不要把这些压成一个万能总分。"},{"title":"第三层：复现你的用途","text":"优先验证同规格实例、同城同运营商和真实业务。把失败结果也记录下来，不只截最漂亮的一次。本站解读器是本地规则辅助工具，不连接服务器，不验证报告真伪。"}],"refs":["yabs","netquality","ipquality","nexttrace"],"level":"入门","tags":["报告","YABS","测试","跑分"],"minutes":2},{"id":"ip-risk","cat":"reports","title":"“纯净 IP”“解锁全绿”能证明什么？","summary":"第三方标签和一次探测，不等于平台内部结论。","blocks":[{"title":"数据库不是同一本账","text":"不同数据库的地区、代理、住宅、数据中心和风险分数可能冲突。确认查询日期、字段定义、是否针对 IPv4 或 IPv6。某个评分低，只意味着那个数据库当时给出的结果低。"},{"title":"可达、可登录、可支付是不同层","text":"脚本探测某个接口成功，不保证完整业务、付费内容、账户资格或未来可用。实际服务还可能看账号状态、支付地区、设备与操作行为；本站不提供伪造身份或绕过平台风控的办法。"},{"title":"合理的动作","text":"保持账户与账单资料真实，使用官方支持范围内的服务，减少无意义的频繁切换。遇到错误保留时间、错误码与响应信息并走官方支持，不要把“换 IP”当万能修复。"}],"refs":["ipquality","dmit-tos"],"level":"入门","tags":["IP质量","解锁","纯净","风控","AI"],"minutes":2},{"id":"benchmark-safety","cat":"reports","title":"跑脚本之前：权限、流量与隐私","summary":"复制一行命令，可能意味着执行整份远程代码。","blocks":[{"title":"先审阅，再执行","text":"从项目原仓库获取脚本，审阅内容、依赖、更新记录和公开问题；需要时固定提交或发行版本。不要仅凭网帖里的短链接以 root 运行。下载后再执行可以提供检查机会，但不能自动保证安全。"},{"title":"注意副作用","text":"基准测试会消耗 CPU、写磁盘、跑流量，可能影响同机应用或触发公平使用政策。生产实例先安排维护窗口；不对不属于你的系统进行压力测试。"},{"title":"分享前检查敏感信息","text":"公开报告可能包含完整 IP、系统版本、主机名和网络信息。NetQuality/IPQuality 的隐私模式可禁用其在线报告生成，但测试仍需访问第三方服务；隐私模式不等于离线。不要发布订阅链接、私钥或访问令牌。"}],"refs":["yabs","netquality","ipquality"],"level":"实践","tags":["脚本","安全","隐私","root"],"minutes":2},{"id":"mtr-reading","cat":"reports","title":"MTR 的 Loss、Avg、Best、Wrst 怎么看","summary":"看终点趋势和连续性，不把中间跳单独定罪。","blocks":[{"title":"字段语义","text":"Loss 是探测丢失比例，Snt 是发送数量；Last / Avg / Best / Wrst 分别描述最近、平均、最小和最大响应时间，StDev 表示波动。具体显示由实现与参数决定。"},{"title":"一个教学例子","text":"假设第 5 跳显示 80% 不响应，第 6 跳与终点没有丢包：这不支持“第 5 跳丢了 80% 业务数据”的判断。假设从第 5 跳起到终点持续出现近似丢包，并且真实请求失败，才更值得排查该位置前后的路径。"},{"title":"不要忘记回包路径","text":"每跳 RTT 包含探测到达及回应返回的时间，不是相邻路由器之间的单段时延。探测回应也可能走不同回程。单份 traceroute 很难准确定位所有拥塞原因。"}],"refs":["mtr","nexttrace"],"level":"进阶","tags":["MTR","Loss","Avg","丢包"],"minutes":2},{"id":"choose-vps","cat":"buying","title":"选第一台 VPS：先用途，后参数，最后下单","summary":"避免“便宜但用不上”和“线路好却买过量”。","blocks":[{"title":"把硬约束写出来","text":"用途、访问者所在地、应用架构、最低内存/磁盘、月流量、端口需求、预算和故障容忍度。先排除不满足约束的产品，再谈性价比；不要用毫无证据的综合排名替代筛选。"},{"title":"给试错设置上限","text":"学习和线路验证可以优先短周期付费。需要年付时先核实续费金额、退款限制和取消办法。首次价格、周期续费、额外费用分别记账。免费试用也需要读超额计费与资源回收规则。"},{"title":"记录结论而不是印象","text":"保留候选表、订单条款、原始测评和本地验收结果。网站中的选购向导输出的是检查建议，不会凭地区或运营商自动宣称某台机器“必稳”。"}],"refs":["lightsail","oracle","dmit-tos","netcup"],"level":"入门","tags":["选购","月付","预算"],"minutes":2},{"id":"naming","cat":"buying","title":"拆开一个型号：地区 / 平台 / 网络 / 档位","summary":"命名规则由商家决定，别拿一套规则套所有产品。","blocks":[{"title":"DMIT 示例","text":"LAX 可对应洛杉矶地区；AS3 是 DMIT 的 AMD EPYC 7003 系列硬件平台，不能读成 ASN 3。PRO / EB 等网络标识与硬件分开理解；具体商品仍以当前产品页完整说明为准。"},{"title":"VMISS 示例","text":"JP.TKY.IIJ.Basic 这类名称可以按“国家、城市、线路标签、套餐档位”阅读。Basic 与 Core 是商家档位名称，不构成跨商家性能标准；本版没有核实该具体 SKU 当前价格和库存。"},{"title":"社区昵称的陷阱","text":"黑五、传家宝、神机、限量款往往是活动背景或评价，不是配置。看不到完整 SKU、续费账单、到期时间与转移条款，不能仅凭昵称估值。型号解析器会把未知片段直接标成待核实。"}],"refs":["dmit","vmiss","netcup"],"level":"入门","tags":["AS3","PRO","EB","Basic","Core","型号"],"minutes":2},{"id":"remaining-value","cat":"buying","title":"剩余价值与溢价：先统一时间和币种","summary":"它是一种协商参考，不是官方退款金额。","blocks":[{"title":"按预付周期折算","text":"示例：一次预付 365 元覆盖 365 天，评估日距到期 100 天，则按日线性折算为 100 元。若剩余的是多年服务，应使用实际覆盖总天数，或逐个已付周期相加，不能拿一个年费比例误算全部年份。"},{"title":"溢价与实际支出","text":"卖家总报价减去折算价值，是卖家报价中的溢价；再加上 Push、付款手续费和立即必付费用，才是买家首付现金支出。后续续费另列。剩余价值为零时，溢价率没有有效分母。"},{"title":"并不等于可回收资金","text":"服务条款可能禁止转移、禁止退款，优惠也未必可继承。有人愿意为特殊资源付费，但高溢价并不保证将来能以同价转手。计算器不估计市场“公允价”，也不保证交易安全。"}],"refs":["dmit-tos","netcup"],"level":"入门","tags":["残值","剩余价值","溢价","续费"],"minutes":2},{"id":"push-account","cat":"buying","title":"Push、带邮箱、原邮：交易方式的边界","summary":"能登录后台，不代表你拥有稳定且合规的控制权。","blocks":[{"title":"先核实官方是否允许","text":"Push 通常指商家支持的服务转移，是否开放、多少钱、哪些优惠或 IP 能继承，都要具体确认。账号转让与单个服务转移是不同动作。DMIT 当前可读条款明确不允许账号转让，不能把带邮箱视为安全替代方案。"},{"title":"“原邮”并不消除找回风险","text":"初始注册邮箱、原支付方式、历史账单或身份材料可能参与后续争议。卖家提供邮箱密码不证明其无法找回。拒绝核验官方转移规则、催促不可逆付款、仅展示裁剪截图，均应提高警惕。"},{"title":"交接清单","text":"官方流程确认完成后，核对 SKU、IP、到期时间、续费金额与优惠继承。重装系统、轮换密钥、更新恢复信息并撤销旧会话。不要沿用来源不明的预装系统或把私人凭据交给卖家。"}],"refs":["dmit-tos","ssh"],"level":"入门","tags":["Push","原邮","带邮箱","转移","交易风险"],"minutes":2},{"id":"price-traps","cat":"buying","title":"首付很低，续费很高：价格页容易漏掉什么","summary":"促销、税费、流量和取消期限，都需要分别记。","blocks":[{"title":"三行预算","text":"第一行是首次现金支出；第二行是下一周期可验证的续费价；第三行是可能发生的额外成本。不要把首年促销除以 12 后当成永久月费，也不要把赠金理解成现金退款。"},{"title":"合约与取消","text":"按小时、按月付款不一定意味着没有其他合同约束。查看最低合约期、自动续费、取消提前期和特殊促销说明；尤其别以为不继续付款就等于按条款取消。"},{"title":"黑五与老套餐","text":"历史活动名称只说明来源。当前是否复刻、可否续费、能否迁移、是否已停售，应分别标注“当前官网”“历史信息”“卖家提供”“尚未核实”。本站不给未经核实的库存或优惠码。"}],"refs":["netcup","lightsail","dmit-tos"],"level":"入门","tags":["黑五","年付","促销","首付","合约"],"minutes":2},{"id":"hosting-roadmap","cat":"hosting","title":"从一份 HTML 到一个真正的网站","summary":"域名、DNS、Web 服务、HTTPS，再到备份监测。","blocks":[{"title":"最小结构","text":"域名是便于记忆的入口；DNS 把名字关联到地址或别名；Web 服务提供文件或转发应用请求；HTTPS 保护传输并验证站点身份。VPS 只是其中可选的承载环境之一。"},{"title":"本站如何上线","text":"本站是无后端静态网站，所有内容和脚本内嵌于 index.html。双击可离线阅读；上传到静态托管目录或 VPS 的 Web 根目录，也能提供公开访问。公网部署还需要配置域名、TLS、网络访问规则和所适用的合规要求。"},{"title":"应用变复杂时","text":"有登录、评论、支付或自动采集时，需另外设计服务端、数据库、鉴权、日志与隐私处理。不要把密钥藏在前端 JS 里；浏览器拿到的代码不是保密边界。"}],"refs":["dns","caddy","aws-vps"],"level":"入门","tags":["建站","HTML","静态网站","部署"],"minutes":2},{"id":"dns-https","cat":"hosting","title":"A、AAAA、CNAME、TTL 与 HTTPS","summary":"DNS 指路，TLS 验证连接，二者不能相互代替。","blocks":[{"title":"常用记录","text":"A 指向 IPv4 地址，AAAA 指向 IPv6 地址，CNAME 指向另一主机名。TTL 影响记录缓存期限，但修改后所有用户何时看到新值还受缓存与配置影响。切换前先检查新主机是否可服务。"},{"title":"HTTPS 的前提","text":"使用与域名匹配的证书，保护浏览器与服务器间传输。Caddy 可在满足域名控制验证与网络条件时自动管理 HTTPS；它不会凭空解决域名错误、防火墙阻断或错误的源站配置。"},{"title":"排错顺序","text":"先查 DNS 解析，再确认 TCP 连接与监听端口，再看 TLS 证书和主机名，最后查应用错误。遇到浏览器证书警告不应直接建议访客忽略。"}],"refs":["dns","caddy"],"level":"入门","tags":["DNS","A","AAAA","CNAME","TTL","HTTPS"],"minutes":2},{"id":"cdn-origin","cat":"hosting","title":"CDN、反向代理、源站：加速不是万能遮罩","summary":"访客可能先到边缘节点，再到你的 VPS。","blocks":[{"title":"CDN 做什么","text":"CDN 使用分布式节点缓存和交付内容，减少部分请求的距离与源站负担。动态请求、缓存命中率和回源路径决定效果，不是任何业务接入 CDN 都会更快。"},{"title":"源站仍然要安全","text":"正确配置 TLS、访问控制和必要的回源限制，避免把管理面板、数据库等管理入口开放给所有访客。CDN 不替代系统补丁、应用鉴权、备份或源站防火墙。"},{"title":"反向代理与正向代理","text":"反向代理代表服务器接收访问，可分发到不同后端；正向代理代表客户端向目标发起请求。两者都叫代理，但配置目标与风险边界不同。"}],"refs":["cdn","caddy","docker"],"level":"入门","tags":["CDN","源站","反向代理","Cloudflare"],"minutes":2},{"id":"linux-first-hour","cat":"hosting","title":"开机后的第一小时：一份安全起步清单","summary":"先能找回服务器，再调整 SSH 和防火墙。","blocks":[{"title":"先建立恢复通道","text":"确认控制台或救援系统可用，保存实例和账单信息。使用受支持的系统镜像；更新软件包。不要在不懂命令后果时粘贴大段一键优化脚本。"},{"title":"SSH 按顺序改","text":"创建日常管理账户、配置密钥并在第二个会话验证成功，再根据需求限制 root 和密码登录。变更前备份配置，检查语法，保持原会话直到新连接通过。"},{"title":"只开放必要服务","text":"盘点监听端口，配置云防火墙与系统防火墙，并从外部验证。Docker 发布端口与主机防火墙的相互作用要单独检查，不能仅看 UFW 显示开启就认为容器端口已限制。"}],"refs":["ssh","docker"],"level":"实践","tags":["SSH","Linux","防火墙","UFW","Docker"],"minutes":2},{"id":"backup-monitor","cat":"hosting","title":"备份、快照和监控：三件事不能互相代替","summary":"真正的备份，以能够恢复为验收标准。","blocks":[{"title":"不要只留同机副本","text":"同机备份会和故障盘、被入侵系统或被删除实例一起丢失。重要数据在独立故障域保留可恢复副本，保护备份访问凭据，并根据数据重要性设置保存周期。"},{"title":"快照与应用一致性","text":"系统快照便于恢复某个时间点，但运行中的数据库仍需合适的一致性处理。保存配置、数据库和文件时，记录如何恢复，定期在隔离环境验证恢复流程。"},{"title":"监控需要在故障时还能通知","text":"使用 Uptime Kuma 等工具观察服务可用性；监控全放在同一台 VPS 时，整机失联可能连通知也发不出。根据可承受风险增加独立监测点，并测试告警与恢复通知。"}],"refs":["restic","uptime","do"],"level":"实践","tags":["备份","快照","监控","恢复"],"minutes":2},{"id":"migration","cat":"hosting","title":"迁移 VPS：先能回滚，再切流量","summary":"服务迁移不等于一定能保留 IP 或原价。","blocks":[{"title":"把依赖列全","text":"系统、架构、软件版本、环境变量、数据库、上传文件、定时任务、证书和 DNS 记录都要纳入清单。不要把仅复制网页目录当作完整应用迁移。"},{"title":"先测试再切换","text":"在目标环境恢复备份，使用测试域名或本地解析核验；需要时安排写入冻结或数据同步。切换后检查解析、证书、关键业务和日志，在验证窗口内保留旧环境供回滚。"},{"title":"迁机房不是所有产品都有的按钮","text":"商家对套餐升降级、跨代升级、跨区迁移及 IP 保留的规定不同。比如 netcup 的当前 FAQ 明确地区变更需要新建再手动迁移；不要把其他商家的迁移功能套用过来。"}],"refs":["netcup","dns","restic"],"level":"进阶","tags":["迁移","回滚","DNS","机房"],"minutes":2},{"id":"account-risk","cat":"security","title":"账户风控：保护自己，不寻找“免检秘诀”","summary":"真实资料、正确使用范围和凭据管理，比赌一个 IP 标签更重要。","blocks":[{"title":"商家为什么可能要求验证","text":"注册、支付、异常登录、资源滥用或账户争议可能涉及验证。具体规则取决于条款。不要提供虚假身份、使用来源不明的付款方式或购买无法核实归属的账号。"},{"title":"把根账户保护起来","text":"密码管理器、不同站点独立密码、多因素认证和离线保存的恢复码，是降低账户被接管风险的合理做法。服务 API 密钥用最小权限，不放进公开仓库、报告或网页源码。"},{"title":"异常后先止损","text":"撤销可疑会话和凭据，检查账单与资源，保留必要日志，通过官方工单核实。不能把所有故障都解释成“被风控”，也不应凭猜测反复购买新账号。"}],"refs":["dmit-tos","ssh"],"level":"入门","tags":["账户","2FA","支付","风控"],"minutes":2},{"id":"threat-model","cat":"security","title":"你的风险来自哪里？先做一个小型威胁模型","summary":"商家、操作系统、应用和本地设备，都在链路里。","blocks":[{"title":"分别看四层","text":"基础设施层有机房与商家故障；系统层有补丁、权限与服务暴露；应用层有代码与身份验证；终端层有设备安全和凭据泄露。租一台“专用”服务器并不会自动消除这些问题。"},{"title":"优先减少攻击面","text":"删除不用的服务，限制管理入口，及时处理已知漏洞，避免公开 Redis、数据库或容器控制接口。访问控制和备份要定期实测，而不是只检查配置文件存在。"},{"title":"不要夸大匿名性","text":"自管服务器改变信任边界，并不等于没有服务商、网络或账户记录。使用受支持的加密协议保护传输，遵守服务和法律要求，不把技术标签当成匿名承诺。"}],"refs":["ssh","docker","wireguard","dmit-tos"],"level":"入门","tags":["隐私","权限","安全","攻击面"],"minutes":2},{"id":"compliance","cat":"security","title":"建站合规与服务条款：上线前的核对项","summary":"只给核查框架，不把地区标签当作法律结论。","blocks":[{"title":"先识别业务与管辖","text":"面向哪些用户、收集哪些个人信息、是否收费、是否有用户上传内容、服务器与运营主体在哪些地区，会影响需要核查的要求。涉及中国大陆接入时，应向接入商及官方备案平台确认适用的备案或许可安排。"},{"title":"不同要求不能混成一项","text":"域名注册、网站接入备案、特定业务许可、个人信息与数据处理、版权和支付规则，分别核查。海外部署不意味着不受任何法律或服务政策约束。具体业务决策需要适格专业人士确认。"},{"title":"本版边界","text":"本次未取得工信部入口的可解析正文，因此不列具体办理天数、材料或对你的业务作法律判断。站内提供官方入口和核对清单，不提供规避监管或平台规则的操作。"}],"refs":["icp","dmit-tos","ali"],"level":"入门","tags":["合规","备案","ICP","条款","隐私"],"minutes":2},{"id":"fraud-check","cat":"security","title":"交易红旗：低价不是安全信号","summary":"把“能买到”和“买完可持续使用”分开。","blocks":[{"title":"交易前的红旗","text":"没有完整 SKU、续费账单和到期日；用测速截图代替控制权证明；否认官方条款；催促不可逆付款；无法说明转移是否保留 IP/优惠；这些情况值得暂停，而不是靠打折补偿未知风险。"},{"title":"防止偷换概念","text":"带邮箱不是官方 Push；“永久优惠”不是不受条款变化影响；历史神机不是当前库存；“独享 IP”不是独享端口；跑分全绿不是账号安全证明。把卖家每项承诺转成可核验字段。"},{"title":"交接后的动作","text":"遵循商家允许的交接方式，确认账户归属与计费，重装系统、轮换凭据、清理旧授权、验证网络和备份。不能核验转移授权时，不建议为了省一点钱接受不清晰的所有权。"}],"refs":["dmit-tos","ssh","ipquality"],"level":"入门","tags":["诈骗","交易","红旗","原邮"],"minutes":2},{"id":"vpn-software","cat":"basics","title":"常见“VPN 软件”：客户端、核心和商业服务对照","summary":"名称都很熟悉，但它们提供的并不是同一种东西。","blocks":[{"title":"Clash Verge Rev、v2rayN：图形客户端","text":"Clash Verge Rev 是图形客户端，内置 Mihomo 核心；v2rayN 是支持 Xray、sing-box 等核心的图形客户端。它们帮助管理配置与连接，但安装软件本身不代表获得远程出口。要区分原项目发行包、第三方包装和节点供应商。"},{"title":"Mihomo、sing-box：核心与工具体系","text":"核心负责协议、连接和路由规则；界面由对应客户端提供。配置不一定互通，格式、功能与系统要求应查对应版本文档。一个订阅能否导入，不代表每项功能在所有核心上完全一致。"},{"title":"WireGuard、OpenVPN、Tailscale：隧道与组网","text":"WireGuard 和 OpenVPN 可以用于搭建受你控制的加密隧道；需要可用端点与密钥配置。Tailscale 把设备组网、身份与访问管理组织成服务。三者不等于默认提供全球公共出口的“机场”。"},{"title":"Proton VPN 一类服务：应用加供应商运营","text":"商业 VPN 通常将客户端、账户与运营出口一起交付。它与“租 VPS 自己维护”的责任边界不同。这里仅作为类别示例，不承诺特定地区可用、隐私绝对安全或适合你的业务。比较时应检查条款、审计范围、设备限制和当地适用要求。"}],"refs":["clash-verge","v2rayn","singbox","mihomo","wireguard","openvpn","tailscale","protonvpn"],"level":"入门","tags":["Clash Verge","v2rayN","sing-box","VPN软件"],"minutes":2}],"providers":[{"id":"dmit","name":"DMIT","short":"DM","group":"线路导向","region":["亚太","北美"],"families":["Cloud Instance · AS3 / AN4 / AN5","Premium / Eyeball / Tier 1"],"desc":"硬件平台与网络系列分开命名，适合练习从完整 SKU 识别产品。","caution":"网络宣传不代替本地测试；账号转让被当前条款禁止。","refs":["dmit","dmit-tos"],"billing":"月付 / 年付；依 SKU","status":"产品入口已核对"},{"id":"vmiss","name":"VMISS","short":"VM","group":"线路导向","region":["亚太","北美"],"families":["JP.TKY.IIJ.Basic / Core · 命名示例","地区 + 线路 + 档位"],"desc":"适合作为地区、线路与档位拆解案例；具体套餐本次未核实。","caution":"首页可读但结算页未取得。Basic、Core、IIJ 示例不代表当前在售或固定配置。","refs":["vmiss"],"billing":"价格、币种与周期待结算页核对","status":"具体 SKU 待核实"},{"id":"bwh","name":"BandwagonHost · 搬瓦工","short":"BW","group":"线路导向","region":["北美","亚太"],"families":["VPS Hosting","CN2 GIA 系列"],"desc":"官方提供 VPS 与 CN2 GIA 产品入口；按完整套餐核对机房和迁移权限。","caution":"历史昵称不代表当前库存；机房可选范围、流量与转移须逐套餐确认。","refs":["bwh"],"billing":"查看官方结算页","status":"产品入口已核对"},{"id":"racknerd","name":"RackNerd","short":"RN","group":"预算型","region":["北美","欧洲"],"families":["KVM VPS","黑五套餐 · 历史活动分类"],"desc":"官方 KVM 产品覆盖多机房，社区活动机常按年份和资源配置辨认。","caution":"不要从价格推断中国大陆优化线路；活动配置、倍流量和续费以订单证据为准。","refs":["racknerd"],"billing":"查看官方结算页","status":"产品入口已核对"},{"id":"hetzner","name":"Hetzner","short":"HZ","group":"通用云","region":["欧洲","北美","亚太"],"families":["Cloud · Shared Resources","Cloud · Dedicated Resources"],"desc":"从共享与独立资源的区别开始筛选，再核对架构、地区和流量费用。","caution":"具体 SKU 与不同地区配额会变化；不等于中国大陆优化线路。","refs":["hetzner"],"billing":"查看官方结算页","status":"产品入口已核对"},{"id":"do","name":"DigitalOcean","short":"DO"," 或优化线路保证。","refs":["bgp"]},{"term":"ASN","cat":"网络","meaning":"自治系统编号。","note":"不要把型号 AS3 当作 AS 路径。","refs":["bgp","dmit"]},{"term":"Peering","cat":"网络","meaning":"网络间针对约定流量互联。","note":"覆盖范围与容量依协议。","refs":["bgp"]},{"term":"Transit","cat":"网络","meaning":"通过上游获得更广泛的网络可达性。","note":"上游品牌不能代替实测。","refs":["bgp"]},{"term":"CN2 / GIA / GT","cat":"网络","meaning":"中国电信相关网络及商业线路标签。","note":"识别单个跳不能证明全程商业等级。","refs":["dmit"]},{"term":"9929","cat":"网络","meaning":"VPS 讨论中常用来指联通相关精品网络 AS9929。","note":"仍要看方向和完整路径。","refs":["dmit"]},{"term":"CMI / CMIN2","cat":"网络","meaning":"移动国际网络相关标签。","note":"不同网络产品和路由实现需分别核验。","refs":["dmit"]},{"term":"IIJ","cat":"网络","meaning":"日本网络运营商 Internet Initiative Japan 的简称。","note":"线路标签不保证每段只走一家网络。","refs":[]},{"term":"RTT","cat":"网络","meaning":"Round-Trip Time，往返响应时间。","note":"不是单向时延。","refs":["mtr"]},{"term":"Jitter / 抖动","cat":"网络","meaning":"延迟随时间的变化程度。","note":"要比较相同的测量口径。","refs":["iperf"]},{"term":"Loss / 丢包","cat":"网络","meaning":"探测未收到预期响应的比例。","note":"中间跳不响应不等于业务丢包。","refs":["mtr"]},{"term":"Mbps / MB/s","cat":"网络","meaning":"兆比特每秒 / 兆字节每秒，十进制下相差 8 倍。","note":"MiB/s 是另一种二进制单位。","refs":[]},{"term":"入口 / 落地","cat":"网络","meaning":"首次接入的服务节点 / 最终出口节点，社区语境。","note":"两者地理位置未必一致。","refs":["mihomo"]},{"term":"中转","cat":"网络","meaning":"在客户端与最终目标之间增加转发节点。","note":"可能改善路径，也增加成本和故障点。","refs":["mihomo"]},{"term":"绕路 / 绕美","cat":"网络","meaning":"社区对路径偏离直观地理路线的描述。","note":"路由地理库不总是精确；以证据为准。","refs":["nexttrace"]},{"term":"晚高峰","cat":"网络","meaning":"用户所在地常见的晚间高负载时段。","note":"不是固定且普遍一致的时刻。","refs":[]},{"term":"NQ","cat":"测试","meaning":"本站将 NodeQuality 相关语境与其他同缩写项目分开。","note":"请核对原报告链接与抬头。","refs":["nq"]},{"term":"RQ","cat":"测试","meaning":"本版未能核实其唯一项目指代，保留歧义。","note":"不擅自扩写为 RouteQuality，也不改成 RN。","refs":[]},{"term":"NetQuality","cat":"测试","meaning":"xykt 的网络质量检测项目。","note":"与 NodeQuality、IPQuality 不混为一谈。","refs":["netquality"]},{"term":"IPQuality","cat":"测试","meaning":"xykt 的 IP 质量与服务探测项目。","note":"结果不等于目标平台内部风控。","refs":["ipquality"]},{"term":"YABS","cat":"测试
