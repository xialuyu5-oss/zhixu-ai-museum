function hValidateAction(a){if(!a||typeof a!=='object'||Array.isArray(a)||Object.keys(a).sort().join(',')!=='args,tool')throw Error('动作必须只有 tool 与 args 两个字段。');if(!['read_logs','write_report'].includes(a.tool))throw Error('工具不在白名单：'+a.tool);if(!a.args||typeof a.args!=='object'||Array.isArray(a.args))throw Error('args 必须是对象，不是字符串。');if(a.tool==='read_logs'&&JSON.stringify(a.args)!==JSON.stringify({snapshot:'demo'}))throw Error('只能读取授权的 demo 快照。');if(a.tool==='write_report'){const b=a.args.body;if(a.args.path!=='report.json'||Object.keys(a.args).sort().join(',')!=='body,path')throw Error('只允许写入指定的 report.json。');if(!b||typeof b!=='object'||Object.keys(b).sort().join(',')!=='count,evidence,status,task'||b.task!==HL.task||!Number.isInteger(b.count)||!Array.isArray(b.evidence)||!b.evidence.every(Number.isInteger)||b.status!=='draft')throw Error('报告 schema 或字段类型不符合合同。');}}
function hLabStep(){if(['DONE','FAILED','DENIED','STOPPED','WAIT_APPROVAL'].includes(HL.state))return;if(HL.step>=HL.budget){HL.state='STOPPED';hEvent('BUDGET','步数耗尽，停止，不自动延长预算。');hLab();return;}HL.step++;try{if(HL.state==='NEW'){const p={tool:HL.fault==='illegal-tool'?'restart_device':'read_logs',args:HL.fault==='bad-schema'?'demo':{snapshot:'demo'}};hEvent('PROPOSAL',JSON.stringify(p));hValidateAction(p);if(HL.fault==='transient'&&HL.retries===0){HL.retries++;hEvent('RETRY','模拟超时：仅允许再试 1 次。');}else{HL.observations=[{line:1,code:'OK'},{line:2,code:'E42'},{line:3,code:'E42'},{line:4,code:'E42'}];HL.state='READ';hEvent('OBSERVATION','读取 4 行教学日志，来源行号随结果保留。');}}
 else if(HL.state==='READ'){const lines=HL.observations.filter(r=>r.code==='E42').map(r=>r.line);HL.pending={tool:'write_report',args:{path:'report.json',body:{task:HL.task,count:lines.length,evidence:lines,status:'draft'}}};hValidateAction(HL.pending);HL.state='WAIT_APPROVAL';hEvent('APPROVAL_REQUIRED','提议保存报告，等待当前动作的人工审批。');}
 else if(HL.state==='EXECUTE'){hValidateAction(HL.pending);if(HL.approved!==hApprovalKey())throw Error('动作或任务版本已经变化，原审批失效，必须重新审批。');if(HL.fault==='false-success'){hEvent('TOOL_RESULT','模拟有缺陷的工具仅返回 OK，没有保存产物。');}else if(HL.artifact){if(JSON.stringify(HL.artifact)!==JSON.stringify(HL.pending.args.body))throw Error('已有产物与当前动作不一致，不静默覆盖。');hEvent('IDEMPOTENT','同一份报告已存在，不重复写入。');}else{HL.artifact=JSON.parse(JSON.stringify(HL.pending.args.body));hEvent('ARTIFACT','报告保存到沙盒内存；这不是设备上的真实工单。');}HL.state='VERIFY';}
 else if(HL.state==='VERIFY'){if(!HL.artifact)throw Error('未找到产物；工具声称成功不等于任务完成。');const b=HL.artifact;if(b.task!=='demo-e42'||b.count!==3||JSON.stringify(b.evidence)!=='[2,3,4]'||b.status!=='draft')throw Error('独立验证失败：报告字段或证据不符合任务合同。');HL.state='DONE';hEvent('VERIFIED','重新检查产物：E42=3，来源行号 2/3/4，任务和状态正确。');}}
 catch(e){HL.state='FAILED';hEvent('FAILED',e.message);}hLab();}
function hLab(){const terminal=['DONE','FAILED','DENIED','STOPPED'].includes(HL.state);$('#main').innerHTML=heading('HARNESS LAB / DETERMINISTIC','让运行过程变得可见。','这是一个可操作的教学状态机：Planner 提议、程序校验、人工审批、写入与独立验收。所有数据均为模拟，不调用真实模型或设备。')+`<div class="h-lab-toolbar panel"><label>失败注入<select id="h-lab-fault" ${HL.step?'disabled':''}>${HFAULTS.map(([v,t])=>`<option value="${v}" ${HL.fault===v?'selected':''}>${t}</option>`).join('')}</select></label><label>总步数预算<input id="h-lab-budget" type="number" min="1" max="30" value="${HL.budget}" ${HL.step?'disabled':''}></label><button class="btn btn-primary" data-action="h-lab-next" ${terminal||HL.state==='WAIT_APPROVAL'?'disabled':''}>执行一步 ${icon('play','sm')}</button><button class="btn" data-action="h-lab-stop" ${terminal?'disabled':''}>停止</button><button class="btn" data-action="h-lab-reset">重置实验</button></div><div class="h-lab-states">${['NEW','READ','WAIT_APPROVAL','EXECUTE','VERIFY','DONE'].map((s,i)=>`<div class="${HL.state===s?'active':''}"><span>0${i+1}</span><strong>${HSTATES[s]}</strong></div>`).join('')}</div><div class="h-lab-status ${HL.state==='FAILED'||HL.state==='STOPPED'?'error':''}" role="status"><span class="status-dot"></span><strong id="h-state-label">${HL.state} · ${HSTATES[HL.state]}</strong><span>已用 ${HL.step} / ${HL.budget} 步 · 重试 ${HL.retries} / 1</span></div><div class="h-lab-grid"><section class="panel h-lab-contract"><h2>01 / 合同与边界</h2><p>分析固定日志里的 E42，形成带行号的草稿报告。不得重启、删除或访问其他文件。</p><div class="h-tool-row"><span class="tag accent">read_logs</span><span>只读教学快照</span></div><div class="h-tool-row"><span class="tag orange">write_report</span><span>保存前必须审批</span></div><div class="h-acceptance"><strong>完成条件由验证器判断</strong><p>报告存在、任务匹配、次数 3、行号 [2,3,4]、状态 draft。不是模型说“完成”就完成。</p></div><h3>最新观察</h3>${nCode(HL.observations.length?JSON.stringify(HL.observations,null,2):'还没有执行读日志工具。')}<div class="hero-actions"><a class="btn btn-sm" href="#agent-cases/ops">完整场景设计</a><a class="btn btn-sm" href="#projects/harness-runtime">Python 运行器</a></div></section><section class="panel h-lab-action"><h2>02 / 下一步提议与审批</h2>${nCode(HL.pending?JSON.stringify(HL.pending,null,2):'Planner 尚未提出写入动作。')}<div class="h-approval-actions"><button class="btn btn-primary" data-action="h-lab-approve" ${HL.state!=='WAIT_APPROVAL'?'disabled':''}>批准当前动作</button><button class="btn" data-action="h-lab-deny" ${HL.state!=='WAIT_APPROVAL'?'disabled':''}>拒绝</button></div><p class="h-caption">批准绑定任务版本与完整参数。修改后的动作不能沿用之前的授权。界面只演示这一机制，不构成真实身份认证。</p><h3>实际沙盒产物</h3><div id="h-artifact">${nCode(HL.artifact?JSON.stringify(HL.artifact,null,2):'无产物。')}</div></section></div><section class="panel h-trace-panel"><div class="section-head"><div><h2>03 / 事件轨迹与检查点</h2><p>记录动作与观察，不记录模型私密思维链。检查点只在当前浏览器保存。</p></div><div class="h-trace-actions"><button class="btn btn-sm" data-action="h-lab-save">保存检查点</button><button class="btn btn-sm" data-action="h-lab-restore">恢复检查点</button><button class="btn btn-sm" data-action="h-lab-export">导出事件记录</button></div></div><div class="h-trace" aria-live="polite">${HL.trace.length?HL.trace.map(e=>`<div><span>${String(e.sequence).padStart(2,'0')}</span><b>${esc(e.type)}</b><p>${esc(e.detail)}</p></div>`).join(''):'<p class="h-caption">执行第一步以后，这里显示真实的沙盒状态变化。</p>'}</div></section><div class="h-provenance">${icon('info','sm')}<span>这里的“实际产物”仅指浏览器沙盒中的对象。要观察真实文件保存、进程退出和跨进程恢复，请运行配套 Python 教学项目；两者都不是生产沙箱。</span></div>`;}

function hProject(p){$('#main').innerHTML=heading('RUNNABLE HARNESS',p.name,p.description)+`<div class="h-case-layout"><article class="panel h-case-main">${tags(['Python 标准库','确定性 Planner','无网络 / 无模型 API'])}<h2>01 / 在新的练习目录保存脚本</h2><p>需要 Python 3.10+。脚本只读写专用工作目录，拒绝默认覆盖已有工作目录。不要在生产项目目录练习。</p><button class="btn btn-primary" data-action="n-project-file" data-id="${p.id}">下载 harness_runtime.py</button><h2>02 / 启动，查看审批前的状态</h2>${nCode('python harness_runtime.py --workspace ./harness-demo')}<p>运行器先读取教学数据，提出保存报告的动作，然后以 WAIT_APPROVAL 暂停。打开 checkpoint.json 查看待审批内容。</p><h2>03 / 审批并恢复</h2>${nCode('python harness_runtime.py --workspace ./harness-demo --resume --approve')}<p>审批绑定完整参数。程序保存 report.json，再独立检查报告内容后进入 DONE；使用 --deny 则结束任务而不写报告。</p><h2>04 / 主动测试失败</h2>${nCode('python harness_runtime.py --workspace ./fault-demo --fault false-success\npython harness_runtime.py --workspace ./fault-demo --resume --approve\npython harness_runtime.py --self-test')}<p>模拟工具说成功但未保存：最终状态必须是 FAILED。另可测试 transient、illegal-tool、bad-schema 和较小步数预算。</p><h2>05 / 代码与上线差距</h2>${xNote(esc(p.limits),true)}<details class="n-detail"><summary>完整源码（含 16 个单元测试）</summary>${nCode(p.code)}</details><h3>如何接入真实模型？</h3><p>替换 propose() 的确定性 Planner：只把任务、允许工具的 schema 和当前必要观察送到模型适配器。模型返回的动作仍必须经过 validate()、权限与审批检查。API Key、身份认证、网络超时和计费限额应放在服务端；不要把模型输出交给 eval、exec 或任意 shell。</p></article><aside class="h-lesson-aside"><div class="panel h-note"><strong>预期输出文件</strong><p>checkpoint.json<br>report.json（仅在批准后）</p><a class="source-link" href="#harness-lab">先看网页沙盒 →</a><a class="source-link" href="#agent-cases/ops">对应完整设计 →</a><a class="source-link" href="#harness/h-06">理解检查点与幂等 →</a></div></aside></div>`;}

function mDeeper(g){const notes={origins:['AI 不是一种单一能力','识别、预测、推荐与生成有不同的任务目标。先定义输入和验收，再选规则、传统机器学习或大模型。'],models:['这几个数字，不能互相代替','参数是模型中的数值；Token 是特定分词规则的单位；上下文是一次处理的容量；算力、内存与带宽约束实际运行。它们都不是通用的“聪明程度”。'],connections:['连接协议，不是安全许可证','工具是可执行能力，MCP 是连接模型应用与外部能力的一种协议。权限、业务校验和用户同意仍要由应用实现。'],workshop:['Harness 是运行系统，不是另一个模型','模型负责提出候选行动。Harness 负责提供上下文、校验、执行、记录、恢复和验收。工作流则规定哪些步骤何时发生。'],scenarios:['先做只读辅助，再扩大权限','草稿和建议通常比自动执行更容易检查。写入、发送、付款、删除等动作应单独设计审批和恢复，不因模型回答流畅就放开。'],mechanics:['这是一扇窗，不是整个模型','展品刻意缩小为少量 Token 和矩阵。真实 Transformer 包含多层、多头、位置处理、残差与归一化等结构，具体架构会不同。'],boundaries:['“开放”与“安全”各有多个维度','权重、代码、数据和许可证要分别核对；安全不只是一条系统提示，还包括身份、最小权限、隔离、日志和实际结果验证。'],observatory:['把事实、判断和未知分开','优先追溯原始出处。发布日期不等于功能生效日期；厂商主张、个人观点与本站实测也不能混为一谈。'],future:['对未知保持精确','关于通用智能的研究会使用不同任务、能力范围与自治框架。没有在本页计算所谓“AGI 完成百分比”，也不预测到来的日期。']}[g.id];return `<section class="m-deep-grid"><div class="m-deep-panel"><div class="m-kicker">UNDER THE SURFACE</div><h2>${notes[0]}</h2><p>${notes[1]}</p><details class="m-accordion"><summary>为什么先给你一个可以动手的展品？</summary><p>先观察变化，再提出解释，最后查看原始资料。教学模拟只展示特定机制，不代表真实模型的质量、性能或安全性。</p></details>${mSource(g.sources)}</div><div class="m-deep-panel"><div class="m-kicker">GO DEEPER</div><h2>展品之外，完整资料。</h2><div class="m-deep-links">${g.links.map(([href,t])=>`<a href="#${href}"><span>${t}</span><span>↗</span></a>`).join('')}</div></div></section>`;}

const mCaps={work:[['会议纪要','把零散记录整理成可确认的行动项。','会议记录 → 信息整理 → 纪要草稿','产品：周三确认需求。研发：周五提供原型。','行动项 / 负责人 / 日期','实际使用仍要确认录音授权、人物与日期。'],['代码理解','从陌生代码里找到结构、调用和疑点。','代码片段 → 解释与检索 → 可复查的线索','read_config() → validate() → apply()','文件路径 / 函数 / 待验证项','生成解释不证明代码正确；通过测试与审查验证。'],['日志分析','先计数，再解释，不让模型替代证据。','日志样本 → 规则提取 + 解释 → 异常报告','E42 · E42 · INFO · E42','E42：3 次 / 来源：3 条记录','简单计数先用程序。AI 可以帮助组织解释，但不能编造原因。']],life:[['学习材料','把知识变成问题，而不是替你宣布学会。','学习笔记 → 出题与提示 → 待回答的问题','概念：模型、参数、Token、工具','你能用自己的话区分这些概念吗？','以提供的学习材料为依据，不自动判定掌握程度。'],['生活计划','把偏好与限制组织成一份可修改的草案。','时间 + 偏好 → 约束整理 → 行程草稿','周六 / 半天 / 室内优先 / 需留休息时间','活动 A → 休息 → 活动 B','这里没有真实地点、票价或预约；时刻与资格需另外核验。'],['票据归类','从记录里提取结构，再交给人核对。','示例票据 → 提取与分类 → 可检查的表格','示例 A 28 元 / 示例 B 35 元 / 示例 C 12 元','教学合计：75 元','不连接账户。金额用程序计算，识别结果需要人工复核。']]};
function mOrigins(){const caps=mCaps[M.capKind],c=caps[M.cap]||caps[0];return mLab('看见 AI，已经在发生','选择一个场景，观察输入、处理方式与可验证结果。',`${mSeg('cap-kind',[['work','工作中的 AI'],['life','生活中的 AI']],M.capKind)}<div class="m-lab-body"><div class="m-lab-split"><div><div class="m-capability-list">${caps.map((v,i)=>mB('cap',esc(v[0]),`data-index="${i}" aria-pressed="${M.cap===i}"`,'')).join('')}</div><div class="m-visual-stage m-grid-bg"><div class="m-stage-top"><span>INPUT → TRANSFORM → CHECK</span><span>EXHIBIT 01</span></div><div class="m-document"><div class="m-document-top"><i></i><span>示例输入</span><small>LOCAL SAMPLE</small></div><p>${esc(c[3])}</p><div class="m-document-row"></div><div class="m-document-row" style="width:78%"></div><div class="m-document-row" style="width:56%"></div><div class="m-extracted"><span class="m-document-label">可检查的输出</span><strong>${esc(c[4])}</strong></div></div></div></div><div class="m-explanation"><div class="m-step-count">WORK / LIFE</div><h3>${c[0]}，<br>重点不只是“生成”。</h3><p>${c[1]}</p><div class="m-inout">${c[2].split(' → ').map(v=>`<span>${esc(v)}</span>`).join('<i>↓</i>')}</div>${mNotice(c[5])}${mHelp('所有示例均为预先编写的教学样本，没有调用真实模型。')}</div></div><div class="m-lineage">${[['手写规则','人明确规定条件与动作'],['从数据学习','使用样本拟合模式'],['生成内容','依据输入形成候选输出'],['连接工具','程序执行行动并返回结果']].map(([a,b],i)=>`<div><span>0${i+1}</span><strong>${a}</strong><small>${b}</small></div>`).join('')}</div>${mHelp('这是能力与方法的概念地图，不是严格年代划分。规则与学习方法今天仍可一起使用。')}</div>`);}
const mDictionary=['人工智能','大模型','上下文','世界','理解','学习','这个','你好','Token','token','AI','learns','from','data','agent'];
function mToyTokens(text){const chars=Array.from(String(text).slice(0,1600));const dict=[...mDictionary].sort((a,b)=>b.length-a.length);const out=[];let rest=chars.join('');while(rest){let tok=dict.find(t=>rest.startsWith(t));if(!tok)tok=Array.from(rest)[0];out.push(tok);rest=rest.slice(tok.length);}return out;}
function mWeightGiB(p,b){return p*1e9*b/8/2**30;}

 if(M.modelTab==='tokens'){const tokens=mToyTokens(M.text);body=`<div class="m-lab-split"><div><div class="m-visual-stage m-grid-bg" style="min-height:340px"><div class="m-stage-top"><span>TEXT → UNITS</span><span>教学分词规则</span></div><div class="m-token-view">${tokens.map((t,i)=>`<span class="m-token"><strong>${esc(t===' '?'␣':t==='\n'?'↵':t)}</strong><small>unit ${String(i+1).padStart(2,'0')}</small></span>`).join('')}</div></div><div class="m-summary-row"><div><strong>${Array.from(M.text).length}</strong><span>Unicode 码点数</span></div><div><strong>${tokens.length}</strong><span>教学分词单元</span></div><div><strong>≠</strong><span>真实模型计费数量</span></div></div></div><div class="m-explanation"><h3>模型不直接读“整句话”。</h3><p>分词器先把输入变成单元，再映射到编号。不同模型的词表和规则不同，同一段话的切分也可能不同。</p>${mField('改一改这段文字',`<textarea id="m-token-input" rows="4" maxlength="1600">${esc(M.text)}</textarea>`)}${mNotice('这里使用少量词条 + 单字符回退的教学规则，不是任何模型的真实 Tokenizer，也不能用来算账。')}${mHelp('unit 编号只是展品内的位置，不是真实词表 ID。空格显示为 ␣，换行显示为 ↵。')}${mA('article/tokens-context','读懂 Token 与上下文')}</div></div>`;}
 else if(M.modelTab==='memory'){const mem=mWeightGiB(M.params,M.bits);body=`<div class="m-lab-split"><div class="m-visual-stage m-grid-bg"><div class="m-stage-top"><span>PARAMETERS × PRECISION</span><span>纯权重估算</span></div><div class="m-cube-stack">${Array.from({length:Math.min(12,Math.ceil(M.params/1.5))},(_,i)=>`<div class="m-cube" style="--i:${i};opacity:${.45+i*.04}"></div>`).join('')}</div><div class="m-weight-display"><strong>${mem.toFixed(2)}<small> GiB</small></strong><span>${M.params}B 参数 × ${M.bits} 位 ÷ 8 ÷ 2³⁰</span></div></div><div class="m-explanation"><h3>参数量不是“知识条数”。</h3><p>参数是模型中可学习的数值。位数决定每个数值的存储开销；量化还可能影响精度与实际运行方式。</p>${mField(`总参数量：${M.params}B`,`<input id="m-params" type="range" min="1" max="14" value="${M.params}" step="1">`)}${mField('存储位数',`<select id="m-bits">${[4,8,16].map(v=>`<option value="${v}" ${M.bits===v?'selected':''}>${v} 位</option>`).join('')}</select>`)}${mNotice('这是纯权重理论值。不含 KV Cache、量化元数据、运行缓冲区和框架开销；不保证能加载或达到某种速度。')}${mA('local-models','查看本地小模型与条件')}</div></div>`;}
 else if(M.modelTab==='context'){const labels={system:'系统与任务',evidence:'检索证据',history:'对话历史',tools:'工具结果',reserve:'预留输出'};const sum=Object.values(M.ctx).reduce((a,b)=>a+b,0);body=`<div class="m-lab-split"><div><div class="m-visual-stage m-grid-bg"><div class="m-stage-top"><span>CONTEXT WINDOW / 8,192</span><span>预算示意</span></div><div class="m-budget-stack">${Object.entries(M.ctx).map(([k,v],i)=>`<div class="m-budget-piece ${k==='reserve'?'reserve':''}" style="min-height:${38+v/80}px;--i:${i}"><span>${labels[k]}</span><strong>${v.toLocaleString()}</strong></div>`).join('')}</div></div><div class="m-budget-meter"><i style="width:${Math.min(100,sum/8192*100)}%;background:${sum>8192?'var(--m-bad)':'var(--m-accent)'}"></i></div>${mNotice(`${sum.toLocaleString()} / 8,192 教学预算单位 · ${sum>8192?'超出 '+(sum-8192)+'，需要压缩或移除输入':'剩余 '+(8192-sum)}`,sum>8192?'error':'success')}</div><div class="m-explanation"><h3>上下文，不等于长期记忆。</h3><p>有限空间里，哪些信息与当前任务相关？工具返回和检索资料也会占位置。保留多少输出空间，同样要在运行前规划。</p>${Object.entries(M.ctx).map(([k,v])=>mField(`${labels[k]}：${v}`,`<input type="range" min="0" max="4000" step="100" value="${v}" data-m-ctx="${k}">`)).join('')}${mHelp('数值由你手动指定，不是真实文本分词结果。真实服务的窗口和输入／输出上限需看具体文档。')}</div></div>`;}

const mQ=[[.8,.1,.2],[.2,.9,.3],[.8,.7,.1],[.7,.6,.9],[.1,.3,.8]],mK=[[.8,.2,.1],[.1,.8,.4],[.6,.7,.2],[.9,.5,.8],[.2,.1,.9]],mV=[[.2,.8,.1],[.3,.4,.7],[.7,.3,.5],[.8,.6,.4],[.1,.5,.9]];
function mAttention(qIndex=3,temp=1,causal=true){const q=mQ[qIndex];const logits=mK.map((k,j)=>causal&&j>qIndex?-Infinity:k.reduce((s,x,i)=>s+x*q[i],0)/Math.sqrt(3)/temp);const max=Math.max(...logits);const exps=logits.map(v=>v===-Infinity?0:Math.exp(v-max));const sum=exps.reduce((a,b)=>a+b,0);const weights=exps.map(v=>v/sum);const value=[0,1,2].map(i=>mV.reduce((s,v,j)=>s+weights[j]*v[i],0));return {weights,value,logits:logits.map(x=>Number.isFinite(x)?x:null)};}

 * It is decorative, not a scientific model architecture or generated portrait.
 * Motion starts only by user action; pointer rotation is optional. */
function mSculpture(canvas){
 const ctx=canvas.getContext('2d');if(!ctx)return()=>{};let angle=.47,drag=false,lastX=0,af=0,stopped=false;let w=600,h=520;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 function draw(){if(stopped)return;const dark=document.documentElement.dataset.theme==='dark';ctx.clearRect(0,0,w,h);const cx=w*.50,cy=h*.43,scale=Math.min(w/4.15,h/3.75);
 const project=(x,y,z)=>{const xx=x*Math.cos(angle)-z*Math.sin(angle),zz=x*Math.sin(angle)+z*Math.cos(angle);return [cx+xx*scale,cy-y*scale*.91+zz*scale*.32,zz];};
 function poly(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.65;ctx.stroke();}}
 // Diffuse elliptical floor shadow, drawn without an external texture.
 ctx.save();ctx.translate(cx,cy+scale*1.46);ctx.scale(1,.22);const shadow=ctx.createRadialGradient(0,0,0,0,0,scale*1.48);shadow.addColorStop(0,dark?'rgba(0,0,0,.38)':'rgba(56,52,37,.19)');shadow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,scale*1.48,0,Math.PI*2);ctx.fill();ctx.restore();

document.addEventListener('click',event=>{
 const anchor=event.target.closest('a[href^="#"]');

 if(action==='skip-main'){event.preventDefault();$('#main').focus();$('#main').scrollIntoView();}
 else if(action==='menu'){$('#sidebar').classList.toggle('open');$('#sidebar-backdrop').classList.toggle('visible');trigger.setAttribute('aria-expanded',String($('#sidebar').classList.contains('open')));}
 else if(action==='search')showSearch();
 else if(action==='theme'){theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('ai-atlas:theme',JSON.stringify(theme));}catch{storageAvailable=false;}renderChrome();}
 else if(action==='detail')openDetail(trigger.dataset.type,trigger.dataset.id);
 else if(action==='close-detail')$('#detail-dialog').close();
 else if(action==='close-search')$('#search-dialog').close();
 else if(action==='save')toggleSave(trigger.dataset.key);
 else if(action==='model-kind'){S.model.kind=trigger.dataset.kind;S.model.page=1;updateModels();}
 else if(action==='agent-kind'){S.agent.kind=trigger.dataset.kind;S.agent.page=1;updateAgents();}
 else if(action==='model-page'){S.model.page=Number(trigger.dataset.page);updateModels();$('#model-results').scrollIntoView({block:'start',behavior:'smooth'});}
 else if(action==='agent-page'){S.agent.page=Number(trigger.dataset.page);updateAgents();$('#agent-results').scrollIntoView({block:'start',behavior:'smooth'});}
 else if(action==='reset-models'){S.model={q:'',kind:'全部',origin:'全部',sort:'default',page:1};models();}
 else if(action==='reset-agents'){S.agent={q:'',kind:'全部',page:1};agents();}
 else if(action==='reset-glossary'){S.glossary='';glossary();}
 else if(action==='export-models')exportCSV('models');
 else if(action==='export-agents')exportCSV('agents');
 else if(action==='compare-toggle')toggleCompare(trigger.dataset.id);
 else if(action==='compare-clear'){compare.clear();if(S.route==='models')updateModels();renderDock();}
 else if(action==='compare-open')showCompare();

 else if(action==='copy-practice')copyText(lookup('articles',trigger.dataset.id)?.practice||'');

 else if(action==='scroll-section')document.getElementById(trigger.dataset.section)?.scrollIntoView({behavior:'smooth'});
 else if(action==='topic-level'){S.topic=trigger.dataset.level;knowledge();}
