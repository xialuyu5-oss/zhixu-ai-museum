:"terminal","level":"实用","color":"blue"},{"id":"vps-security","title":"安全与风控","description":"保护数据、账户和预算","icon":"shield","level":"实用","color":"teal"},{"id":"payments","title":"订阅与支付","description":"分清购买渠道、申请资格和续订成本。","icon":"scale","level":"必读","color":"blue"},{"id":"directory","title":"导航与评测","description":"从官方入口找工具，建立自己的验证集。","icon":"link","level":"实用","color":"teal"},{"id":"licenses","title":"开源与许可证","description":"看懂许可条件，辨认源码可见与开源。","icon":"shield","level":"必读","color":"blue"},{"id":"openpath","title":"开闭源路线","description":"从应用架构到产品发布，做可解释的选择。","icon":"route","level":"进阶","color":"blue"},{"id":"n-vectors","title":"向量知识库与 RAG","description":"从向量、切块到检索、权限和验收。","icon":"database","level":"入门 → 实践","color":"teal"},{"id":"n-context","title":"提示词与上下文工程","description":"把目标、资料、约束和验证组织成可执行任务。","icon":"message","level":"入门 → 实践","color":"teal"},{"id":"n-git","title":"Git 与 GitHub 实用技巧","description":"可回溯的 AI 协作，从分支到审查和回滚。","icon":"github","level":"入门 → 实践","color":"blue"},{"id":"n-evaluation","title":"评测与故障定位","description":"从症状出发，用证据判断优化是否有效。","icon":"target","level":"入门 → 实践","color":"teal"},{"id":"harness","title":"Agent Harness 系列","description":"从可控循环到状态恢复、权限、验收与上线。","icon":"workflow","level":"入门 / 实践","color":"teal"},{"id":"museum","name":"科技馆深读","title":"科技馆深读","icon":"compass","color":"orange","description":"从互动展品进入原理与边界","level":"入门"}],"articles":[{"id":"ai-map","topic":"foundations","title":"AI、机器学习与大模型，一次分清","subtitle":"先建立坐标系，再学习新名词。","intro":"人工智能是宽泛的目标领域；机器学习研究如何从数据中学习规律；深度学习采用多层神经网络。大语言模型是其中处理语言的一类模型，而不是 AI 的全部。","mechanism":"从任务入手更容易：预测数值是回归，选择类别是分类，发现相似样本可以用聚类；生成回答则属于生成任务。一个系统可以混合规则、数据库检索和模型。产品界面、模型、开发框架和连接协议又是不同层次。","practice":"把你工作中的三个任务写下来：输入是什么？需要预测、分类、检索还是生成？再给每个任务列出一个不用大模型的基线。","check":"能解释为什么“客服问答”和“温度异常检测”未必需要同一种技术。","pitfall":"不要把 AI 与聊天机器人画等号，也不要把规则能稳定解决的问题强行改成生成式任务。","sources":["ml","llm-course"],"level":"入门"},{"id":"rules-or-llm","topic":"foundations","title":"什么时候不需要大模型？","subtitle":"让问题决定技术，而不是反过来。","intro":"考虑一个发票字段检查功能。日期格式、金额范围和税号长度，往往可以先用确定性的校验完成。自由文本解释、跨文档归纳才可能需要模型。","mechanism":"本页采用一个工程决策顺序：能精确定义的规则优先；已有结构化数据先查询；有标签和稳定指标时比较传统机器学习；开放式语言任务再试大模型。最后也可以把这些方法组合。","practice":"为“工单分流”准备 20 条模拟记录，同时设计关键词规则和模型分类方案。记录两种方案的错误，不先假设模型更好。","check":"对同一输入使用同一套标签定义和验收条件，并比较维护成本。","pitfall":"演示中表现流畅，不代表生产数据上更可靠。这个决策顺序是设计建议，不是技术排名。","sources":["ml","evals"],"level":"入门"},{"id":"tokens-context","topic":"mechanism","title":"Token、上下文与“记忆”","subtitle":"模型能看到什么，比你说过什么更重要。","intro":"Token 是模型处理文本的单位，不能简单等同于一个字或一个词。上下文是一次推理时提供给模型的信息，其中可能包含指令、对话、资料和工具返回结果。","mechanism":"“曾经聊过”与“本次输入里仍然可见”是不同概念。产品可以通过摘要、检索或持久化记录重新提供信息。长上下文只是容量，不自动保证关键信息被正确使用。","practice":"建立一个任务交接文件：目标、限制、已完成事项、关键决定、待解决问题、证据位置。用它开启新会话，检查能否恢复任务。","check":"用明确的问题验证关键限制是否保留；精确 Token 数以对应分词器或 API 用量为准。","pitfall":"不要用固定“中文字符 ÷ 某个常数”当作准确账单。上下文窗口与最大输出长度也是两个指标。","sources":["llm-course","openai"],"level":"入门"},{"id":"train-infer","topic":"mechanism","title":"训练、推理、微调与蒸馏","subtitle":"分清“修改模型”和“给模型资料”。","intro":"训练通过数据和目标调整模型参数。推理使用已有参数处理新输入。微调是在已有模型基础上继续训练；蒸馏通常让另一个模型学习教师模型的行为或输出。","mechanism":"把一段资料放入提示词，通常只改变本次输入，并不更新模型参数。检索增强是在回答前找资料；微调则改变模型在某些任务上的行为。两者可以同时使用。","practice":"写下一个团队问题：究竟是缺少最新资料、输出格式不稳，还是任务能力不足？为每种原因选择一个最小实验，而不是立即微调。","check":"先测资料完整性和提示方案，再决定是否需要训练；保留独立测试集。","pitfall":"训练数据必须有授权和质量控制。把全部内部文档扔进训练流程，并不保证答案可追溯。","sources":["llm-course","retrieval"],"level":"入门"},{"id":"model-product","topic":"selection","title":"模型、聊天产品与 API 是三回事","subtitle":"同名模型不等于同一个工作环境。","intro":"模型提供推理或生成能力；聊天产品加入界面、历史和工具；API 则是程序调用服务的入口。编程 Agent 会进一步增加文件读写、命令执行和任务状态。","mechanism":"当效果不同，应拆开看：模型版本、系统指令、上下文、工具、推理设置和执行环境。订阅产品的用量规则不应直接套到 API，反之亦然。","practice":"比较两个工具时记录：具体模型、任务输入、允许工具、环境、成功标准、耗时和费用。每次只改一个变量。","check":"比较对象在同一个层面，且条件可重现。","pitfall":"本地安装客户端不等于本地模型推理；开放源码的 Agent 客户端也不意味着后端免费。","sources":["openai","claude-code","opencode"],"level":"入门"},{"id":"choose-model","topic":"selection","title":"为自己的任务选择模型","subtitle":"先定义“好”，再寻找候选。","intro":"本页建议从真实需求建立选型表：任务质量、响应延迟、成功任务成本、数据边界、工具兼容和维护方式。不存在一个分数能替所有团队做决定。","mechanism":"先用简单方案作为基线，再选少量模型进行盲测。将正常样例、边界样例和无答案样例分开统计。记录版本与日期，避免模型更新后仍引用旧结论。","practice":"准备一份 20 条的试验集。对每条记录是否通过验收、需要多少人工修改、成本和延迟。这只是初筛，不足以证明所有业务场景可靠。","check":"获胜方案应在你的验收集上更合适，而不是仅有更高公开榜单分数。","pitfall":"厂商定位、公开评测与自己的实测要分别标注。比较价格时统一币种和计费单位。","sources":["evals","claude","mistral"],"level":"入门"},{"id":"task-spec","topic":"context","title":"写一份 AI 真正能执行的任务说明","subtitle":"目标、材料、约束和验收缺一不可。","intro":"把“帮我优化代码”改成具体契约：哪里存在问题、允许改什么、不能改什么、如何证明改好了。角色描述可以辅助，但不能替代输入材料和完成条件。","mechanism":"本页推荐四块结构：目标与业务背景；可引用的事实和文件；操作边界；结果格式及验证方法。对缺失信息要求先列出假设，不要让模型默默补齐。","practice":"目标：修复订单小数金额误差。\n材料：src/order.ts、相关单测与复现输入。\n限制：不改 API 字段，不新增生产依赖。\n验收：保留旧用例，新增失败用例，运行测试并附 diff。\n缺信息时：先说明缺口，不宣称测试已通过。","check":"另一位工程师读完说明，也应能判断任务是否完成。","pitfall":"“你是世界顶级专家”不能解决资料缺失。不要要求模型替你编造已经运行过的验证结果。","sources":["claude-code","agent-design"],"level":"入门"},{"id":"context-handoff","topic":"context","title":"长任务如何交接，而不只是延长聊天","subtitle":"用可更新的状态记录替代记忆猜测。","intro":"长任务会积累大量过程信息。继续对话时，真正重要的往往是目标、已验证事实、关键决策和剩余风险，而不是所有历史措辞。","mechanism":"本页建议将状态写入版本化文件，区分事实、假设和计划。每个阶段结束后更新验证结果，并给出证据路径。另一个会话只需读取摘要和必要原文。","practice":"创建 handoff.md：目标 / 当前分支 / 已完成 / 已验证 / 未验证 / 决策依据 / 下一步。保留失败命令的真实摘要，但移除凭据。","check":"新会话能指出最近一次测试结果、尚未验证的部分以及不可改变的约束。","pitfall":"摘要也会丢信息，关键事实必须指回原文。不要把“模型总结说成功”当作执行证据。","sources":["langgraph","claude-code"],"level":"入门"},{"id":"coding-loop","topic":"coding","title":"AI 编程的最小可靠闭环","subtitle":"读取 → 修改 → 测试 → 审查。","intro":"把 AI 当作可执行任务的协作者，而不是一次性代码生成器。本页建议先理解问题和代码边界，再做最小修改，最后检查功能与副作用。","mechanism":"给出复现输入，让工具先确认失败；然后提出修改计划，限制改动范围。验证既包括测试，也包括依赖变化、异常分支、日志和接口兼容。","practice":"在独立分支中修一个小 Bug。保留失败测试，应用最小补丁，运行相关测试，再人工审查 diff 与测试日志。","check":"能解释哪条测试以前失败、为什么修改后通过，以及哪些部分仍未验证。","pitfall":"测试通过不代表系统整体正确。不要允许工具为追求通过而删除断言、跳过测试或改动验收标准。","sources":["claude-code","copilot"],"level":"入门"},{"id":"test-ai-code","topic":"coding","title":"不要让 AI 只写“能通过的测试”","subtitle":"测试应挑战实现，而不是复述实现。","intro":"测试的来源应是需求与行为契约。若直接照着实现生成断言，很可能把同一个错误再写一遍。重要的是测试能否发现错误，而不只是覆盖行数。","mechanism":"本页建议先写正常、边界、无效输入和权限案例，再对实现进行测试。对已知 Bug 保留回归用例；通过人为注入小错误，观察测试是否能够报警。","practice":"给金额计算器准备：0、负数、空输入、极大值和小数累加。先写预期规则，再看模型生成的实现与测试。","check":"至少说明一个测试能捕获的真实失败模式，并区分单元、集成和端到端覆盖。","pitfall":"代码和测试都由同一模型生成时，可能共享相同误解。关键行为应由独立需求或人工审查确认。","sources":["evals","claude-code"],"level":"入门"},{"id":"api-to-app","topic":"applications","title":"从 API 调用到 AI 应用","subtitle":"模型只是服务中的一个组件。","intro":"一段调用示例展示的是最小通信过程。可供用户使用的应用还需要输入校验、状态管理、错误处理、权限、日志以及预算控制。","mechanism":"本页建议把服务拆成：接收请求、验证身份、整理上下文、调用模型、验证输出、执行受控动作、记录结果。模型提出的结构化输出也应经过程序检查。","practice":"做一个模拟工单分类接口。只接受明确字段，让模型输出受限标签；在服务端校验标签，不合法时进入人工队列。","check":"超时、无效输出、重复请求和上游限流都有可解释的处理方式。","pitfall":"不要把长期 API Key 写进网页源码。前端限制不是服务端授权。真实接入需在后端管理密钥。","sources":["kimi","agents-sdk"],"level":"入门"},{"id":"tool-calling","topic":"applications","title":"工具调用，不等于模型直接执行","subtitle":"提议、授权、执行、反馈是四个环节。","intro":"模型可以提出工具名称和参数，但动作通常由应用运行时执行。运行时必须检查参数、权限和操作范围，并把真实结果交回模型。","mechanism":"例如模型提出查询工单。系统先确认用户可读这个工单，再执行查询。对于修改状态，系统还应检查版本与授权。让模型“承诺不越权”不能代替程序约束。","practice":"设计 get_ticket 与 update_ticket 两个工具。读取采用服务端权限校验；写入增加明确审批、幂等键和变更审计。先用模拟数据。","check":"尝试不存在、无权限、重复和格式错误的请求，观察是否被程序拦截。","pitfall":"工具描述属于接口契约，不能把权限验证全部放在自然语言提示里。","sources":["agents-sdk","mcp"],"level":"入门"},{"id":"rag-basics","topic":"rag","title":"RAG：先找到依据，再组织回答","subtitle":"让回答连接到可以追溯的资料。","intro":"检索增强生成把“查找相关资料”和“生成回答”结合起来。文档先被解析、分块和索引，问题到来时再检索片段，连同来源交给生成模型。","mechanism":"回答失败可以发生在不同位置：文档没有录入、解析错误、分块失去语境、检索未命中，或模型误读证据。应先定位环节，而不是一律换模型。","practice":"使用三份虚构设备手册，写五个有答案问题和三个无答案问题。显示命中的原文片段，并要求答案引用片段编号。","check":"引用确实支持结论；资料不含答案时能够明确说明，而不是补编。","pitfall":"相似度高不是事实正确的保证。权限过滤必须进入数据访问流程，不能只在回答后删敏感词。","sources":["retrieval"],"level":"入门"},{"id":"rag-or-finetune","topic":"rag","title":"长上下文、RAG 与微调怎么选？","subtitle":"资料、行为与容量是不同问题。","intro":"本页建议先问：需要加入的是临时材料、持续更新的知识，还是稳定的行为模式？有限资料可直接进入上下文；大量变化资料可以试检索；固定任务模式再考虑微调。","mechanism":"它们不是互斥选项。检索能提供资料，微调可以帮助适配行为，而上下文负责承载本次任务所需信息。无论哪种方式，都要用同一测试集比较。","practice":"对模拟手册问答做两版：全文输入与检索输入。记录证据完整性、无答案处理、输入量和更新资料后的表现。","check":"不仅看回答流畅度，也看引用准确性、信息新鲜度和维护复杂度。","pitfall":"微调不是实时知识库；更大的上下文也不自动消除幻觉。","sources":["retrieval","llm-course"],"level":"入门"},{"id":"agent-basics","topic":"agents","title":"Agent 到底比聊天多了什么？","subtitle":"关键不是拟人化，而是反馈循环。","intro":"本页采用工程视角：Agent 利用模型选择下一步行动，调用工具，观察结果，再调整行动，直到完成或触发停止条件。具体产品的自主程度并不相同。","mechanism":"工作流的主要路径通常由程序预先定义；Agent 可以动态决定部分步骤。实际系统可以混合二者。执行日志、状态、预算和人工介入点共同决定是否可控。","practice":"打开实验室的 Agent 沙盘，逐步观察读取、计划、工具提议、写入审批和验证。演示只改变页面状态，不运行任何真实命令。","check":"能指出谁决定下一步、谁执行动作、何时需要人工批准，以及什么时候停止。","pitfall":"多 Agent 不自动比单 Agent 强。先用更简单的流程作为基线。","sources":["agent-design","langgraph"],"level":"入门"},{"id":"mcp-skills","topic":"agents","title":"API、MCP、Skills 和 Agent 的关系","subtitle":"不同层次的工具，不要放在同一排行榜。","intro":"API 是程序之间的接口。MCP 是 AI 应用交换工具、资源和提示模板的协议。Skills 通常用于封装特定任务的指令或资源，其格式和行为依产品而定。Agent 则负责利用这些能力推进任务。","mechanism":"可以把它们理解为：API 提供能力；MCP 统一一部分发现和调用方式；技能包提供任务做法；Agent 组织执行。这里是帮助理解的分层，不是所有产品的强制结构。","practice":"画出自己的文档助手：模型、运行时、检索 API、权限层、MCP 服务和任务说明分别在哪里？删除不需要的组件，保留最小实现。","check":"能够识别 MCP 服务中的工具、资源和提示模板，同时知道权限仍要单独控制。","pitfall":"安装一个 MCP 服务并不会自动让模型更可靠，也不证明该服务可以信任。","sources":["mcp","agents-sdk"],"level":"入门"},{"id":"local-models","topic":"local","title":"本地模型：装得下，不等于用得好","subtitle":"部署资源与任务效果都要验证。","intro":"本地推理让你控制更多运行环境，但需要管理权重、后端、设备和数据流。客户端在本机运行，与模型在本机计算，是两件不同的事。","mechanism":"先核对模型架构和推理框架支持，再估算权重占用和运行开销。长上下文、KV Cache、并发和批处理会改变内存需求。部分卸载到 CPU 会改变性能。","practice":"选一个有官方部署指南的模型，使用完全虚构输入。在短上下文和较长上下文下分别记录首字延迟、生成速度、峰值内存与任务成功率。","check":"确认请求没有意外发往云端，并能在目标设备上稳定完成所需任务。","pitfall":"纯权重计算只是下界；MoE 不能仅按激活参数估算总权重。","sources":["qwen-docs","qwen"],"level":"入门"},{"id":"quantization","topic":"local","title":"量化减少的是什么？","subtitle":"更低精度是一种工程取舍。","intro":"量化用较低精度表示部分数值，常用于减少权重存储和计算需求。它不改变“必须检查任务质量”这件事，也不保证所有后端都更快。","mechanism":"仅估权重时，可用参数数量 × 位宽 ÷ 8 得到字节量。但实际文件还包括量化元数据，运行时还需要缓存、激活和工作区。","practice":"在实验室切换 16、8、4 和 2 bit，观察纯权重理论值。再拿实际权重文件和峰值内存核对差额。","check":"在同一任务集比较精度、速度和内存，不把文件变小等同于性能提升。","pitfall":"不同量化方法不能只按同一个“4 bit”标签视作完全相同。","sources":["qwen-docs"],"level":"入门"},{"id":"eval-basics","topic":"evaluation","title":"你的第一个 AI 验收集","subtitle":"把“看起来不错”变成可检查的证据。","intro":"验收集是带有明确通过条件的代表性任务。本页建议先覆盖典型、边界、无答案和风险样例，再逐步扩大。小样本只用于初筛。","mechanism":"记录输入、期望行为、实际输出、证据、版本与失败类型。主观质量可以人工评分，但格式、数值、工具结果等应尽量自动验证。","practice":"给文档助手写 20 条问题，至少包含资料缺失、冲突版本和越权请求。每次换模型或提示词都重新执行。","check":"同一次比较的输入和标准一致，并保留失败样例而不是删掉它们。","pitfall":"通过率取决于样本；不要把一组内部结果宣传成普遍能力排名。","sources":["evals"],"level":"入门"},{"id":"cost-basics","topic":"evaluation","title":"算清每次“成功完成”的成本","subtitle":"价格只是成本的一部分。","intro":"对按 Token 计费的文本服务，输入与输出通常分别定价。应用总成本还可能包含检索、工具、存储、重试、人工检查和部署费用。","mechanism":"本页用简化公式理解量级：每日次数 × 单次 Token 用量 × 对应单价。再用总成本除以成功任务数，评估一次真正完成任务的代价。","practice":"在成本实验中填写你的假设用量。把重试引起的额外调用加入次数，再单独记录人工返工与工具成本。","check":"明确币种、百万 Token 单位、时间范围和未计入项，并与实际账单对照。","pitfall":"实验室输出是估算而非报价。订阅费与按量 API 费不要简单相加或互换。","sources":["openai","claude","evals"],"level":"入门"},{"id":"permission-boundary","topic":"security","title":"AI 能读什么、能改什么？","subtitle":"让程序执行边界，而不只是提示词约束。","intro":"本页建议先把系统设为只读，再按具体场景增加权限。读取资料、修改文件、发送信息和改变生产配置，应当是不同级别的授权。","mechanism":"对外部文档、网页和工具结果，默认把它们当作数据，而不是可信的操作指令。权限检查在服务端实施；高影响写操作增加审批和审计。","practice":"列出一个助手的所有工具，逐一标注读取范围、写入范围、风险、审批条件和回滚方法。先在沙箱与模拟账户测试。","check":"无权限资源被程序拒绝；审批前不执行高风险动作；日志不暴露密钥。","pitfall":"文档里出现“忽略原规则”时，不应因此扩大权限。没有任何一条提示词能替代完整安全设计。","sources":["work","mcp","agents-sdk"],"level":"入门"},{"id":"data-boundary","topic":"security","title":"“私有部署”要检查整条数据链","subtitle":"一个本地组件不能代表整个系统。","intro":"本页建议追踪原始资料、提示词、模型请求、工具响应、日志和备份分别去了哪里。只有理解数据流，才能判断是否符合组织的边界要求。","mechanism":"自部署知识库平台可能仍调用外部嵌入和生成服务。本地模型也可能使用外部搜索或遥测。需要逐一检查连接、访问权限、存储和保留策略。","practice":"为自己的方案画数据流表：数据类别 / 产生位置 / 接收方 / 保存位置 / 保留时间 / 谁能访问。无法确定的项标为待核验。","check":"敏感数据在每一跳的用途和权限均可说明，并与组织审批要求一致。","pitfall":"本页是工程检查清单，不替代地区法规、合同或专业合规审查。","sources":["work","dify"],"level":"入门"},{"id":"engineer-path","topic":"career","title":"从软件工程师到 AI 应用交付","subtitle":"先做一个可验收的小项目。","intro":"本页建议优先迁移已有工程能力：需求、接口、测试、数据处理与系统运维。然后补上模型边界、检索、工具调用和评估，而不是先追所有框架。","mechanism":"一个合适的练习应有清楚输入与输出、可获取的授权数据、明确失败处理和可重复验收。先让单人流程成立，再扩展多人权限与运行监控。","practice":"选择模拟工单分类或公开资料问答，交付可运行入口、数据说明、测试集、失败清单和成本估算。","check":"另一个人能复现结果，并知道它什么时候不应该被使用。","pitfall":"能跑的 Demo 不是完整生产系统。职业价值来自解决问题和交付能力，而不是记住最多产品名。","sources":["ml","evals","agents-sdk"],"level":"入门"},{"id":"edge-manufacturing","topic":"career","title":"AI × 嵌入式与制造业的起点","subtitle":"先隔离辅助功能与实时控制。","intro":"本页建议从非安全关键的辅助场景入手：读取脱敏日志、查询设备手册、归纳异常与整理维护记录。把模型建议和设备控制隔离，先验证价值。","mechanism":"为端侧方案列出延迟、资源、离线需求和功耗预算。需要确定性时保留传统逻辑；生成式能力用于解释与辅助，而不是未经验证地接管控制。","practice":"用模拟设备日志制作只读助手，输出“观察到的事实 / 可能原因 / 需要补充的数据”。禁止自动下发控制指令。","check":"正常、异常与资料不足的输入都能处理，且不把推测写成测量事实。","pitfall":"普通电脑的模型演示不能直接证明它满足实时或安全认证要求。","sources":["qwen-docs","gemma","evals"],"level":"入门"},{"id":"vps-what-is-vps","topic":"vps-basics","title":"VPS 是什么？先把“服务器”想明白","subtitle":"你租到的是远程计算环境，不是默认开通的一条网络服务。","intro":"你租到的是远程计算环境，不是默认开通的一条网络服务。","mechanism":"一句话理解：VPS 是 Virtual Private Server（虚拟专用服务器）。服务商把物理服务器的资源划分给多个虚拟环境，你获得其中一份计算、内存、存储与网络资源，并在允许的范围内管理操作系统和应用。它可以承载网站、开发环境、监控或个人文件服务。\n你负责什么：常见的自管理 VPS 由商家维护机房、物理硬件与底层平台；系统更新、应用配置、账户权限和数据备份通常由你负责。不要把“云”理解成有人替你处理一切。托管服务的范围需要读合同。\n买之前问自己：先写用途和用户所在地，再写最低内存、存储、月流量及可承受停机时间。新手学习优先考虑可重装、可救援、能短周期付费的环境，而不是追求最大的参数。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-aws-vps"],"level":"入门","blocks":[{"title":"一句话理解","text":"VPS 是 Virtual Private Server（虚拟专用服务器）。服务商把物理服务器的资源划分给多个虚拟环境，你获得其中一份计算、内存、存储与网络资源，并在允许的范围内管理操作系统和应用。它可以承载网站、开发环境、监控或个人文件服务。"},{"title":"你负责什么","text":"常见的自管理 VPS 由商家维护机房、物理硬件与底层平台；系统更新、应用配置、账户权限和数据备份通常由你负责。不要把“云”理解成有人替你处理一切。托管服务的范围需要读合同。"},{"title":"买之前问自己","text":"先写用途和用户所在地，再写最低内存、存储、月流量及可承受停机时间。新手学习优先考虑可重装、可救援、能短周期付费的环境，而不是追求最大的参数。"}],"domain":"vps","minutes":2},{"id":"vps-vps-vpn-airport","topic":"vps-basics","title":"VPS、机场、VPN、代理客户端：四件不同的事","subtitle":"区分基础设施、代运营服务、隧道技术与本地软件。","intro":"区分基础设施、代运营服务、隧道技术与本地软件。","mechanism":"VPS：一台可配置的远程机器：购买 VPS 后你仍需要安装和配置应用。能运行网站不代表已经提供代理；能远程登录不代表所有本地流量都经过它。维护责任通常更多地落在自己身上。\n机场：社区俗称的订阅式代理服务：“机场”不是统一的技术标准。常见模式是服务方运营多个入口或出口，用户购买流量与访问凭据。服务质量、透明度、隐私政策、支持协议和适用范围依商家而异。这里说明术语，不推荐未核实的订阅商。\nVPN：技术，也可能是商业服务：WireGuard、OpenVPN 是用于构建加密隧道的软件/技术；商业 VPN 则通常把客户端、出口和账户计费打包出售。Tailscale 偏重设备之间的组网与访问控制，不能仅按“几个国家出口”来比较。\n客户端：不是节点来源：Mihomo 一类核心负责规则、协议和流量处理，图形客户端负责界面。软件装好了仍需要有效配置和可达端点。“系统代理”“TUN”“路由表”和“DNS”控制的范围不同；应用不走代理不一定是 VPS 出了问题。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-aws-vps","vps-wireguard","vps-openvpn","vps-mihomo","vps-tailscale"],"level":"入门","blocks":[{"title":"VPS：一台可配置的远程机器","text":"购买 VPS 后你仍需要安装和配置应用。能运行网站不代表已经提供代理；能远程登录不代表所有本地流量都经过它。维护责任通常更多地落在自己身上。"},{"title":"机场：社区俗称的订阅式代理服务","text":"“机场”不是统一的技术标准。常见模式是服务方运营多个入口或出口，用户购买流量与访问凭据。服务质量、透明度、隐私政策、支持协议和适用范围依商家而异。这里说明术语，不推荐未核实的订阅商。"},{"title":"VPN：技术，也可能是商业服务","text":"WireGuard、OpenVPN 是用于构建加密隧道的软件/技术；商业 VPN 则通常把客户端、出口和账户计费打包出售。Tailscale 偏重设备之间的组网与访问控制，不能仅按“几个国家出口”来比较。"},{"title":"客户端：不是节点来源","text":"Mihomo 一类核心负责规则、协议和流量处理，图形客户端负责界面。软件装好了仍需要有效配置和可达端点。“系统代理”“TUN”“路由表”和“DNS”控制的范围不同；应用不走代理不一定是 VPS 出了问题。"}],"domain":"vps","minutes":2},{"id":"vps-virtualization","topic":"vps-basics","title":"KVM、LXC、独服：隔离方式怎么选","subtitle":"虚拟化类别和 CPU 是否独占，是两个维度。","intro":"虚拟化类别和 CPU 是否独占，是两个维度。","mechanism":"KVM 与系统容器：KVM 提供完整虚拟化基础，虚拟机可运行自己的内核。LXC 属于系统容器，使用宿主机内核，通过隔离机制形成环境。容器的内核能力与权限约束要提前确认，不应照搬虚拟机教程。\n独服、独立 vCPU 与共享 vCPU：独服是租用整台物理机器；独立 vCPU 通常仍在虚拟机内，只是 CPU 分配方式不同。共享 vCPU 的峰值表现可能很好，但不代表允许持续满载。读清 CPU 公平使用政策。\n不要混淆分类：“KVM + ARM + NAT + 存储型”可以同时成立：依次描述虚拟化、处理器架构、网络方式和用途。低价不必然质量差，KVM 也不意味着绝不超售。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-kvm","vps-lxc","vps-do"],"level":"入门","blocks":[{"title":"KVM 与系统容器","text":"KVM 提供完整虚拟化基础，虚拟机可运行自己的内核。LXC 属于系统容器，使用宿主机内核，通过隔离机制形成环境。容器的内核能力与权限约束要提前确认，不应照搬虚拟机教程。"},{"title":"独服、独立 vCPU 与共享 vCPU","text":"独服是租用整台物理机器；独立 vCPU 通常仍在虚拟机内，只是 CPU 分配方式不同。共享 vCPU 的峰值表现可能很好，但不代表允许持续满载。读清 CPU 公平使用政策。"},{"title":"不要混淆分类","text":"“KVM + ARM + NAT + 存储型”可以同时成立：依次描述虚拟化、处理器架构、网络方式和用途。低价不必然质量差，KVM 也不意味着绝不超售。"}],"domain":"vps","minutes":2},{"id":"vps-ip-types","topic":"vps-basics","title":"独立 IPv4、NAT、IPv6-only 与家宽标签","subtitle":"能否监听端口，比宣传里的“独享”更具体。","intro":"能否监听端口，比宣传里的“独享”更具体。","mechanism":"独立地址与共享出口：独立 IPv4 通常方便直接接收公网连接。NAT 产品可能共享一个公网 IPv4，只分配部分端口；是否支持端口映射、UDP、自定义端口和 IPv6 要逐项确认。独立 IP 并不等于独立带宽或独立物理服务器。\nIPv6-only 的前提：本地接入和目标服务都要有可用的 IPv6 路径，或另有转换/代理设施。只有 AAAA 记录不能自动让 IPv4 用户访问。用于公开网站时，要确认双栈访客覆盖方式。\n原生、广播、住宅：分开判断：“原生”常被用于描述地址注册与使用地区相符，但商家口径并不统一。所谓广播 IP 并不能单独证明质量差；住宅标签也不能证明它来自真实家庭线路。核对地址数据库、ASN、实际路径、商家交付描述和目标业务。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-ipquality","vps-netcup","vps-bgp"],"level":"入门","blocks":[{"title":"独立地址与共享出口","text":"独立 IPv4 通常方便直接接收公网连接。NAT 产品可能共享一个公网 IPv4，只分配部分端口；是否支持端口映射、UDP、自定义端口和 IPv6 要逐项确认。独立 IP 并不等于独立带宽或独立物理服务器。"},{"title":"IPv6-only 的前提","text":"本地接入和目标服务都要有可用的 IPv6 路径，或另有转换/代理设施。只有 AAAA 记录不能自动让 IPv4 用户访问。用于公开网站时，要确认双栈访客覆盖方式。"},{"title":"原生、广播、住宅：分开判断","text":"“原生”常被用于描述地址注册与使用地区相符，但商家口径并不统一。所谓广播 IP 并不能单独证明质量差；住宅标签也不能证明它来自真实家庭线路。核对地址数据库、ASN、实际路径、商家交付描述和目标业务。"}],"domain":"vps","minutes":2},{"id":"vps-read-specs","topic":"vps-basics","title":"配置单怎么读：2C / 2G / 40G / 1T","subtitle":"先找单位，再看计费口径与资源约束。","intro":"先找单位，再看计费口径与资源约束。","mechanism":"计算和存储：2C 常指 2 个 vCPU；2G 常指 2 GB/GiB 内存；40G 常指磁盘容量。共享核心不等于两颗完整物理核心，磁盘“NVMe”也不能代替 IOPS、延迟与持续性能测试。ARM 镜像和二进制兼容性需要单独检查。\n流量不等于带宽：1T 通常是一个计费周期的流量额度；1Gbps 是端口速率。二者都不是到你家必达的速度。确认 TB/TiB、单向或双向统计、入站/出站、流量重置日、超额收费还是限速停机。\n常被省略的成本：IPv4、快照、备份、额外磁盘、税费和跨区域流量可能另计。关机不一定停止计费；释放实例也可能留下磁盘和地址收费。最终依据账单项目与商家说明。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-do","vps-lightsail","vps-netcup"],"level":"入门","blocks":[{"title":"计算和存储","text":"2C 常指 2 个 vCPU；2G 常指 2 GB/GiB 内存；40G 常指磁盘容量。共享核心不等于两颗完整物理核心，磁盘“NVMe”也不能代替 IOPS、延迟与持续性能测试。ARM 镜像和二进制兼容性需要单独检查。"},{"title":"流量不等于带宽","text":"1T 通常是一个计费周期的流量额度；1Gbps 是端口速率。二者都不是到你家必达的速度。确认 TB/TiB、单向或双向统计、入站/出站、流量重置日、超额收费还是限速停机。"},{"title":"常被省略的成本","text":"IPv4、快照、备份、额外磁盘、税费和跨区域流量可能另计。关机不一定停止计费；释放实例也可能留下磁盘和地址收费。最终依据账单项目与商家说明。"}],"domain":"vps","minutes":2},{"id":"vps-managed-cloud","topic":"vps-basics","title":"云服务器、轻量服务器和共享主机","subtitle":"名字不同，真正要比较的是控制权与服务边界。","intro":"名字不同，真正要比较的是控制权与服务边界。","mechanism":"三种交付视角：共享主机通常围绕网站空间与管理面板交付；VPS/云实例提供系统级环境；轻量应用服务器常把实例、镜像、流量套餐和简化面板打包。名称不构成性能或高可用保证。\n哪些事情适合托管：只做静态展示站，不一定需要 VPS。需要数据库、常驻进程、自定义运行时或网络配置时，系统级环境更灵活。没有运维精力时，应比较托管平台与自管服务器的总成本。\n从业务反推：把系统管理、补丁、备份、故障处理、恢复支持分别列出来。由谁做、收费多少、多久响应，比“企业级”“高性能”等字眼更有决策价值。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-aws-vps","vps-ali","vps-do"],"level":"入门","blocks":[{"title":"三种交付视角","text":"共享主机通常围绕网站空间与管理面板交付；VPS/云实例提供系统级环境；轻量应用服务器常把实例、镜像、流量套餐和简化面板打包。名称不构成性能或高可用保证。"},{"title":"哪些事情适合托管","text":"只做静态展示站，不一定需要 VPS。需要数据库、常驻进程、自定义运行时或网络配置时，系统级环境更灵活。没有运维精力时，应比较托管平台与自管服务器的总成本。"},{"title":"从业务反推","text":"把系统管理、补丁、备份、故障处理、恢复支持分别列出来。由谁做、收费多少、多久响应，比“企业级”“高性能”等字眼更有决策价值。"}],"domain":"vps","minutes":2},{"id":"vps-round-trip","topic":"vps-network","title":"去程与回程：同一对端点，两条可能不同的路","subtitle":"去程看本地到 VPS，回程看 VPS 到本地。","intro":"去程看本地到 VPS，回程看 VPS 到本地。","mechanism":"先固定观察者：本站默认以用户为参照：本地 → VPS 为去程；VPS → 本地为回程。从服务器发起的 traceroute 只能提供那个方向的路径信息，不能据此断言用户去程完全相同。\n为什么会不对称：不同网络依据各自策略选择出口和上游。BGP 并不要求两端选择相同的运营商或相同路径。路由可随拥塞、故障、上游和策略调整发生变化。\n怎样验证：在真实本地网络跑去程；在 VPS 或商家 Looking Glass 跑到对应本地网络的回程。家宽不响应探测时，说明可见性限制，不要随便用一个省会公共 IP 代替全部用户。保留时间、协议、IP 版本和原始结果。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-bgp","vps-nexttrace","vps-mtr"],"level":"入门","blocks":[{"title":"先固定观察者","text":"本站默认以用户为参照：本地 → VPS 为去程；VPS → 本地为回程。从服务器发起的 traceroute 只能提供那个方向的路径信息，不能据此断言用户去程完全相同。"},{"title":"为什么会不对称","text":"不同网络依据各自策略选择出口和上游。BGP 并不要求两端选择相同的运营商或相同路径。路由可随拥塞、故障、上游和策略调整发生变化。"},{"title":"怎样验证","text":"在真实本地网络跑去程；在 VPS 或商家 Looking Glass 跑到对应本地网络的回程。家宽不响应探测时，说明可见性限制，不要随便用一个省会公共 IP 代替全部用户。保留时间、协议、IP 版本和原始结果。"}],"domain":"vps","minutes":2},{"id":"vps-latency-loss","topic":"vps-network","title":"延迟、抖动、丢包：不能只盯着一个 Ping","subtitle":"交互顺畅、长连接稳定、下载速度快，是不同目标。","intro":"交互顺畅、长连接稳定、下载速度快，是不同目标。","mechanism":"三个指标：延迟看响应往返需要多久，常用 RTT 毫秒表示；抖动看延迟随时间的波动；丢包看发送与收到的比例。比较时要统一样本数、时间段和测量方式。P95/P99 能辅助发现平均数掩盖的尾部波动。\n中间跳不回，不等于业务丢包：路由器可能限速或不回应发给自身的探测，但仍正常转发业务。中间一跳显示很高丢包，后续跳和终点正常时，不能直接判为线路丢包。终点持续异常也需要与 TCP 和真实应用互证。\n把晚高峰纳入验收：用同一家庭网络，在日间和通常拥塞的晚间进行多轮测量，再测试真实任务。不要把一次极高跑分当成长期承诺；也不要把一次 ICMP 异常直接解释成断网。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-mtr","vps-iperf","vps-nexttrace"],"level":"入门","blocks":[{"title":"三个指标","text":"延迟看响应往返需要多久，常用 RTT 毫秒表示；抖动看延迟随时间的波动；丢包看发送与收到的比例。比较时要统一样本数、时间段和测量方式。P95/P99 能辅助发现平均数掩盖的尾部波动。"},{"title":"中间跳不回，不等于业务丢包","text":"路由器可能限速或不回应发给自身的探测，但仍正常转发业务。中间一跳显示很高丢包，后续跳和终点正常时，不能直接判为线路丢包。终点持续异常也需要与 TCP 和真实应用互证。"},{"title":"把晚高峰纳入验收","text":"用同一家庭网络，在日间和通常拥塞的晚间进行多轮测量，再测试真实任务。不要把一次极高跑分当成长期承诺；也不要把一次 ICMP 异常直接解释成断网。"}],"domain":"vps","minutes":2},{"id":"vps-asn-bgp","topic":"vps-network","title":"ASN、BGP、Peering、Transit 是什么","subtitle":"看到某个 AS 号，只是获得一个线索。","intro":"看到某个 AS 号，只是获得一个线索。","mechanism":"AS 和 ASN：自治系统是实施统一路由策略的网络集合，ASN 是它的编号。BGP 交换网络可达性和路径信息。一个数据中心、一个 IP 地址归属和一条实际路径，不一定对应同一个运营主体。\nPeering 与 Transit：Peering 是网络间针对约定流量互联；Transit 是通过上游获得更广泛的互联网可达性。是否收费、覆盖哪些前缀、互联容量有多少，均依具体安排，不能把某个标签理解成全球最短路。\nBGP 不等于“优化线路”：几乎所有跨自治系统互联网路由都涉及 BGP。商家写 BGP 可能指多线接入等产品设计，而不是无条件低延迟。看具体起终点、实际 AS 路径与测试日期，比看三个字母更可靠。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-bgp","vps-nexttrace"],"level":"入门","blocks":[{"title":"AS 和 ASN","text":"自治系统是实施统一路由策略的网络集合，ASN 是它的编号。BGP 交换网络可达性和路径信息。一个数据中心、一个 IP 地址归属和一条实际路径，不一定对应同一个运营主体。"},{"title":"Peering 与 Transit","text":"Peering 是网络间针对约定流量互联；Transit 是通过上游获得更广泛的互联网可达性。是否收费、覆盖哪些前缀、互联容量有多少，均依具体安排，不能把某个标签理解成全球最短路。"},{"title":"BGP 不等于“优化线路”","text":"几乎所有跨自治系统互联网路由都涉及 BGP。商家写 BGP 可能指多线接入等产品设计，而不是无条件低延迟。看具体起终点、实际 AS 路径与测试日期，比看三个字母更可靠。"}],"domain":"vps","minutes":2},{"id":"vps-china-routes","topic":"vps-network","title":"CN2、9929、CMI、IIJ：线路标签如何理解","subtitle":"识别运营商与网络产品，不把标签排成绝对榜单。","intro":"识别运营商与网络产品，不把标签排成绝对榜单。","mechanism":"看运营商，也看路由全貌：CN2、联通精品网、移动国际网络、IIJ 等标签描述不同运营商网络或服务。识别常见 AS 号能辅助读图，但标签、单个可见跳或 IP 数据库不能独立证明套餐享有某个商业等级。\nGIA / GT / EB / PRO 不是同一维度：有的是运营商商业产品，有的是 VPS 商家的系列名称。DMIT 官方把 Premium、Eyeball、Tier 1 分为不同网络系列；硬件系列另外命名。不要直接用 A 商家的 PRO 对齐 B 商家的 Pro。\n地域和方向优先：一条线路可能联通表现合适、移动不合适，也可能去程普通但回程优化。辽宁的实际表现不能从广东的单张图外推。首选本地同运营商、同 IP 版本、晚间和真实业务验证。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit","vps-bgp","vps-netquality"],"level":"入门","blocks":[{"title":"看运营商，也看路由全貌","text":"CN2、联通精品网、移动国际网络、IIJ 等标签描述不同运营商网络或服务。识别常见 AS 号能辅助读图，但标签、单个可见跳或 IP 数据库不能独立证明套餐享有某个商业等级。"},{"title":"GIA / GT / EB / PRO 不是同一维度","text":"有的是运营商商业产品，有的是 VPS 商家的系列名称。DMIT 官方把 Premium、Eyeball、Tier 1 分为不同网络系列；硬件系列另外命名。不要直接用 A 商家的 PRO 对齐 B 商家的 Pro。"},{"title":"地域和方向优先","text":"一条线路可能联通表现合适、移动不合适，也可能去程普通但回程优化。辽宁的实际表现不能从广东的单张图外推。首选本地同运营商、同 IP 版本、晚间和真实业务验证。"}],"domain":"vps","minutes":2},{"id":"vps-node-roles","topic":"vps-network","title":"入口、中转、落地：节点承担什么角色","subtitle":"机房位置、连接入口与最终出口，可以不是同一处。","intro":"机房位置、连接入口与最终出口，可以不是同一处。","mechanism":"入口和出口：入口是设备最先连到的服务端点；出口是目标业务看到的来源。所谓落地常指最终对外访问的节点。目标服务看到的出口地区，不必等于你连接的入口域名标注的地区。\n中转的代价：多一跳可能绕开差的互联，也可能增加延迟、成本和故障点。只有端到端实测改善，才值得增加中转。把“本地到入口”和“入口到出口”分别测量，再看总体结果。\n专线字样需要证据：IEPL、IPLC 等有具体网络交付含义，但社区营销可能混用。询问交付边界、承载范围、SLA 与故障处理，不能仅凭订阅中的文字判断独享容量或合规性。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-bgp","vps-wireguard","vps-mihomo"],"level":"入门","blocks":[{"title":"入口和出口","text":"入口是设备最先连到的服务端点；出口是目标业务看到的来源。所谓落地常指最终对外访问的节点。目标服务看到的出口地区，不必等于你连接的入口域名标注的地区。"},{"title":"中转的代价","text":"多一跳可能绕开差的互联，也可能增加延迟、成本和故障点。只有端到端实测改善，才值得增加中转。把“本地到入口”和“入口到出口”分别测量，再看总体结果。"},{"title":"专线字样需要证据","text":"IEPL、IPLC 等有具体网络交付含义，但社区营销可能混用。询问交付边界、承载范围、SLA 与故障处理，不能仅凭订阅中的文字判断独享容量或合规性。"}],"domain":"vps","minutes":2},{"id":"vps-bandwidth-throughput","topic":"vps-network","title":"1Gbps 为什么下不到 125MB/s？","subtitle":"端口上限不是整个链路的吞吐保证。","intro":"端口上限不是整个链路的吞吐保证。","mechanism":"单位先换算：十进制下 1 Gbps = 1000 Mbps，除以 8 得 125 MB/s。这是未扣除任何协议开销的理论值。MiB/s 还涉及二进制换算；页面里的 Mbps、MB/s 与 MiB/s 不应混写。\n瓶颈可能在任何一段：共享端口、上游拥塞、本地接入、丢包重传、磁盘、CPU 加密能力、目标服务器限速、单连接拥塞控制都可能降低速度。多线程测速高，不代表单连接下载或远程桌面体验同样好。\n公平对比：明确测试方向、并发连接数、目标和持续时间，进行单连接与多连接两类测试。iperf3 测试需要授权和对端配合，测试本身会消耗流量，避免影响生产业务。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-iperf","vps-yabs"],"level":"入门","blocks":[{"title":"单位先换算","text":"十进制下 1 Gbps = 1000 Mbps，除以 8 得 125 MB/s。这是未扣除任何协议开销的理论值。MiB/s 还涉及二进制换算；页面里的 Mbps、MB/s 与 MiB/s 不应混写。"},{"title":"瓶颈可能在任何一段","text":"共享端口、上游拥塞、本地接入、丢包重传、磁盘、CPU 加密能力、目标服务器限速、单连接拥塞控制都可能降低速度。多线程测速高，不代表单连接下载或远程桌面体验同样好。"},{"title":"公平对比","text":"明确测试方向、并发连接数、目标和持续时间，进行单连接与多连接两类测试。iperf3 测试需要授权和对端配合，测试本身会消耗流量，避免影响生产业务。"}],"domain":"vps","minutes":2},{"id":"vps-local-test","topic":"vps-network","title":"把全国测评变成本地验收：辽宁示例","subtitle":"一张可复用的对比方法，不是当地速度保证。","intro":"一张可复用的对比方法，不是当地速度保证。","mechanism":"建立对照组：保留现有可用线路作为 A，再把新实例作为 B。分别在辽宁联通与辽宁移动实际接入环境测试，不把两家运营商的结果混为一个平均分。记录所在城市、接入方式和是否经过其他代理。\n选三个实际任务：交互类观察页面首字节和请求失败；持续类观察长连接中断与抖动；大流量类观察单连接下载与持续吞吐。目标业务、账户和应用设置保持一致，减少混杂因素。\n决定是否续费：按自己的最低可用标准验收。拿不到测试 IP、不能短期验证或交易权属不清时，降低预付金额。一次改善可以成为继续测试的依据，但不足以证明全年稳定。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-mtr","vps-iperf","vps-netquality"],"level":"实践","blocks":[{"title":"建立对照组","text":"保留现有可用线路作为 A，再把新实例作为 B。分别在辽宁联通与辽宁移动实际接入环境测试，不把两家运营商的结果混为一个平均分。记录所在城市、接入方式和是否经过其他代理。"},{"title":"选三个实际任务","text":"交互类观察页面首字节和请求失败；持续类观察长连接中断与抖动；大流量类观察单连接下载与持续吞吐。目标业务、账户和应用设置保持一致，减少混杂因素。"},{"title":"决定是否续费","text":"按自己的最低可用标准验收。拿不到测试 IP、不能短期验证或交易权属不清时，降低预付金额。一次改善可以成为继续测试的依据，但不足以证明全年稳定。"}],"domain":"vps","minutes":2},{"id":"vps-nq-rq","topic":"vps-reports","title":"NQ、NetQuality、RQ：先认报告来源","subtitle":"缩写不能代替项目名、原始链接和运行版本。","intro":"缩写不能代替项目名、原始链接和运行版本。","mechanism":"NQ 先看页面与报告抬头：社区中 NQ 可以指向 NodeQuality 相关测评页面；本站收录其入口，但本次未取得其可解析说明文档，因此不虚构统一报告字段或固定分数规则。拿到具体报告后，以页面实际工具、版本和模块为准。\nNetQuality 与 IPQuality 各司其职：xykt/NetQuality 的项目说明覆盖网络/BGP、TCP 延迟、回程与测速等；IPQuality 更偏 IP 类型、数据库风险和服务可达性。名字相近，不应自动当成同一个项目。\nRQ：本版保留待核实：没有核实到能唯一对应你这里“RQ”的项目来源，不能擅自展开为 RouteQuality，也不能直接改成 RN。需要具体链接、截图或项目全名。本站的报告解读器只识别有证据的字段，不生成不存在的 RQ 评分。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-nq","vps-netquality","vps-ipquality"],"level":"入门","blocks":[{"title":"NQ 先看页面与报告抬头","text":"社区中 NQ 可以指向 NodeQuality 相关测评页面；本站收录其入口，但本次未取得其可解析说明文档，因此不虚构统一报告字段或固定分数规则。拿到具体报告后，以页面实际工具、版本和模块为准。"},{"title":"NetQuality 与 IPQuality 各司其职","text":"xykt/NetQuality 的项目说明覆盖网络/BGP、TCP 延迟、回程与测速等；IPQuality 更偏 IP 类型、数据库风险和服务可达性。名字相近，不应自动当成同一个项目。"},{"title":"RQ：本版保留待核实","text":"没有核实到能唯一对应你这里“RQ”的项目来源，不能擅自展开为 RouteQuality，也不能直接改成 RN。需要具体链接、截图或项目全名。本站的报告解读器只识别有证据的字段，不生成不存在的 RQ 评分。"}],"domain":"vps","minutes":2},{"id":"vps-read-report","topic":"vps-reports","title":"一份测试报告的正确阅读顺序","subtitle":"先看时间和条件，再看性能，最后看适用性。","intro":"先看时间和条件，再看性能，最后看适用性。","mechanism":"第一层：证据完整吗：记录测试日期、工具和版本、实例规格、机房、IP 版本、测量点、方向和本地网络。缺少这些信息时，报告最多是线索。截图可裁剪、文本可修改，分享链接也不能证明交易控制权。\n第二层：分开阅读：CPU/内存测试对应计算任务；磁盘测试区分顺序吞吐和小块随机 I/O；网络测试区分路径、延迟和吞吐；IP 测试区分各数据库与具体业务。不要把这些压成一个万能总分。\n第三层：复现你的用途：优先验证同规格实例、同城同运营商和真实业务。把失败结果也记录下来，不只截最漂亮的一次。本站解读器是本地规则辅助工具，不连接服务器，不验证报告真伪。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-yabs","vps-netquality","vps-ipquality","vps-nexttrace"],"level":"入门","blocks":[{"title":"第一层：证据完整吗","text":"记录测试日期、工具和版本、实例规格、机房、IP 版本、测量点、方向和本地网络。缺少这些信息时，报告最多是线索。截图可裁剪、文本可修改，分享链接也不能证明交易控制权。"},{"title":"第二层：分开阅读","text":"CPU/内存测试对应计算任务；磁盘测试区分顺序吞吐和小块随机 I/O；网络测试区分路径、延迟和吞吐；IP 测试区分各数据库与具体业务。不要把这些压成一个万能总分。"},{"title":"第三层：复现你的用途","text":"优先验证同规格实例、同城同运营商和真实业务。把失败结果也记录下来，不只截最漂亮的一次。本站解读器是本地规则辅助工具，不连接服务器，不验证报告真伪。"}],"domain":"vps","minutes":2},{"id":"vps-ip-risk","topic":"vps-reports","title":"“纯净 IP”“解锁全绿”能证明什么？","subtitle":"第三方标签和一次探测，不等于平台内部结论。","intro":"第三方标签和一次探测，不等于平台内部结论。","mechanism":"数据库不是同一本账：不同数据库的地区、代理、住宅、数据中心和风险分数可能冲突。确认查询日期、字段定义、是否针对 IPv4 或 IPv6。某个评分低，只意味着那个数据库当时给出的结果低。\n可达、可登录、可支付是不同层：脚本探测某个接口成功，不保证完整业务、付费内容、账户资格或未来可用。实际服务还可能看账号状态、支付地区、设备与操作行为；本站不提供伪造身份或绕过平台风控的办法。\n合理的动作：保持账户与账单资料真实，使用官方支持范围内的服务，减少无意义的频繁切换。遇到错误保留时间、错误码与响应信息并走官方支持，不要把“换 IP”当万能修复。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-ipquality","vps-dmit-tos"],"level":"入门","blocks":[{"title":"数据库不是同一本账","text":"不同数据库的地区、代理、住宅、数据中心和风险分数可能冲突。确认查询日期、字段定义、是否针对 IPv4 或 IPv6。某个评分低，只意味着那个数据库当时给出的结果低。"},{"title":"可达、可登录、可支付是不同层","text":"脚本探测某个接口成功，不保证完整业务、付费内容、账户资格或未来可用。实际服务还可能看账号状态、支付地区、设备与操作行为；本站不提供伪造身份或绕过平台风控的办法。"},{"title":"合理的动作","text":"保持账户与账单资料真实，使用官方支持范围内的服务，减少无意义的频繁切换。遇到错误保留时间、错误码与响应信息并走官方支持，不要把“换 IP”当万能修复。"}],"domain":"vps","minutes":2},{"id":"vps-benchmark-safety","topic":"vps-reports","title":"跑脚本之前：权限、流量与隐私","subtitle":"复制一行命令，可能意味着执行整份远程代码。","intro":"复制一行命令，可能意味着执行整份远程代码。","mechanism":"先审阅，再执行：从项目原仓库获取脚本，审阅内容、依赖、更新记录和公开问题；需要时固定提交或发行版本。不要仅凭网帖里的短链接以 root 运行。下载后再执行可以提供检查机会，但不能自动保证安全。\n注意副作用：基准测试会消耗 CPU、写磁盘、跑流量，可能影响同机应用或触发公平使用政策。生产实例先安排维护窗口；不对不属于你的系统进行压力测试。\n分享前检查敏感信息：公开报告可能包含完整 IP、系统版本、主机名和网络信息。NetQuality/IPQuality 的隐私模式可禁用其在线报告生成，但测试仍需访问第三方服务；隐私模式不等于离线。不要发布订阅链接、私钥或访问令牌。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-yabs","vps-netquality","vps-ipquality"],"level":"实践","blocks":[{"title":"先审阅，再执行","text":"从项目原仓库获取脚本，审阅内容、依赖、更新记录和公开问题；需要时固定提交或发行版本。不要仅凭网帖里的短链接以 root 运行。下载后再执行可以提供检查机会，但不能自动保证安全。"},{"title":"注意副作用","text":"基准测试会消耗 CPU、写磁盘、跑流量，可能影响同机应用或触发公平使用政策。生产实例先安排维护窗口；不对不属于你的系统进行压力测试。"},{"title":"分享前检查敏感信息","text":"公开报告可能包含完整 IP、系统版本、主机名和网络信息。NetQuality/IPQuality 的隐私模式可禁用其在线报告生成，但测试仍需访问第三方服务；隐私模式不等于离线。不要发布订阅链接、私钥或访问令牌。"}],"domain":"vps","minutes":2},{"id":"vps-mtr-reading","topic":"vps-reports","title":"MTR 的 Loss、Avg、Best、Wrst 怎么看","subtitle":"看终点趋势和连续性，不把中间跳单独定罪。","intro":"看终点趋势和连续性，不把中间跳单独定罪。","mechanism":"字段语义：Loss 是探测丢失比例，Snt 是发送数量；Last / Avg / Best / Wrst 分别描述最近、平均、最小和最大响应时间，StDev 表示波动。具体显示由实现与参数决定。\n一个教学例子：假设第 5 跳显示 80% 不响应，第 6 跳与终点没有丢包：这不支持“第 5 跳丢了 80% 业务数据”的判断。假设从第 5 跳起到终点持续出现近似丢包，并且真实请求失败，才更值得排查该位置前后的路径。\n不要忘记回包路径：每跳 RTT 包含探测到达及回应返回的时间，不是相邻路由器之间的单段时延。探测回应也可能走不同回程。单份 traceroute 很难准确定位所有拥塞原因。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-mtr","vps-nexttrace"],"level":"进阶","blocks":[{"title":"字段语义","text":"Loss 是探测丢失比例，Snt 是发送数量；Last / Avg / Best / Wrst 分别描述最近、平均、最小和最大响应时间，StDev 表示波动。具体显示由实现与参数决定。"},{"title":"一个教学例子","text":"假设第 5 跳显示 80% 不响应，第 6 跳与终点没有丢包：这不支持“第 5 跳丢了 80% 业务数据”的判断。假设从第 5 跳起到终点持续出现近似丢包，并且真实请求失败，才更值得排查该位置前后的路径。"},{"title":"不要忘记回包路径","text":"每跳 RTT 包含探测到达及回应返回的时间，不是相邻路由器之间的单段时延。探测回应也可能走不同回程。单份 traceroute 很难准确定位所有拥塞原因。"}],"domain":"vps","minutes":2},{"id":"vps-choose-vps","topic":"vps-buying","title":"选第一台 VPS：先用途，后参数，最后下单","subtitle":"避免“便宜但用不上”和“线路好却买过量”。","intro":"避免“便宜但用不上”和“线路好却买过量”。","mechanism":"把硬约束写出来：用途、访问者所在地、应用架构、最低内存/磁盘、月流量、端口需求、预算和故障容忍度。先排除不满足约束的产品，再谈性价比；不要用毫无证据的综合排名替代筛选。\n给试错设置上限：学习和线路验证可以优先短周期付费。需要年付时先核实续费金额、退款限制和取消办法。首次价格、周期续费、额外费用分别记账。免费试用也需要读超额计费与资源回收规则。\n记录结论而不是印象：保留候选表、订单条款、原始测评和本地验收结果。网站中的选购向导输出的是检查建议，不会凭地区或运营商自动宣称某台机器“必稳”。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-lightsail","vps-oracle","vps-dmit-tos","vps-netcup"],"level":"入门","blocks":[{"title":"把硬约束写出来","text":"用途、访问者所在地、应用架构、最低内存/磁盘、月流量、端口需求、预算和故障容忍度。先排除不满足约束的产品，再谈性价比；不要用毫无证据的综合排名替代筛选。"},{"title":"给试错设置上限","text":"学习和线路验证可以优先短周期付费。需要年付时先核实续费金额、退款限制和取消办法。首次价格、周期续费、额外费用分别记账。免费试用也需要读超额计费与资源回收规则。"},{"title":"记录结论而不是印象","text":"保留候选表、订单条款、原始测评和本地验收结果。网站中的选购向导输出的是检查建议，不会凭地区或运营商自动宣称某台机器“必稳”。"}],"domain":"vps","minutes":2},{"id":"vps-naming","topic":"vps-buying","title":"拆开一个型号：地区 / 平台 / 网络 / 档位","subtitle":"命名规则由商家决定，别拿一套规则套所有产品。","intro":"命名规则由商家决定，别拿一套规则套所有产品。","mechanism":"DMIT 示例：LAX 可对应洛杉矶地区；AS3 是 DMIT 的 AMD EPYC 7003 系列硬件平台，不能读成 ASN 3。PRO / EB 等网络标识与硬件分开理解；具体商品仍以当前产品页完整说明为准。\nVMISS 示例：JP.TKY.IIJ.Basic 这类名称可以按“国家、城市、线路标签、套餐档位”阅读。Basic 与 Core 是商家档位名称，不构成跨商家性能标准；本版没有核实该具体 SKU 当前价格和库存。\n社区昵称的陷阱：黑五、传家宝、神机、限量款往往是活动背景或评价，不是配置。看不到完整 SKU、续费账单、到期时间与转移条款，不能仅凭昵称估值。型号解析器会把未知片段直接标成待核实。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit","vps-vmiss","vps-netcup"],"level":"入门","blocks":[{"title":"DMIT 示例","text":"LAX 可对应洛杉矶地区；AS3 是 DMIT 的 AMD EPYC 7003 系列硬件平台，不能读成 ASN 3。PRO / EB 等网络标识与硬件分开理解；具体商品仍以当前产品页完整说明为准。"},{"title":"VMISS 示例","text":"JP.TKY.IIJ.Basic 这类名称可以按“国家、城市、线路标签、套餐档位”阅读。Basic 与 Core 是商家档位名称，不构成跨商家性能标准；本版没有核实该具体 SKU 当前价格和库存。"},{"title":"社区昵称的陷阱","text":"黑五、传家宝、神机、限量款往往是活动背景或评价，不是配置。看不到完整 SKU、续费账单、到期时间与转移条款，不能仅凭昵称估值。型号解析器会把未知片段直接标成待核实。"}],"domain":"vps","minutes":2},{"id":"vps-remaining-value","topic":"vps-buying","title":"剩余价值与溢价：先统一时间和币种","subtitle":"它是一种协商参考，不是官方退款金额。","intro":"它是一种协商参考，不是官方退款金额。","mechanism":"按预付周期折算：示例：一次预付 365 元覆盖 365 天，评估日距到期 100 天，则按日线性折算为 100 元。若剩余的是多年服务，应使用实际覆盖总天数，或逐个已付周期相加，不能拿一个年费比例误算全部年份。\n溢价与实际支出：卖家总报价减去折算价值，是卖家报价中的溢价；再加上 Push、付款手续费和立即必付费用，才是买家首付现金支出。后续续费另列。剩余价值为零时，溢价率没有有效分母。\n并不等于可回收资金：服务条款可能禁止转移、禁止退款，优惠也未必可继承。有人愿意为特殊资源付费，但高溢价并不保证将来能以同价转手。计算器不估计市场“公允价”，也不保证交易安全。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit-tos","vps-netcup"],"level":"入门","blocks":[{"title":"按预付周期折算","text":"示例：一次预付 365 元覆盖 365 天，评估日距到期 100 天，则按日线性折算为 100 元。若剩余的是多年服务，应使用实际覆盖总天数，或逐个已付周期相加，不能拿一个年费比例误算全部年份。"},{"title":"溢价与实际支出","text":"卖家总报价减去折算价值，是卖家报价中的溢价；再加上 Push、付款手续费和立即必付费用，才是买家首付现金支出。后续续费另列。剩余价值为零时，溢价率没有有效分母。"},{"title":"并不等于可回收资金","text":"服务条款可能禁止转移、禁止退款，优惠也未必可继承。有人愿意为特殊资源付费，但高溢价并不保证将来能以同价转手。计算器不估计市场“公允价”，也不保证交易安全。"}],"domain":"vps","minutes":2},{"id":"vps-push-account","topic":"vps-buying","title":"Push、带邮箱、原邮：交易方式的边界","subtitle":"能登录后台，不代表你拥有稳定且合规的控制权。","intro":"能登录后台，不代表你拥有稳定且合规的控制权。","mechanism":"先核实官方是否允许：Push 通常指商家支持的服务转移，是否开放、多少钱、哪些优惠或 IP 能继承，都要具体确认。账号转让与单个服务转移是不同动作。DMIT 当前可读条款明确不允许账号转让，不能把带邮箱视为安全替代方案。\n“原邮”并不消除找回风险：初始注册邮箱、原支付方式、历史账单或身份材料可能参与后续争议。卖家提供邮箱密码不证明其无法找回。拒绝核验官方转移规则、催促不可逆付款、仅展示裁剪截图，均应提高警惕。\n交接清单：官方流程确认完成后，核对 SKU、IP、到期时间、续费金额与优惠继承。重装系统、轮换密钥、更新恢复信息并撤销旧会话。不要沿用来源不明的预装系统或把私人凭据交给卖家。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit-tos","vps-ssh"],"level":"入门","blocks":[{"title":"先核实官方是否允许","text":"Push 通常指商家支持的服务转移，是否开放、多少钱、哪些优惠或 IP 能继承，都要具体确认。账号转让与单个服务转移是不同动作。DMIT 当前可读条款明确不允许账号转让，不能把带邮箱视为安全替代方案。"},{"title":"“原邮”并不消除找回风险","text":"初始注册邮箱、原支付方式、历史账单或身份材料可能参与后续争议。卖家提供邮箱密码不证明其无法找回。拒绝核验官方转移规则、催促不可逆付款、仅展示裁剪截图，均应提高警惕。"},{"title":"交接清单","text":"官方流程确认完成后，核对 SKU、IP、到期时间、续费金额与优惠继承。重装系统、轮换密钥、更新恢复信息并撤销旧会话。不要沿用来源不明的预装系统或把私人凭据交给卖家。"}],"domain":"vps","minutes":2},{"id":"vps-price-traps","topic":"vps-buying","title":"首付很低，续费很高：价格页容易漏掉什么","subtitle":"促销、税费、流量和取消期限，都需要分别记。","intro":"促销、税费、流量和取消期限，都需要分别记。","mechanism":"三行预算：第一行是首次现金支出；第二行是下一周期可验证的续费价；第三行是可能发生的额外成本。不要把首年促销除以 12 后当成永久月费，也不要把赠金理解成现金退款。\n合约与取消：按小时、按月付款不一定意味着没有其他合同约束。查看最低合约期、自动续费、取消提前期和特殊促销说明；尤其别以为不继续付款就等于按条款取消。\n黑五与老套餐：历史活动名称只说明来源。当前是否复刻、可否续费、能否迁移、是否已停售，应分别标注“当前官网”“历史信息”“卖家提供”“尚未核实”。本站不给未经核实的库存或优惠码。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-netcup","vps-lightsail","vps-dmit-tos"],"level":"入门","blocks":[{"title":"三行预算","text":"第一行是首次现金支出；第二行是下一周期可验证的续费价；第三行是可能发生的额外成本。不要把首年促销除以 12 后当成永久月费，也不要把赠金理解成现金退款。"},{"title":"合约与取消","text":"按小时、按月付款不一定意味着没有其他合同约束。查看最低合约期、自动续费、取消提前期和特殊促销说明；尤其别以为不继续付款就等于按条款取消。"},{"title":"黑五与老套餐","text":"历史活动名称只说明来源。当前是否复刻、可否续费、能否迁移、是否已停售，应分别标注“当前官网”“历史信息”“卖家提供”“尚未核实”。本站不给未经核实的库存或优惠码。"}],"domain":"vps","minutes":2},{"id":"vps-hosting-roadmap","topic":"vps-hosting","title":"从一份 HTML 到一个真正的网站","subtitle":"域名、DNS、Web 服务、HTTPS，再到备份监测。","intro":"域名、DNS、Web 服务、HTTPS，再到备份监测。","mechanism":"最小结构：域名是便于记忆的入口；DNS 把名字关联到地址或别名；Web 服务提供文件或转发应用请求；HTTPS 保护传输并验证站点身份。VPS 只是其中可选的承载环境之一。\n本站如何上线：本站是无后端静态网站，所有内容和脚本内嵌于 index.html。双击可离线阅读；上传到静态托管目录或 VPS 的 Web 根目录，也能提供公开访问。公网部署还需要配置域名、TLS、网络访问规则和所适用的合规要求。\n应用变复杂时：有登录、评论、支付或自动采集时，需另外设计服务端、数据库、鉴权、日志与隐私处理。不要把密钥藏在前端 JS 里；浏览器拿到的代码不是保密边界。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dns","vps-caddy","vps-aws-vps"],"level":"入门","blocks":[{"title":"最小结构","text":"域名是便于记忆的入口；DNS 把名字关联到地址或别名；Web 服务提供文件或转发应用请求；HTTPS 保护传输并验证站点身份。VPS 只是其中可选的承载环境之一。"},{"title":"本站如何上线","text":"本站是无后端静态网站，所有内容和脚本内嵌于 index.html。双击可离线阅读；上传到静态托管目录或 VPS 的 Web 根目录，也能提供公开访问。公网部署还需要配置域名、TLS、网络访问规则和所适用的合规要求。"},{"title":"应用变复杂时","text":"有登录、评论、支付或自动采集时，需另外设计服务端、数据库、鉴权、日志与隐私处理。不要把密钥藏在前端 JS 里；浏览器拿到的代码不是保密边界。"}],"domain":"vps","minutes":2},{"id":"vps-dns-https","topic":"vps-hosting","title":"A、AAAA、CNAME、TTL 与 HTTPS","subtitle":"DNS 指路，TLS 验证连接，二者不能相互代替。","intro":"DNS 指路，TLS 验证连接，二者不能相互代替。","mechanism":"常用记录：A 指向 IPv4 地址，AAAA 指向 IPv6 地址，CNAME 指向另一主机名。TTL 影响记录缓存期限，但修改后所有用户何时看到新值还受缓存与配置影响。切换前先检查新主机是否可服务。\nHTTPS 的前提：使用与域名匹配的证书，保护浏览器与服务器间传输。Caddy 可在满足域名控制验证与网络条件时自动管理 HTTPS；它不会凭空解决域名错误、防火墙阻断或错误的源站配置。\n排错顺序：先查 DNS 解析，再确认 TCP 连接与监听端口，再看 TLS 证书和主机名，最后查应用错误。遇到浏览器证书警告不应直接建议访客忽略。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dns","vps-caddy"],"level":"入门","blocks":[{"title":"常用记录","text":"A 指向 IPv4 地址，AAAA 指向 IPv6 地址，CNAME 指向另一主机名。TTL 影响记录缓存期限，但修改后所有用户何时看到新值还受缓存与配置影响。切换前先检查新主机是否可服务。"},{"title":"HTTPS 的前提","text":"使用与域名匹配的证书，保护浏览器与服务器间传输。Caddy 可在满足域名控制验证与网络条件时自动管理 HTTPS；它不会凭空解决域名错误、防火墙阻断或错误的源站配置。"},{"title":"排错顺序","text":"先查 DNS 解析，再确认 TCP 连接与监听端口，再看 TLS 证书和主机名，最后查应用错误。遇到浏览器证书警告不应直接建议访客忽略。"}],"domain":"vps","minutes":2},{"id":"vps-cdn-origin","topic":"vps-hosting","title":"CDN、反向代理、源站：加速不是万能遮罩","subtitle":"访客可能先到边缘节点，再到你的 VPS。","intro":"访客可能先到边缘节点，再到你的 VPS。","mechanism":"CDN 做什么：CDN 使用分布式节点缓存和交付内容，减少部分请求的距离与源站负担。动态请求、缓存命中率和回源路径决定效果，不是任何业务接入 CDN 都会更快。\n源站仍然要安全：正确配置 TLS、访问控制和必要的回源限制，避免把管理面板、数据库等管理入口开放给所有访客。CDN 不替代系统补丁、应用鉴权、备份或源站防火墙。\n反向代理与正向代理：反向代理代表服务器接收访问，可分发到不同后端；正向代理代表客户端向目标发起请求。两者都叫代理，但配置目标与风险边界不同。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-cdn","vps-caddy","vps-docker"],"level":"入门","blocks":[{"title":"CDN 做什么","text":"CDN 使用分布式节点缓存和交付内容，减少部分请求的距离与源站负担。动态请求、缓存命中率和回源路径决定效果，不是任何业务接入 CDN 都会更快。"},{"title":"源站仍然要安全","text":"正确配置 TLS、访问控制和必要的回源限制，避免把管理面板、数据库等管理入口开放给所有访客。CDN 不替代系统补丁、应用鉴权、备份或源站防火墙。"},{"title":"反向代理与正向代理","text":"反向代理代表服务器接收访问，可分发到不同后端；正向代理代表客户端向目标发起请求。两者都叫代理，但配置目标与风险边界不同。"}],"domain":"vps","minutes":2},{"id":"vps-linux-first-hour","topic":"vps-hosting","title":"开机后的第一小时：一份安全起步清单","subtitle":"先能找回服务器，再调整 SSH 和防火墙。","intro":"先能找回服务器，再调整 SSH 和防火墙。","mechanism":"先建立恢复通道：确认控制台或救援系统可用，保存实例和账单信息。使用受支持的系统镜像；更新软件包。不要在不懂命令后果时粘贴大段一键优化脚本。\nSSH 按顺序改：创建日常管理账户、配置密钥并在第二个会话验证成功，再根据需求限制 root 和密码登录。变更前备份配置，检查语法，保持原会话直到新连接通过。\n只开放必要服务：盘点监听端口，配置云防火墙与系统防火墙，并从外部验证。Docker 发布端口与主机防火墙的相互作用要单独检查，不能仅看 UFW 显示开启就认为容器端口已限制。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-ssh","vps-docker"],"level":"实践","blocks":[{"title":"先建立恢复通道","text":"确认控制台或救援系统可用，保存实例和账单信息。使用受支持的系统镜像；更新软件包。不要在不懂命令后果时粘贴大段一键优化脚本。"},{"title":"SSH 按顺序改","text":"创建日常管理账户、配置密钥并在第二个会话验证成功，再根据需求限制 root 和密码登录。变更前备份配置，检查语法，保持原会话直到新连接通过。"},{"title":"只开放必要服务","text":"盘点监听端口，配置云防火墙与系统防火墙，并从外部验证。Docker 发布端口与主机防火墙的相互作用要单独检查，不能仅看 UFW 显示开启就认为容器端口已限制。"}],"domain":"vps","minutes":2},{"id":"vps-backup-monitor","topic":"vps-hosting","title":"备份、快照和监控：三件事不能互相代替","subtitle":"真正的备份，以能够恢复为验收标准。","intro":"真正的备份，以能够恢复为验收标准。","mechanism":"不要只留同机副本：同机备份会和故障盘、被入侵系统或被删除实例一起丢失。重要数据在独立故障域保留可恢复副本，保护备份访问凭据，并根据数据重要性设置保存周期。\n快照与应用一致性：系统快照便于恢复某个时间点，但运行中的数据库仍需合适的一致性处理。保存配置、数据库和文件时，记录如何恢复，定期在隔离环境验证恢复流程。\n监控需要在故障时还能通知：使用 Uptime Kuma 等工具观察服务可用性；监控全放在同一台 VPS 时，整机失联可能连通知也发不出。根据可承受风险增加独立监测点，并测试告警与恢复通知。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-restic","vps-uptime","vps-do"],"level":"实践","blocks":[{"title":"不要只留同机副本","text":"同机备份会和故障盘、被入侵系统或被删除实例一起丢失。重要数据在独立故障域保留可恢复副本，保护备份访问凭据，并根据数据重要性设置保存周期。"},{"title":"快照与应用一致性","text":"系统快照便于恢复某个时间点，但运行中的数据库仍需合适的一致性处理。保存配置、数据库和文件时，记录如何恢复，定期在隔离环境验证恢复流程。"},{"title":"监控需要在故障时还能通知","text":"使用 Uptime Kuma 等工具观察服务可用性；监控全放在同一台 VPS 时，整机失联可能连通知也发不出。根据可承受风险增加独立监测点，并测试告警与恢复通知。"}],"domain":"vps","minutes":2},{"id":"vps-migration","topic":"vps-hosting","title":"迁移 VPS：先能回滚，再切流量","subtitle":"服务迁移不等于一定能保留 IP 或原价。","intro":"服务迁移不等于一定能保留 IP 或原价。","mechanism":"把依赖列全：系统、架构、软件版本、环境变量、数据库、上传文件、定时任务、证书和 DNS 记录都要纳入清单。不要把仅复制网页目录当作完整应用迁移。\n先测试再切换：在目标环境恢复备份，使用测试域名或本地解析核验；需要时安排写入冻结或数据同步。切换后检查解析、证书、关键业务和日志，在验证窗口内保留旧环境供回滚。\n迁机房不是所有产品都有的按钮：商家对套餐升降级、跨代升级、跨区迁移及 IP 保留的规定不同。比如 netcup 的当前 FAQ 明确地区变更需要新建再手动迁移；不要把其他商家的迁移功能套用过来。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-netcup","vps-dns","vps-restic"],"level":"进阶","blocks":[{"title":"把依赖列全","text":"系统、架构、软件版本、环境变量、数据库、上传文件、定时任务、证书和 DNS 记录都要纳入清单。不要把仅复制网页目录当作完整应用迁移。"},{"title":"先测试再切换","text":"在目标环境恢复备份，使用测试域名或本地解析核验；需要时安排写入冻结或数据同步。切换后检查解析、证书、关键业务和日志，在验证窗口内保留旧环境供回滚。"},{"title":"迁机房不是所有产品都有的按钮","text":"商家对套餐升降级、跨代升级、跨区迁移及 IP 保留的规定不同。比如 netcup 的当前 FAQ 明确地区变更需要新建再手动迁移；不要把其他商家的迁移功能套用过来。"}],"domain":"vps","minutes":2},{"id":"vps-account-risk","topic":"vps-security","title":"账户风控：保护自己，不寻找“免检秘诀”","subtitle":"真实资料、正确使用范围和凭据管理，比赌一个 IP 标签更重要。","intro":"真实资料、正确使用范围和凭据管理，比赌一个 IP 标签更重要。","mechanism":"商家为什么可能要求验证：注册、支付、异常登录、资源滥用或账户争议可能涉及验证。具体规则取决于条款。不要提供虚假身份、使用来源不明的付款方式或购买无法核实归属的账号。\n把根账户保护起来：密码管理器、不同站点独立密码、多因素认证和离线保存的恢复码，是降低账户被接管风险的合理做法。服务 API 密钥用最小权限，不放进公开仓库、报告或网页源码。\n异常后先止损：撤销可疑会话和凭据，检查账单与资源，保留必要日志，通过官方工单核实。不能把所有故障都解释成“被风控”，也不应凭猜测反复购买新账号。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit-tos","vps-ssh"],"level":"入门","blocks":[{"title":"商家为什么可能要求验证","text":"注册、支付、异常登录、资源滥用或账户争议可能涉及验证。具体规则取决于条款。不要提供虚假身份、使用来源不明的付款方式或购买无法核实归属的账号。"},{"title":"把根账户保护起来","text":"密码管理器、不同站点独立密码、多因素认证和离线保存的恢复码，是降低账户被接管风险的合理做法。服务 API 密钥用最小权限，不放进公开仓库、报告或网页源码。"},{"title":"异常后先止损","text":"撤销可疑会话和凭据，检查账单与资源，保留必要日志，通过官方工单核实。不能把所有故障都解释成“被风控”，也不应凭猜测反复购买新账号。"}],"domain":"vps","minutes":2},{"id":"vps-threat-model","topic":"vps-security","title":"你的风险来自哪里？先做一个小型威胁模型","subtitle":"商家、操作系统、应用和本地设备，都在链路里。","intro":"商家、操作系统、应用和本地设备，都在链路里。","mechanism":"分别看四层：基础设施层有机房与商家故障；系统层有补丁、权限与服务暴露；应用层有代码与身份验证；终端层有设备安全和凭据泄露。租一台“专用”服务器并不会自动消除这些问题。\n优先减少攻击面：删除不用的服务，限制管理入口，及时处理已知漏洞，避免公开 Redis、数据库或容器控制接口。访问控制和备份要定期实测，而不是只检查配置文件存在。\n不要夸大匿名性：自管服务器改变信任边界，并不等于没有服务商、网络或账户记录。使用受支持的加密协议保护传输，遵守服务和法律要求，不把技术标签当成匿名承诺。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-ssh","vps-docker","vps-wireguard","vps-dmit-tos"],"level":"入门","blocks":[{"title":"分别看四层","text":"基础设施层有机房与商家故障；系统层有补丁、权限与服务暴露；应用层有代码与身份验证；终端层有设备安全和凭据泄露。租一台“专用”服务器并不会自动消除这些问题。"},{"title":"优先减少攻击面","text":"删除不用的服务，限制管理入口，及时处理已知漏洞，避免公开 Redis、数据库或容器控制接口。访问控制和备份要定期实测，而不是只检查配置文件存在。"},{"title":"不要夸大匿名性","text":"自管服务器改变信任边界，并不等于没有服务商、网络或账户记录。使用受支持的加密协议保护传输，遵守服务和法律要求，不把技术标签当成匿名承诺。"}],"domain":"vps","minutes":2},{"id":"vps-compliance","topic":"vps-security","title":"建站合规与服务条款：上线前的核对项","subtitle":"只给核查框架，不把地区标签当作法律结论。","intro":"只给核查框架，不把地区标签当作法律结论。","mechanism":"先识别业务与管辖：面向哪些用户、收集哪些个人信息、是否收费、是否有用户上传内容、服务器与运营主体在哪些地区，会影响需要核查的要求。涉及中国大陆接入时，应向接入商及官方备案平台确认适用的备案或许可安排。\n不同要求不能混成一项：域名注册、网站接入备案、特定业务许可、个人信息与数据处理、版权和支付规则，分别核查。海外部署不意味着不受任何法律或服务政策约束。具体业务决策需要适格专业人士确认。\n本版边界：本次未取得工信部入口的可解析正文，因此不列具体办理天数、材料或对你的业务作法律判断。站内提供官方入口和核对清单，不提供规避监管或平台规则的操作。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-icp","vps-dmit-tos","vps-ali"],"level":"入门","blocks":[{"title":"先识别业务与管辖","text":"面向哪些用户、收集哪些个人信息、是否收费、是否有用户上传内容、服务器与运营主体在哪些地区，会影响需要核查的要求。涉及中国大陆接入时，应向接入商及官方备案平台确认适用的备案或许可安排。"},{"title":"不同要求不能混成一项","text":"域名注册、网站接入备案、特定业务许可、个人信息与数据处理、版权和支付规则，分别核查。海外部署不意味着不受任何法律或服务政策约束。具体业务决策需要适格专业人士确认。"},{"title":"本版边界","text":"本次未取得工信部入口的可解析正文，因此不列具体办理天数、材料或对你的业务作法律判断。站内提供官方入口和核对清单，不提供规避监管或平台规则的操作。"}],"domain":"vps","minutes":2},{"id":"vps-fraud-check","topic":"vps-security","title":"交易红旗：低价不是安全信号","subtitle":"把“能买到”和“买完可持续使用”分开。","intro":"把“能买到”和“买完可持续使用”分开。","mechanism":"交易前的红旗：没有完整 SKU、续费账单和到期日；用测速截图代替控制权证明；否认官方条款；催促不可逆付款；无法说明转移是否保留 IP/优惠；这些情况值得暂停，而不是靠打折补偿未知风险。\n防止偷换概念：带邮箱不是官方 Push；“永久优惠”不是不受条款变化影响；历史神机不是当前库存；“独享 IP”不是独享端口；跑分全绿不是账号安全证明。把卖家每项承诺转成可核验字段。\n交接后的动作：遵循商家允许的交接方式，确认账户归属与计费，重装系统、轮换凭据、清理旧授权、验证网络和备份。不能核验转移授权时，不建议为了省一点钱接受不清晰的所有权。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-dmit-tos","vps-ssh","vps-ipquality"],"level":"入门","blocks":[{"title":"交易前的红旗","text":"没有完整 SKU、续费账单和到期日；用测速截图代替控制权证明；否认官方条款；催促不可逆付款；无法说明转移是否保留 IP/优惠；这些情况值得暂停，而不是靠打折补偿未知风险。"},{"title":"防止偷换概念","text":"带邮箱不是官方 Push；“永久优惠”不是不受条款变化影响；历史神机不是当前库存；“独享 IP”不是独享端口；跑分全绿不是账号安全证明。把卖家每项承诺转成可核验字段。"},{"title":"交接后的动作","text":"遵循商家允许的交接方式，确认账户归属与计费，重装系统、轮换凭据、清理旧授权、验证网络和备份。不能核验转移授权时，不建议为了省一点钱接受不清晰的所有权。"}],"domain":"vps","minutes":2},{"id":"vps-vpn-software","topic":"vps-basics","title":"常见“VPN 软件”：客户端、核心和商业服务对照","subtitle":"名称都很熟悉，但它们提供的并不是同一种东西。","intro":"名称都很熟悉，但它们提供的并不是同一种东西。","mechanism":"Clash Verge Rev、v2rayN：图形客户端：Clash Verge Rev 是图形客户端，内置 Mihomo 核心；v2rayN 是支持 Xray、sing-box 等核心的图形客户端。它们帮助管理配置与连接，但安装软件本身不代表获得远程出口。要区分原项目发行包、第三方包装和节点供应商。\nMihomo、sing-box：核心与工具体系：核心负责协议、连接和路由规则；界面由对应客户端提供。配置不一定互通，格式、功能与系统要求应查对应版本文档。一个订阅能否导入，不代表每项功能在所有核心上完全一致。\nWireGuard、OpenVPN、Tailscale：隧道与组网：WireGuard 和 OpenVPN 可以用于搭建受你控制的加密隧道；需要可用端点与密钥配置。Tailscale 把设备组网、身份与访问管理组织成服务。三者不等于默认提供全球公共出口的“机场”。\nProton VPN 一类服务：应用加供应商运营：商业 VPN 通常将客户端、账户与运营出口一起交付。它与“租 VPS 自己维护”的责任边界不同。这里仅作为类别示例，不承诺特定地区可用、隐私绝对安全或适合你的业务。比较时应检查条款、审计范围、设备限制和当地适用要求。","practice":"结合自己的用途，记录资料日期、输入条件和待核实项目；按文章步骤完成一次小范围验证。","check":"区分文档事实、测量现象和自己的推断；保存可复核的记录。","pitfall":"原文完整保留；产品和条款可能变化，购买前再次确认。","sources":["vps-clash-verge","vps-v2rayn","vps-singbox","vps-mihomo","vps-wireguard","vps-openvpn","vps-tailscale","vps-protonvpn"],"level":"入门","blocks":[{"title":"Clash Verge Rev、v2rayN：图形客户端","text":"Clash Verge Rev 是图形客户端，内置 Mihomo 核心；v2rayN 是支持 Xray、sing-box 等核心的图形客户端。它们帮助管理配置与连接，但安装软件本身不代表获得远程出口。要区分原项目发行包、第三方包装和节点供应商。"},{"title":"Mihomo、sing-box：核心与工具体系","text":"核心负责协议、连接和路由规则；界面由对应客户端提供。配置不一定互通，格式、功能与系统要求应查对应版本文档。一个订阅能否导入，不代表每项功能在所有核心上完全一致。"},{"title":"WireGuard、OpenVPN、Tailscale：隧道与组网","text":"WireGuard 和 OpenVPN 可以用于搭建受你控制的加密隧道；需要可用端点与密钥配置。Tailscale 把设备组网、身份与访问管理组织成服务。三者不等于默认提供全球公共出口的“机场”。"},{"title":"Proton VPN 一类服务：应用加供应商运营","text":"商业 VPN 通常将客户端、账户与运营出口一起交付。它与“租 VPS 自己维护”的责任边界不同。这里仅作为类别示例，不承诺特定地区可用、隐私绝对安全或适合你的业务。比较时应检查条款、审计范围、设备限制和当地适用要求。"}],"domain":"vps","minutes":2},{"id":"subscription-channels","topic":"payments","title":"会员、API 与应用商店：三条不同的购买路径","subtitle":"先确定你付的钱买到了什么。","intro":"同一品牌可以有聊天产品、编程产品和开发者 API；付款渠道也可以是网页或应用商店。先识别产品，再识别计费账户与管理入口。","mechanism":"ChatGPT 网页与应用内订阅管理渠道不同；API 另有计费。Claude Pro 与 Console API 也分开。Gemini API 则以项目与 Cloud Billing 为基础。具体权益按服务和方案核对，不在不同产品间推定额度通用。","practice":"选择你正在考虑的一项工具，记录产品名称、账户、购买渠道、计费币种、取消入口和 API 是否另收费。","check":"能从订单判断应该到哪个官方账户或商店处理续订，而不是只看信用卡商户名。","pitfall":"不要同时在两个渠道重复订阅后，才发现它们的订单不能自动合并。","sources":["pay-openai","pay-claude","pay-gemini-api"],"level":"必读","domain":"new"},{"id":"card-eligibility","topic":"payments","title":"虚拟卡申请：先资格，再卡种，最后支付","subtitle":"数字卡号不是全球通行证。","intro":"虚拟描述的是卡片形态，不决定信用、借记还是预付，也不保证商户接受。申请资格要看发卡地区、真实居住地址和账户要求。","mechanism":"按顺序核对三层条件：服务支持地区 → 发卡机构资格 → 商户与卡片支付限制。Wise、Revolut 和 Privacy 的地区与身份要求不同；一次性卡和稳定卡号的多次使用卡也不同。","practice":"使用本页“虚拟卡指南”逐项核对官方地区页。只记录是否满足，不把证件号或完整卡资料填入任何学习工具。","check":"能解释为什么“开出了卡”与“可以订阅目标服务”是两次独立判断。","pitfall":"不买他人认证账户，不填虚假地址；无论卖家如何承诺，都不能保证风控通过。","sources":["card-wise-country","card-revolut-country","card-privacy","pay-declined"],"level":"必读","domain":"new"},{"id":"payment-failure","topic":"payments","title":"订阅付款失败，怎样有序排查？","subtitle":"先记录错误，不要不断换卡重试。","intro":"失败可能来自银行、支付验证、商户规则或地区条件。教程只帮助定位，不承诺解锁。","mechanism":"先确认目标产品和资格，再核对有效期、余额、账单地址和银行对国际/循环支付的设置。需要时完成 3D Secure。OpenAI API 额度不能用预付卡购买，这与卡片是否有实体无关。","practice":"写下失败时间、错误提示、金额币种、是否出现验证弹窗；向官方客服或发卡行提供非敏感摘要。","check":"可以排除重复扣款和待处理授权，并知道应联系银行还是服务方。","pitfall":"不要向论坛、代充商或本网站提交完整卡号、CVV、验证码或账户恢复码。","sources":["pay-declined","card-single-use"],"level":"必读","domain":"new"},{"id":"subscription-budget","topic":"payments","title":"把订阅费用拆成首付、续费和使用成本","subtitle":"低月费不一定等于低总成本。","intro":"建议建立一张个人台账：服务、购买渠道、原币金额、周期、续订日、税费、汇率与取消入口。台账不是银行账单。","mechanism":"计算时分别列出一次性开卡/设置费用、每期服务费、按量消费和人工运维。不把首次促销价外推到所有续费。本站预算计算器使用你填写的假设，不抓取实时价格或汇率。","practice":"在预算工具输入一个教学方案，修改调用量或汇率，观察首付与稳态月成本变化；导出续订提醒后自行导入日历。","check":"能区分提醒文件、已取消订阅和银行实际扣款三种状态。","pitfall":"冻结卡片、删除 App 或导出提醒不等于取消商家的订阅合同。","sources":["pay-openai","pay-cursor","pay-gemini-api"],"level":"实用","domain":"new"},{"id":"arena-reading","topic":"directory","title":"Arena 竞技场应该怎么看？","subtitle":"社区偏好是一个视角，不是采购结论。","intro":"Arena（原 LMArena）提供社区模型对比与评测入口。把它用于发现候选，而不是代替自己的验收。","mechanism":"建议记录任务类别、榜单日期、参与模型和方法说明；再和成本/速度资料及自己的任务样例对照。不同数据来源的测量对象未必相同，不直接拼接成万能总分。","practice":"选三个候选模型，用同一组非敏感任务盲测，记录正确性、完成时间、需要人工修改的部分与费用。","check":"采购结论有自己的样例和检查标准，而不是“榜单第一所以最好”。","pitfall":"不得把客户数据直接提交公共对战；本网站不提供实时名次，也不假称已独立测遍模型。","sources":["arena","artificial-analysis"],"level":"实用","domain":"new"},{"id":"github-evaluation","topic":"directory","title":"看 GitHub 项目：先读哪几个文件？","subtitle":"下载之前，先判断可维护性与权限。","intro":"建议按 README、LICENSE、Releases、安装文档、Security 和 Issues 的顺序检查。星标和演示视频不是稳定性保证。","mechanism":"把可核对信息转为记录：维护日期、目标系统、依赖、许可证、执行权限、网络访问、数据保存和升级回滚方式。源码可见不能推定允许商业分发。","practice":"从导航选一个项目，固定 tag 或 commit，保存 LICENSE 与依赖清单，在隔离的教学环境运行最小样例。","check":"能重复安装同一版本，知道哪些文件和服务访问了你的数据。","pitfall":"不要直接以管理员身份运行陌生仓库的一行安装脚本；无许可证的项目先咨询权利人。","sources":["license-none","license-spdx","vps-ssh"],"level":"实用","domain":"new"},{"id":"open-source-vs-weights","topic":"licenses","title":"开源、开放权重、源码可见：不是同一个标签","subtitle":"代码、模型和服务的权利分层看。","intro":"OSI 的开源定义要求的不只是能查看源码；使用、修改、分发等权利同样重要。可商业使用与是否开源是两个维度。","mechanism":"对于 AI，OSAID 1.0 还讨论代码、模型参数以及足够的数据说明。它不等于要求所有原始训练数据都公开；仅提供权重也不能自动称为符合该定义的开源 AI。","practice":"给一个 AI 系统分别记录：应用代码、推理引擎、权重、训练/评测数据、外部 API 的许可或合同。","check":"能说明“我的推理引擎是 MIT”为什么不能回答“这个模型能否商用”。","pitfall":"不能把“免费”“本地运行”“Github 公共仓库”作为开源判定标准。","sources":["osi-osd","osi-ai","license-cc"],"level":"必读","domain":"new"},{"id":"license-basics","topic":"licenses","title":"MIT、Apache、GPL、AGPL 怎么快速区分？","subtitle":"比较义务，而不是寻找一个“可商用”勾。","intro":"这些标准开源许可证并不禁止商业使用，差异在于分发、修改、网络交互等情况下要履行哪些条件。","mechanism":"宽松许可侧重保留许可与声明；MPL 关注被覆盖文件；LGPL 对库及组合使用有具体条件；GPL 关注受覆盖作品的分发；AGPL 另外约束特定修改程序的网络交互场景。","practice":"打开协议表，比较 MIT、Apache 与 AGPL；写出你项目是否修改、分发、提供网络服务、组合了哪些部分。","check":"结论能对应具体版本的条款和实际交付方式，不只写“可以商用”。","pitfall":"本页是教育性摘要，不是法律意见。边界复杂或准备商业发布时，应由有资质的专业人士结合完整事实确认。","sources":["license-mit","license-apache","license-mpl","license-lgpl","license-gpl","license-agpl"],"level":"必读","domain":"new"},{"id":"custom-licenses","topic":"licenses","title":"Dify、n8n、Open WebUI：附加条款要读到哪里？","subtitle":"别让旧标签覆盖当前许可证。","intro":"一些常见 AI 与自动化项目使用带附加条件的源码许可，并非原封不动的 MIT 或 Apache。本站把这类条目单独归类。","mechanism":"Dify 当前许可要核对多租户及前端品牌条件；n8n Sustainable Use 要区分内部业务与对外收费提供；Open WebUI 当前有品牌保留与例外条款，并保留历史贡献的原许可。","practice":"写清是否对外托管、客户如何分租户、是否移除品牌、用户数量和所用 commit，然后对照 LICENSE 原文逐项确认。","check":"能指出所用版本的附加条件；不把另一个版本的许可当作当前授权。","pitfall":"升级、复制文件或购买企业版之后要更新合规清单，不使用“一次查过永远有效”的结论。","sources":["license-dify","license-n8n","license-openwebui"],"level":"必读","domain":"new"},{"id":"release-checklist","topic":"licenses","title":"发布前的许可证检查单","subtitle":"建立可追溯的依赖与权利记录。","intro":"发布审核建议以实际交付物为起点，覆盖应用、依赖、模型权重、数据和品牌素材。SPDX 标识帮助记录许可证，但列表收录本身不代表 OSI 批准。","mechanism":"记录版本/commit、许可证原文、NOTICE、修改文件、再分发或托管方式；按对应条件准备源码或获取方式。自己的代码归属、雇佣约定和贡献者授权也要先确认。","practice":"输出一个第三方清单：组件、版本、用途、修改、是否交付、许可、履行方式、负责人。","check":"二进制包、容器、网站页脚和源码获取方式之间的记录能够对应。","pitfall":"本页不自动判定组合兼容性；不把文档常用的 CC 许可随意套到软件上。","sources":["license-spdx","license-cc","license-apache","license-agpl"],"level":"实用","domain":"new"},{"id":"closed-api-path","topic":"openpath","title":"闭源 API 路线：把精力放在业务与评估","subtitle":"不管理权重，不代表不需要工程。","intro":"这是一条建议的应用开发路径：先通过官方 API 做小范围试点，再补齐权限、评估、成本和运行监控。闭源是供给方式，不等同于不透明的业务过程。","mechanism":"建议拆成接口适配层、业务数据访问、输入输出校验、任务日志、评估集和回退策略。产品会员与开发者 API 的计费分开核对；向第三方传输的数据必须获得授权。","practice":"用20条非敏感业务样例建立基线，记录每次调用的输入/输出、版本、时间、成功率与成本；再替换另一个供应方复测。","check":"换模型不需要重写整个业务；失败有可解释的回退，不把模型输出直接变成高权限执行。","pitfall":"不要只以 token 单价比较总成本，也不要把本站方案建议视为某供应商安全承诺。","sources":["openai","evals","pay-gemini-api"],"level":"实用","domain":"new"},{"id":"open-selfhost-path","topic":"openpath","title":"开放权重自部署：从能运行到可交付","subtitle":"工具许可、模型许可和运维能力三件事同时确认。","intro":"自部署路线的建议顺序是：固定模型版本与许可 → 选择运行引擎 → 验证硬件与效果 → 增加服务保护 → 建立更新与回滚。","mechanism":"可以从 Ollama 或 llama.cpp 的小规模实验开始，需求更复杂时评估服务引擎。具体选择要通过测试，不能由“本地”两字推定安全，也不能由权重免费下载推定无成本。","practice":"准备可公开样例和资源预算，测首字延迟、生成速度、峰值内存/显存及并发；记录实际运行条件。","check":"同时通过正确性、延迟和资源验收；服务端口受控，备份和恢复可验证。","pitfall":"普通低价 VPS 不应默认当作大模型 GPU 服务器；可把它用于静态站或受控 API 网关。","sources":["res-ollama","res-llamacpp","res-vllm","osi-ai","vps-aws-vps"],"level":"实用","domain":"new"},{"id":"hybrid-path","topic":"openpath","title":"混合路线：让不同任务使用不同部署方式","subtitle":"先分类数据，再分配模型。","intro":"混合架构是本网站提供的一种设计建议：把允许外发和不允许外发的数据分类，再按任务难度、成本与时延决定处理路径。","mechanism":"例如公开问题可交给外部 API，内部检索在受控环境完成，严格不能外发的任务仅走本地。这需要日志脱敏、权限、超时、失败恢复和禁止外发的测试，不是简单加个路由开关。","practice":"建立三类样例：可以外发、需要脱敏、绝不外发。为每类定义允许的工具和服务，再测试异常路径。","check":"遇到本地模型失败时不会自动把敏感内容转发到外部供应商。","pitfall":"不要把多供应商路由当成自动合规或高可用；需要实际验证与维护。","sources":["agent-design","evals","vps-restic"],"level":"实用","domain":"new"},{"id":"publishing-path","topic":"openpath","title":"自己的产品要开源、闭源还是双许可？","subtitle":"架构选择与发布许可是两个问题。","intro":"开源应用也可以调用闭源 API；闭源产品也可能合法使用符合条件的开源组件。先确定自己拥有什么权利，再决定如何发布。","mechanism":"建议比较四条路：宽松开源便于复用；互惠开源要求特定改进回馈；专有许可控制授权但需自行投入支持；双许可/开放核心把不同授权或组件分开。双许可需要足够的权利，不能替第三方组件另行授权。","practice":"画出自有代码、受雇代码、第三方组件、贡献者与模型权重边界，标记希望公开的部分及收入来源。","check":"商业计划、许可证和实际交付一致；不会对客户承诺自己无权授予的权利。","pitfall":"不要把开源等同于不能收费，也不要把 GitHub 仓库开关作为完成授权的唯一动作。","sources":["osi-osd","license-mit","license-gpl","license-none"],"level":"进阶","domain":"new"},{"id":"ai-to-vps","topic":"openpath","title":"把 AI 网站放到 VPS：从静态页到受控服务","subtitle":"让知识站、应用服务和模型推理解耦。","intro":"本站就是静态站示例：HTML 内含资料和交互，不需要把模型或用户密钥放到服务器。部署后访问外部链接仍需要相应网络与账户条件。","mechanism":"建议第一阶段只发布静态文件；需要真实 AI 功能时增加服务端 API，密钥由服务端环境或密钥管理保存，配上鉴权、限流、日志和预算。模型推理可以保持外部 API，或另建合规的自部署服务。","practice":"先在本地打开本页；再按 VPS 建站文章配置域名、DNS、HTTPS 与备份。新增真实调用前，用模拟响应测试错误和权限。","check":"浏览器源码、日志和下载包不包含密钥；静态站可回滚，后端失败不会泄露私密配置。","pitfall":"前端环境变量不等于保密；不要裸露模型服务、管理面板或 Docker API。","sources":["vps-caddy","vps-ssh","vps-restic","mcp"],"level":"实用","domain":"new"},{"id":"n-embedding","topic":"n-vectors","title":"向量、Embedding 与相似度","subtitle":"数字坐标如何帮助找资料，又不能证明什么。","intro":"向量是有顺序的一组数。Embedding 是把文本等对象映射到向量空间的表示方法；检索利用向量之间的关系寻找候选，并不等于理解了事实，更不等于答案正确。文本和图片能否相互检索，取决于表示模型与训练方式。","mechanism":"余弦相似度是点积除以两个向量长度的乘积；余弦距离常定义为 1 减相似度。不要把距离当作相似度排序。不同模型、归一化方式、维数和数据分布不可直接混算；维数相同也不保证来自同一空间。零向量需要单独处理。","practice":"在向量实验里选择“设备温度告警”，查看三个坐标及各文档分数；再换查询，观察排序改变。实验使用人工指定的三维向量，目的是核对计算，不代表真实语义模型。导出数据后用 Python 项目复算。","check":"同一组数据在浏览器与 Python 中产生相同排序；相同向量相似度接近 1，正交向量为 0；记录表示模型、版本、维数、归一化和距离函数。","pitfall":"相似度 0.9 不是“90% 事实正确”。手工教学向量也不能用来估计真实知识库的效果。","sources":["n-pgvector"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-rag-stack","topic":"n-vectors","title":"知识库、向量库与 RAG：不是同一个东西","subtitle":"先区分存储、检索与生成，才能定位错误。","intro":"知识库是资料与管理流程的集合；向量数据库保存和搜索向量及元数据；RAG 是检索资料再辅助生成的系统模式。全文索引、关系数据库和对象存储也可能参与，上传文件不是训练模型。","mechanism":"一条典型链路是：授权资料 → 解析与清洗 → 分块和元数据 → 表示与索引 → 查询和权限过滤 → 检索 → 重排 → 组织证据 → 生成 → 引用核对。原文、向量、索引和生成器分别有版本，任何一环都可能改变结果。","practice":"把知识库拆成四个接口：导入、检索、回答、评估。先运行本站只返回证据的检索基线，再决定是否接入生成模型。用空问题、无答案问题和越权问题测试每个接口。","check":"回答可追溯到文档版本和原文位置；能够只运行检索而不调用模型；删除文档后相关索引失效；无证据时不生成确定结论。","pitfall":"向量库不是不可缺少的前提。数据少、编号多或只做精确查询时，先建立关键词或 SQL 基线。","sources":["n-pgvector","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-chunking","topic":"n-vectors","title":"分块与元数据：先保留语义，再谈长度","subtitle":"标题、表格、代码和权限也是资料的一部分。","intro":"分块把长文档切成可检索单元。好的单元应尽量保留完成一个局部问题所需的上下文，而不是只按字符数机械切开。中文字符数、字节数与 Token 数不是同一单位。","mechanism":"可以按标题、段落、表格或代码符号分块，并附文档 ID、版本、标题路径、原文定位、权限、更新时间。适度重叠能保留边界信息，也可能增加重复结果与存储成本。摘要用于检索时，仍应能回到原始证据。","practice":"拿同一篇脱敏说明书分别按段落和固定长度分块，保留相同十个测试问题。记录每次召回中是否包含完整限制条件，特别测试跨段落、表格脚注和代码注释。","check":"每块能回查原文；删除或修改时可精确更新；长度不超所用表示模型限制；分块策略变更后重跑测试集。","pitfall":"更大的块不必然更好，过多重叠也不必然增加有效信息。切掉“仅适用于某型号”等条件会改变原意。","sources":["n-context","n-pgvector"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-index","topic":"n-vectors","title":"精确搜索、HNSW 与 IVFFlat","subtitle":"先建立正确性基线，再用近似搜索换性能。","intro":"精确搜索逐一比较候选向量；近似最近邻搜索减少比较工作，但可能遗漏本应命中的结果。选索引不仅看速度，还要看召回、内存、构建成本、更新方式和过滤条件。","mechanism":"pgvector 支持精确搜索，也提供 HNSW 和 IVFFlat。HNSW 使用多层图组织邻近关系；IVFFlat 把向量分组后扫描部分组。索引与距离函数必须匹配。比较性能时固定数据、问题与硬件，分别测查询和构建。","practice":"保留一个不使用近似索引的检索版本，对同一批查询取 Top-K 作为对照。改变索引参数后，记录相对精确结果的召回率及延迟分位数，不只看单次平均耗时。","check":"有精确基线、真实权限过滤、插入删除测试和参数记录；能说明延迟改善是否值得相应召回损失。","pitfall":"Top-K 是返回条数，不是正确率。近似搜索再过滤可能返回不足 K 条，要按引擎说明检查过滤策略。","sources":["n-pgvector"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-hybrid","topic":"n-vectors","title":"关键词、向量检索、混合召回与重排","subtitle":"设备编号和自然语言问题，往往需要不同信号。","intro":"关键词能保留型号、错误码和精确术语；向量表示有机会连接不同说法。混合召回先取多路候选，再合并；重排在较小候选集上重新评分，不能挽回根本没召回的资料。","mechanism":"两路分数未必同尺度。可以先比较基于排名的融合，例如 RRF 对每一路排名 r 累加 1/(k+r)，再去重。阈值需要用本任务数据校准。生产重排器可能是独立模型；本网站重排开关只模拟词项与标题加权。","practice":"用含错误码的查询和口语化查询各五条，比较仅关键词、仅向量、混合三个版本。观察标识符是否丢失、候选是否重复、增加重排后答案依据是否改变。","check":"每路候选和合并规则可见；重排前后排名有日志；新增成本和延迟有记录；不会把不同空间的原始分数直接相加。","pitfall":"混合不是永远优于单路。只有真实测试集能说明收益，教学加权不等于真实神经重排效果。","sources":["n-pgvector","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-acl","topic":"n-vectors","title":"知识库权限与租户隔离","subtitle":"不能把“请勿泄露”当作权限控制。","intro":"访问权限应由服务端鉴权和检索条件控制，不依赖生成模型遵守提示词。无权限文档不应进入候选、日志、缓存或模型上下文。浏览器里的实验权限仅展示机制，不构成真实安全边界。","mechanism":"用户身份来自可信认证；文档带租户与访问属性；检索前或引擎支持的检索过程中限制数据范围；返回前复查权限。缓存键还应包含租户、授权范围和版本。撤销权限需要考虑已缓存的数据。","practice":"实验切换公开读者和内部成员，观察内部阈值文档是否出现在返回结果。线上验收使用两组真实角色和直接 API 请求，不只点界面。把问法改成诱导引用、列标题、总结所有文档等再检查。","check":"无权限资料的正文、标题和标识均不泄露；日志脱敏；撤权和删除后不可再访问；服务端不接受客户端任意声明的管理员身份。","pitfall":"离线页面包含全部教学资料，用户可查看源码；因此只能使用虚构数据，绝不能承载真实密级文档。","sources":["n-pgvector","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-rag-eval","topic":"n-vectors","title":"如何验收一个知识库","subtitle":"把检索命中和最终回答正确分开计量。","intro":"准备任务数据时给每道题标注需要的文档或证据、允许答案、无答案条件和权限。训练、调参用的问题与最终验收集应分开；把失败加入回归集，而不是不断改动标准去迎合结果。","mechanism":"检索侧可看 Recall@K、MRR、重复率和越权泄露数；回答侧看正确性、依据支持、引用定位和拒答。MRR 用第一条相关结果名次的倒数衡量排序，未召回记 0。不同问题可能有多个相关文档，应记录标注规则。","practice":"先用项目库的三种问题：有答案、无答案、无权限。再补相似文档、过期条款、冲突版本和表格题。每次换 Embedding、分块、索引或模型都导出一份对比记录。","check":"验收标准事先写明；保留模型和数据版本；报告样本数与失败例；安全用例不能被平均分抵消。","pitfall":"只拿三条成功截图，不足以证明上线质量。教学数据集只能验证流程，不能代表企业实际准确率。","sources":["n-pgvector","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-rag-ops","topic":"n-vectors","title":"更新、删除与成本：知识库上线之后","subtitle":"资料会变，索引也需要可追溯的生命周期。","intro":"知识库维护不仅是第一次导入。还包括新版本覆盖、重复资料合并、撤权、删除、重建、失败补偿和灾难恢复。保留源文件哈希、块 ID 与索引版本有助于确定哪些内容真的变了。","mechanism":"换表示模型通常需要重算向量并重建对应索引，不能把新旧空间混在一起检索。可以构建新版本、验证后切换别名，并保留回滚路径。费用拆成解析、表示、存储、检索、重排、生成与运维。","practice":"模拟修改一条说明书、删除一条文档、取消一个角色权限。建立“旧版本仍被命中”回归用例。费用估算分别输入新增和全量重算量，别把首次建库与每月增量混算。","check":"更新有版本、失败可重试且幂等；删除有验证；换模型可回滚；备份至少恢复演练一次。","pitfall":"只删源文件不等于索引、缓存和日志都已删除。不要把向量误认为不可能包含敏感信息的匿名数据。","sources":["n-pgvector","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-task-contract","topic":"n-context","title":"提示词第一步：写清任务合同","subtitle":"目标、边界和验收，比角色头衔更重要。","intro":"任务合同说明要解决什么、依据哪些材料、哪些操作被允许，以及怎样确认完成。角色设定可以调整语气，但不能取代真实背景、证据和工具权限。","mechanism":"把输入组织为：目标、资料、约束、输出结构、验收。用清晰分隔符区分指令和不可信资料。缺少重要输入时，让模型列出缺口或采用明确假设；不要鼓励它补造出处。","practice":"使用模板构建器，把“优化我的代码”改成“仅修改解析函数，兼容现有接口，新增空输入和边界测试，输出差异与测试结果”。填入真实文件名但不要放密钥或个人资料。","check":"第三方读者能判断输出是否完成任务；输出可被脚本或人工审查；每个重要约束都有对应检查。","pitfall":"约束堆得多不代表指令好。冲突规则、没有依据的“必须正确”和要求完整内部推理，都不能代替验证。","sources":["n-prompt","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-context-budget","topic":"n-context","title":"上下文工程：把正确的信息放到正确的位置","subtitle":"不是把整个仓库全部塞进对话。","intro":"上下文包括系统指令、任务、对话历史、检索资料和工具结果。有限预算应优先用于当前决策需要的信息；引用路径、摘要和按需读取能降低无关内容占比。","mechanism":"为稳定规则、当前任务、证据、工具输出和预留输出设预算。摘要保留目标、关键决定、证据位置、未解决风险和下一步验证。原始证据不可只剩无法回查的概括。上下文上限和实际可输出长度也要分别检查。","practice":"将一个任务拆成全局规则、当前步骤、按需资料三个包；在网站预算器中手动填入 tokenizer 或 API 返回的 Token 数，调整历史占用和输出预留。","check":"压缩后仍能定位关键文件与决定；未完成事项没丢；生成前预算不过载；丢弃的信息可以按需重新读取。","pitfall":"网站不把字数伪装成精确 Token 数。分词随模型变化；长上下文不等于所有位置的信息都被等效使用。","sources":["n-context","n-prompt"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-examples","topic":"n-context","title":"示例、结构化输出与负例","subtitle":"给标准，而不是让模型猜你的标准。","intro":"示例可以明确标签、格式与边界条件。负例说明什么不满足要求；独立的校验逻辑负责发现非法字段、缺失值或格式错误。结构正确仍不代表业务事实正确。","mechanism":"把生成与校验分开：模型输出数据，程序检查 schema、枚举、范围和业务约束；失败时限制重试次数并记录原因。样例应覆盖普通和边界情况，避免把测试答案直接放进提示词。","practice":"用评测区的工单 JSON 任务，先提交多余字段、错误枚举、字符串数字和缺失值，再提交符合格式的错误答案，观察格式检查与事实检查的区别。","check":"校验器能拒绝非法结构；没有为通过测试硬编码答案；拒答和未知值有约定；证据与提取字段对应。","pitfall":"JSON 看起来工整不代表正确。宽松解析偷偷修补模型输出，会掩盖真实失败率，应保留原始返回。","sources":["n-prompt"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-handoff","topic":"n-context","title":"长任务交接、检查点与恢复","subtitle":"不靠无限续聊维持项目状态。","intro":"长任务需要在文件或状态记录里保存进度。每个检查点记录完成内容、尚未完成项、修改位置、已跑测试和风险；“我已经做完”不是证据。","mechanism":"在计划、实现、测试、审查之间建立短反馈循环。交接包保留仓库版本、工作区状态、测试命令和观察结果。重新开始时先复核环境和 diff，不把上一轮结论直接当作最新事实。","practice":"复制长任务交接模板，在完成一次小改动后填写。让另一名协作者只根据交接包继续；记录其不得不询问的内容，回补模板。","check":"中断后能找到真实文件；已执行与待执行操作区分；失败测试未隐藏；恢复不会覆盖未提交改动。","pitfall":"摘要不能替代版本控制。多人或多 Agent 同时修改同一工作区会产生相互覆盖；用独立分支或 worktree。","sources":["n-context","n-git-worktree"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-git-basics","topic":"n-git","title":"Git 和 GitHub：本地历史与远程协作","subtitle":"不把上传文件当作版本管理的全部。","intro":"Git 管理本地版本历史；GitHub 提供托管、代码审查、问题跟踪和自动化等协作能力。工作区、暂存区与提交是不同状态，远程同步还需要 fetch、pull 或 push。","mechanism":"提交前用 status 和 diff 看清变更，用 add 选择要记录的内容，再用 diff --cached 审查暂存区。提交说明解释意图；一次提交保持相对独立，便于审查和回滚。","practice":"在临时空目录建立练习仓库，修改一份 README，分别查看暂存前后的 diff。不要在真实生产仓库练习破坏性操作。检查 .gitignore 是否覆盖环境变量、构建产物和本地数据。","check":"能区分已修改、已暂存、已提交和已推送；知道 origin 指向哪里；提交里没有密钥和临时文件。","pitfall":".gitignore 不会自动移除已经进入历史的秘密。秘密泄露时优先撤销或轮换凭据，再处理历史。","sources":["n-git-book","n-github-flow"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-git-ai","topic":"n-git","title":"用分支与 worktree 管理 AI 改动","subtitle":"让每个任务拥有明确、可审查的边界。","intro":"分支记录开发线；worktree 可以让同一仓库在不同目录检出不同分支，便于并行任务。它并不自动隔离数据库、端口、外部服务、凭据或部署环境。","mechanism":"给每个任务独立分支和目录，限制可改范围。提交前看 diff --stat 和完整 diff；由测试与审查决定合并。共享锁文件和依赖升级应协调，不能因为分支独立就忽略冲突。","practice":"命令页生成 git worktree add -b feature/ai-docs ../atlas-ai-docs。先用 git worktree list 检查当前目录；结束前确认改动已提交或保存，再移除练习工作树。","check":"每个任务有独立目标与分支；端口不冲突；合并前重跑集成测试；只看 Agent 回复不算验收。","pitfall":"不要使用清空目录或强制移除来掩盖未提交改动。worktree 不是安全沙箱。","sources":["n-git-worktree","n-github-flow"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-git-review","topic":"n-git","title":"Pull Request：让审查者看到证据","subtitle":"变更理由、风险和测试，比“已完成”更有用。","intro":"PR 描述应回答为什么改、改了什么、如何验证、风险在哪里、怎样恢复。截图适合界面变化；逻辑改动还需要可复现输入与测试。","mechanism":"先把变更拆成可审查单元，再用 CI 执行可重复检查。外部贡献和自动化脚本都是不可信输入，不随意授予写权限或暴露仓库秘密。检查依赖与工作流改动，不只看业务代码。","practice":"按网站模板写一份 PR：关联任务、变更范围、未改动范围、命令和结果、回滚方法。给代码审查助手设置“报告问题但不直接合并”。","check":"审查者能复现；截图与代码版本一致；失败测试不省略；主分支保护和合并要求由团队明确配置。","pitfall":"CI 绿灯只能证明被执行的检查通过。没有覆盖的需求、运行环境差异和误用权限仍可能出错。","sources":["n-github-flow","n-git-book"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-git-recovery","topic":"n-git","title":"撤销、恢复和定位回归","subtitle":"先保留证据，再选择最小影响的操作。","intro":"发现问题先看 status、log 和 diff，确认错误在未提交工作区还是已发布提交。已共享的提交通常更适合用新提交撤销，避免随意改写别人依赖的历史。","mechanism":"git revert 为指定提交创建反向修改；是否自动合并成功取决于后续改动。git bisect 使用好坏版本缩小回归范围，需要能重复执行的判定。未跟踪文件与外部数据不由普通提交自动保护。","practice":"在练习仓库中引入一个可由测试捕获的错误并提交，再用 revert 撤销；记录前后日志。使用 bisect 前保持工作区干净并确保判定脚本稳定。","check":"撤销后重新执行功能测试；没有误删未提交资料；提交历史可理解；涉及数据库迁移时有单独恢复方案。","pitfall":"不要默认使用 reset --hard 或 force push 处理所有问题。代码回退也不会自动撤回已发送邮件或已执行付款。","sources":["n-git-book"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-eval-design","topic":"n-evaluation","title":"同题评测：怎样做才不误导","subtitle":"固定任务与环境，记录失败，而不是编一个总分。","intro":"比较对象应该是明确配置的系统，而不是含糊的模型名称。固定任务、输入、工具、预算和验收，再分别观察回答、执行结果和人工修改量。","mechanism":"客观任务尽量用确定性检查；主观任务用明确量表与盲评，必要时多人标注。报告样本数和重复次数。模型裁判可能有偏差，不能未经校准就替代业务验收。","practice":"在评测页选择结构化提取题，比较预设教学方案 A/B，再粘贴自己的输出。导出记录时填写模型版本、参数、日期与来源；不要把教学答案标成某厂商实测。","check":"原始输出可见；格式与事实分开评分；不确定项明确标注；更换标准需要版本记录；安全失败单独报告。","pitfall":"少量题目不能代表综合能力。表格中的定位是编辑选型建议，而不是测量得到的排行榜。","sources":["n-context","n-prompt"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-debug-method","topic":"n-evaluation","title":"故障排查：先最小复现，再逐层缩小","subtitle":"改变一个变量，保留一份证据。","intro":"故障报告应包含环境、预期、实际、步骤、日志和发生范围。先区分网络、认证、配额、模型输出、检索、工具执行和业务规则，而不是一次更换所有组件。","mechanism":"建立最小请求或最小输入，保留成功对照。逐层检查输入、状态、输出和副作用；每次改动记录假设与证据。请求 ID 和时间帮助定位，但日志要去除密钥与个人信息。","practice":"选择排查中心的一项症状，逐条完成检查并导出 incident.md。修复后重跑原失败输入、正常输入和边界输入，再决定是否关闭问题。","check":"复现步骤能被另一人执行；修复没有引入新问题；重试受限且不重复产生副作用；有撤回临时改动的记录。","pitfall":"随机重试可能扩大费用或重复写入。看到 401 就换网络、看到超时就换模型，都会掩盖真正原因。","sources":["n-prompt","n-context"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"n-deploy-cn","topic":"vps-hosting","title":"把知序 AI 部署到国内可访问的网站","subtitle":"静态站可以本地托管；访问本站与访问外部服务是两件事。","intro":"本项目将样式、脚本和资料打包为 index.html。无需 GPU、模型后端或数据库即可提供阅读、搜索、筛选和教学演示。部署到服务器后，站内记录仍只保存在访问者浏览器，不自动变成跨设备账号数据。","mechanism":"大陆云服务器或大陆静态托管：先落实域名实名、ICP备案与接入要求，再绑定域名和 HTTPS。香港节点不要求大陆 ICP，但访问质量仍取决于线路、运营商与时段；使用大陆 CDN 时须另核对备案要求。对象存储默认域名可能触发下载，正式发布应使用正确配置的自定义域名。","practice":"将源码包构建好的 index.html 上传到专用 Web 根目录，不要上传源码、配置或备份。先完成适用备案，配置 DNS / HTTPS，启用压缩和短缓存，然后分别在联通、移动、电信的真实网络检验首页、深链接、搜索、表格与导出。源码包 deploy/ 提供 Nginx、Caddy 和国内部署说明。","check":"页面以 HTML 显示而非下载；刷新 #pricing 等地址不会丢失路由；无第三方字体和 CDN 加载依赖；HTTPS、访问日志与更新回滚可用；适用的备案号显示为真实号码并链接至官方查询。需要跨设备收藏或自动新闻时，另行设计后端。","pitfall":"本站在国内可访问，不代表 X、YouTube 或第三方 AI 服务变得可访问。不要用 iframe、镜像或账户代理把它们伪装成本地功能。部署包不包含真实模型服务，不会绕过地区与服务条款，也不自动取得内容或业务许可。","sources":["p031-icp","p031-cdn","p031-static","p031-police","p031-cloudbase"],"level":"入门 / 实践","checked":"2026-09-11"},{"id":"h-01","topic":"harness","title":"Harness 是什么：模型之外，还缺一套运行系统","subtitle":"先分清六个容易混在一起的词。","intro":"把模型想成一位会提出方案的工程师：它能说“查日志，再修改配置”，但谁允许它看哪些日志？谁执行修改？断电后如何续做？这些不是多写一句提示词就会自动出现的能力。本站把 Harness 理解为包围模型的运行与约束系统。这个词没有唯一的正式边界；在不同文章中也可能包含仓库规范、测试与反馈环境。","mechanism":"模型负责根据上下文提出下一步；Agent 是围绕目标反复观察、决策、行动的系统。Harness 负责连接上下文、工具执行、状态、权限、预算和验收。框架提供搭建材料；MCP 解决一类连接与交互约定；Skills 存放可复用方法。它们可以配合，不是互相替代的产品等级。","example":"以“帮我排查设备掉线”为例：模型建议读取日志，Harness 检查设备编号、调用只读日志工具、截取有关片段、把结果回传。模型提出重启时，Harness 转为等待审批，而不是因为回答语气确定就执行。若没有批准，任务仍能交付一份只读分析报告。","code":"用户目标\n  ↓\nHarness：状态 · 上下文 · 权限 · 工具 · 预算 · 验收\n  ↔ 模型：提出下一步 / 解释证据\n  ↔ 工具：读取或改变受控环境\n  ↓\n经验证的产物 / 明确的未完成状态","pitfall":"不要把 Harness 当作某个特定模型、某个“万能提示词”或 MCP 的别名。框架安装成功，也不代表你的权限和验收策略已经设计好。","practice":"画出一个你正在做的 AI 功能：用不同框标出模型、外部数据、执行程序、权限检查和最终产物；圈出现在还没有实现的部分。","check":"能说清“模型建议删文件”和“系统执行删文件”之间至少还应经过哪些检查；能够明确指出谁有权把任务标记为完成。","sources":["h-harness","h-engineering","h-agent"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":1,"table":[["模型","提出推理与行动建议","不能把回答文本当真实执行结果"],["Agent","围绕目标观察与行动","不是所有自动化都需要 Agent"],["Harness","承接执行、状态与约束","必须落在程序和环境中"],["框架 / SDK","提供构建组件","不自动给出业务安全策略"],["MCP","连接工具和数据的协议层","不自动获得业务授权"],["Skills","复用说明、脚本与参考材料","不是天然可信的可执行内容"]],"contentType":"原创教学解释 / 设计示例"},{"id":"h-02","topic":"harness","title":"先写任务合同，再画状态机","subtitle":"把“做得不错”变成明确的验收条件。","intro":"一个任务合同不必复杂。它回答六件事：输入是什么、允许做什么、禁止做什么、交什么产物、谁来验收、何时停止。没有合同，模型可能把“写了报告”理解成“解决了故障”，而用户想要的是找到能复现的根因。","mechanism":"状态机把模糊过程切成可检查的阶段。读取资料、等待审批、执行工具、验证结果、完成，应该是不同状态。每条迁移都有前提；例如只有独立校验通过，才能进入 DONE。缺资料可以进入 NEED_INPUT，预算用尽进入 STOPPED，不能为了好看都改成成功。","example":"示例合同：检查一份模拟设备日志，只读分析；报告必须包含时间、错误码、证据行号和不确定性；不能重启设备。验收器验证报告有原始行号、没有把未知错误码解释成已知故障，并且没有发生受限操作。它检验产物，不检验模型有没有写“任务完成”。","code":"{\n  \"goal\": \"解释模拟日志中的异常\",\n  \"allowed_tools\": [\"read_log\", \"save_draft\"],\n  \"forbidden\": [\"restart_device\", \"publish\"],\n  \"output\": \"含 evidence_ids 的报告\",\n  \"max_steps\": 12,\n  \"done_when\": \"artifact_exists && evidence_valid && checks_pass\"\n}","pitfall":"“尽可能完成”“不要犯错”不可自动检查。验收条件也不能在失败之后悄悄放宽；需要改变目标时，记录新版本并让负责人确认。","practice":"用你自己的工作场景填一份任务合同，列出一个成功路径、一个缺资料路径、一个权限拒绝路径。","check":"人为删掉输出文件、替换一个证据编号或拒绝审批后，系统都不能进入 DONE。","sources":["h-agent","h-engineering"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":2,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-03","topic":"harness","title":"最小 Agent 循环：提议、校验、执行、观察","subtitle":"工具调用是一份请求，不是一条已经执行的命令。","intro":"不需要一上来搭十个角色。先实现一个循环：把当前任务和证据交给模型，拿回结构化提议，校验后执行工具，再把工具的真实结果反馈给模型。循环停止也需要规则，而不是等待模型自己永远保持克制。","mechanism":"模型适配器只返回两类对象：行动提议或最终产物候选。运行器检查对象类型、工具名、参数类型和权限；执行器负责超时、返回结构与错误分类；验证器决定候选是否满足合同。模型可以请求结束，但不能越过验证器写入成功标志。","example":"一个易懂的返回值是 {kind:\"tool\", name:\"read_log\", args:{device:\"demo-01\"}}。如果设备号不存在，工具返回 NOT_FOUND 与可恢复提示，而不是一段看不出成功失败的长文本。模型随后可以请求补充设备号或明确报告缺资料。","code":"while within_budget(state):\n    proposal = model.propose(build_context(state))\n    if proposal.kind == \"final\":\n        return verify_or_reject(proposal, state)\n    call = validate_schema_and_authorize(proposal)\n    observation = execute_with_timeout(call)\n    state = record_and_checkpoint(state, observation)\nreturn stopped_report(state)","pitfall":"绝不能把模型输出直接传给 eval、exec 或 shell。兼容某个 API 格式，也不意味着模型一定支持你的工具 schema、流式事件或错误语义。","practice":"先用固定脚本代替模型生成提议。依次注入未知工具名、缺字段、字符串冒充数字和一个正常请求，验证运行器而不是比模型聪明程度。","check":"非法提议不产生副作用；正常请求有结构化观察；超出步数后可以停止，并输出已完成与未完成项。","sources":["h-agent","h-owasp"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":3,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-04","topic":"harness","title":"工具设计：让模型看得懂，让程序守得住","subtitle":"名字、参数、权限、错误和输出必须一起设计。","intro":"工具接口不宜只叫 run(command)。对于固定业务，read_log、search_manual、create_draft 更容易限定范围。模型只需表达目的，系统可以在背后使用已有数据库或服务。工具越接近明确业务动作，越容易审计它到底改变了什么。","mechanism":"工具说明需要列出用途、不能做什么、参数约束、返回值和失败条件。只读与写操作分开；参数白名单由程序验证；输出携带来源和状态。工具结果可能来自不可信文档，里面写着“忽略规则”也仍然只是资料，不能升级为系统指令。","example":"知识检索工具应接受查询、用户已认证的权限范围和版本要求。用户身份由服务端会话取得，不让模型自己填一个 admin=true。返回有限长度的片段与 doc_id、版本、页码；下一步需要更多内容再按 ID 读取。","code":"{\n  \"name\": \"read_log\",\n  \"read_only\": true,\n  \"args\": {\"device_id\": \"已授权设备 ID\", \"limit\": \"1..100\"},\n  \"returns\": {\"ok\": true, \"lines\": [], \"source_id\": \"...\"},\n  \"errors\": [\"NOT_FOUND\", \"FORBIDDEN\", \"TEMPORARY_UNAVAILABLE\"]\n}","pitfall":"工具列表里只提供只读工具，是一层减少风险的措施，但不是完整安全边界。文件系统、网络、服务端权限仍要限制；检查路径时要考虑绝对路径、符号链接和越界访问。","practice":"把一个万能 shell 工具拆成两个只读工具和一个有审批的写工具，给每个工具设计一种不可重试错误和一种可重试错误。","check":"调用越权设备、超长参数、不存在工具和来自文档的恶意指令时，不会获得额外权限；错误有明确类别。","sources":["h-owasp","h-agent"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":4,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-05","topic":"harness","title":"上下文工程：给下一步需要的信息，不是塞满历史","subtitle":"任务、工作记忆和外部知识分层组织。","intro":"上下文像工作台。把整个仓库、全部聊天和所有日志堆在台面上，不等于更容易工作。更好的问题是：为了决定下一步，模型现在需要哪些约束、哪些证据和哪些未解决问题？其余内容保存为可回查的引用。","mechanism":"建议分四层：稳定任务合同；当前状态和待办；本步相关证据；工具定义与能力。长期资料保存在外部检索库，执行记录保存在状态库。摘要保存事实、决定、来源 ID 和尚未解决的问题，不把模型猜测升级为事实；也不要依赖获取或存储模型的私有思考过程。","example":"夜间代码审查每次只处理一个模块。给模型接口定义、调用者、被调用者和当前 diff，再提供完整文件的只读读取工具。交接记录只写“发现空指针分支，尚未复现；相关行与测试如下”，而不是简单写“模块已审查”。","code":"{\n  \"contract_ref\": \"task-v3\",\n  \"current_item\": \"uart/reconnect\",\n  \"facts\": [{\"claim\": \"重连失败\", \"evidence\": [\"log:18\"]}],\n  \"hypotheses\": [\"可能与计时器重置有关，未验证\"],\n  \"next_check\": \"读取 retry_timer 的实现\",\n  \"artifact_refs\": [\"report-draft-02\"]\n}","pitfall":"摘要会丢信息；向量检索也可能漏召回。关键证据必须能回原文复核，安全策略不能只保存在容易被压缩掉的一段历史对话里。","practice":"取一段长任务记录，分成事实、假设、决定、待办和引用五部分，再检查一个新会话能否接着做下一项。","check":"原始依据能回查，摘要中没有把失败改写成成功；权限和预算在上下文压缩后仍由程序执行。","sources":["h-context","h-harness"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":5,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-06","topic":"harness","title":"检查点、恢复与幂等：断了以后不从头乱做","subtitle":"存下进度，与保证外部动作只执行一次，是两回事。","intro":"检查点像存档：它记录任务处于哪里、哪些动作已确认、预算花了多少。恢复时先核对存档版本和真实环境，再继续未完成步骤。它不是简单保存聊天内容，因为聊天未必能准确说明工具是否真的完成了写入。","mechanism":"最棘手的是“动作完成但回执丢了”。如果创建工单成功之后进程崩溃，重新执行可能创建第二张。可为每个外部动作生成稳定幂等键，并在外部系统查询或复用该键对应的结果。没有目标系统配合时，单靠本地 JSON 不能许诺 exactly-once；应进入待对账或人工确认。","example":"保存报告相对容易：在专用目录用任务 ID 命名，先写临时文件，校验后替换。创建工单则应保存请求 ID、幂等键、响应 ID 和不确定状态。恢复程序先查是否已存在对应工单，再决定继续还是重试。","code":"{\n  \"schema_version\": 1,\n  \"task_id\": \"demo-42\",\n  \"state\": \"WAITING_RECEIPT\",\n  \"action_key\": \"demo-42:create-ticket:rev2\",\n  \"external_id\": null,\n  \"next\": \"query_before_retry\",\n  \"confirmed_artifacts\": [\"report-v1\"]\n}","pitfall":"原子保存一个文件只能防止部分本地损坏，不能解决跨服务事务、并发任务抢占和所有故障窗口。恢复时也要重新验证已过期权限。","practice":"分别在执行前、执行后但保存回执前、保存回执后制造中断，写出三种恢复策略。明确指出哪些情况需要外部对账。","check":"已确认的动作不会重复；结果不确定的动作不会盲目重放；损坏或版本不兼容的检查点会被拒绝。","sources":["h-persist","h-interrupt"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":6,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-07","topic":"harness","title":"人工审批：批准的是这个动作，不是无限通行证","subtitle":"把授权绑定到参数、对象和版本。","intro":"审批按钮不应只是 approve=true。人批准的是“对 demo-01 生成这一份草稿”，而不是以后所有设备、所有写入都放行。审批界面至少展示动作、目标、参数、预期影响，以及能够撤回或回滚到哪里。","mechanism":"运行器产生待批提议后，计算工具名、参数、目标和任务版本的摘要。审批记录绑定这个摘要，并设有效期。执行前重新检查身份、对象状态、参数摘要和权限；参数变了就重新审批。审批来自可信用户会话，不能从模型输出或检索文档里解析出来。","example":"模型先建议给某工单添加草稿，人批准后它又补充了一个收件人。这已不是原提议。系统必须重新展示变化，不能沿用旧批准。涉及支付、生产配置或公开发布时，还应有相应业务级复核。","code":"approval = {\n    \"action_digest\": digest(tool, args, task_revision),\n    \"approved_by\": authenticated_user_id,\n    \"expires_at\": server_deadline,\n}\nassert current_digest == approval[\"action_digest\"]\nassert still_authorized() and not expired()","pitfall":"浏览器演示中的审批只说明状态流转；不是生产认证或授权实现。把 API 密钥交给模型也不能代替权限设计。拒绝应导致明确停止或降级为只读报告。","practice":"在模拟审批后修改一个参数，再试图执行。补一条“批准过期”的测试；检查两种情况是否都会停下来。","check":"拒绝时零副作用；改参数或过期后原审批失效；审计记录能说明谁批准了哪一个动作。","sources":["h-interrupt","h-owasp"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":7,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-08","topic":"harness","title":"长程任务 Harness：让下一次接手不靠猜","subtitle":"初始化、增量执行、交接与独立验收。","intro":"长程任务不是给模型一句“持续工作直到完成”。一次上下文可能结束，机器可能重启，测试可能改变。你需要让任务在一次次短工作阶段之间留下清晰的环境、状态和可验证产物。","mechanism":"可以先做初始化：固定需求清单、准备运行与测试命令、建立干净基线。后续每轮只推进一个小目标，提交差异、运行相关测试、记录未完成事项。下一轮先读状态和版本，再做健康检查，最后继续。初始化和执行可以是同一模型的不同阶段，不必夸大成多智能体系统。","example":"审查一个较大的嵌入式仓库：先按模块与依赖切片，保留中断、共享状态、调用关系等跨模块线索。每轮交付一个可复现问题或一份“未发现但覆盖有限”的记录。测试失败时不得通过删除断言、缩减范围来伪装任务完成。","code":"workspace/\n  task-contract.json   # 经人确认的范围\n  feature-list.json    # 每项有独立验收\n  progress.md          # 事实、阻塞与下一步\n  tests/               # 不随意修改验收基准\n  artifacts/           # 报告与证据\n  init.sh              # 可重复的环境入口","pitfall":"很多次成功提交不等于最终用户流程正确。还要做系统级回归；长任务恢复也不应自动执行仓库中未经审查的任意脚本。","practice":"选一个可以拆成三项的小改造。完成第一项后关掉执行进程，只凭仓库状态和交接记录继续第二项。记录缺失的信息。","check":"能恢复到明确的未完成项；验收定义没有被静默削弱；每次提交都有对应证据和运行结果。","sources":["h-harness","h-engineering"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":8,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-09","topic":"harness","title":"预算、超时与重试：给系统装上停止条件","subtitle":"可恢复错误才重试，重复无进展要停止。","intro":"一次模型调用便宜，不代表整个任务便宜。长输入、循环重试、搜索、缓存写入、工具运行都会累计。预算应该覆盖模型与工具，而不是只在页面角落显示一个 Token 计数。","mechanism":"设置最大步骤、单工具超时、任务截止时间、可重试次数和资金上限。每次行动前预留预算，返回后按真实使用结算。未知结果的写操作不能直接重试；权限错误不应靠重试解决。错误相同且证据没有变化时，进入无进展停止或人工介入。","example":"批量审查 50 个模块时，为每个模块分配一个小预算，并为总任务设独立上限。某模块连续两次无法解析编译环境，转为“需要人工补充环境”，继续记录其他独立模块；不要每轮都重新加载整个仓库。","code":"limits = {\"max_steps\": 12, \"max_retries\": 2, \"deadline_s\": 120}\nif permission_error: stop(\"denied\")\nelif write_result_unknown: reconcile_before_retry()\nelif transient_error and retries < 2: retry_with_backoff()\nelif no_new_evidence: stop(\"no_progress\")\nelse: return_observation_to_model()","pitfall":"模型报出的 Token 预测不是账单。取消客户端请求也不一定使服务商停止计费；预算预留、供应商限额和事后对账需要一起使用。演示中的步数不代表真实 API 费用。","practice":"把同一次临时故障、同一次参数错误和一个不确定写结果分别送入恢复逻辑，观察它们是否走了不同路径。","check":"超限能停止；重试次数有上限；预算不足不执行下一步；报告写清实际已用量与仍需对账的部分。","sources":["h-agent","n-openai-price","n-claude-price"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":9,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-10","topic":"harness","title":"评估 Harness：别只给最终回答打分","subtitle":"同时看产物、过程、成本和副作用。","intro":"回答措辞很好，但文件没生成，这是失败。文件生成了，却覆盖了无关内容，也不是成功。Harness 评估要检验真实产物、权限边界和失败恢复，而不只让另一个模型评价“看起来是否专业”。","mechanism":"先给任务固定输入和验收器，再记录工具事件、状态迁移、模型和提示版本、费用与人工介入。能确定性检查的字段由程序检查；需要判断质量的部分再用人工或审慎设计的模型评分。日志保留工具输入输出摘要、证据与判定，不要求模型泄露内部思考过程。","example":"用同一组任务做消融：固定模型，比较有无检查点；固定模型与工具，比较有无权限审批。再更换模型观察结果。否则同时改模型、工具和提示，即使成功率变高，也不知道是谁起作用。教学样例不能拿来冒充真实模型实测。","code":"{\n  \"task_success\": false,\n  \"artifact_exists\": true,\n  \"evidence_valid\": false,\n  \"unauthorized_writes\": 0,\n  \"retries\": 1,\n  \"human_interventions\": 1,\n  \"model_version\": \"record-exact-version\"\n}","pitfall":"不要只保留通过的样例。单次通过、平均得分、最坏故障与重复运行波动是不同指标；模型裁判也需要验证偏差。","practice":"建立五个正常任务与五个故障任务，至少包括无答案、越权、超时、无产物和恢复重放；固定验收后再优化提示。","check":"每次“成功”都能对到产物和依据；失败原因可以定位到模型、数据、工具、权限或运行器。","sources":["h-engineering","h-owasp","h-agent"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":10,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-11","topic":"harness","title":"框架与多 Agent：需要时再增加复杂度","subtitle":"先看控制权、状态与故障语义，再看功能清单。","intro":"单 Agent 能稳定完成的小任务，不必拆成策划、研究、执行、审查等十个角色。角色越多，交接内容、重复工作、权限分配和费用协调越复杂。多 Agent 的价值应该来自可验证的任务分工，而不是让对话更像一个公司。","mechanism":"框架选型要看：谁控制循环、检查点放在哪里、如何暂停与恢复、是否支持参数绑定审批、工具失败如何传递、能否导出运行记录。MCP 解决连接方式，不能替代这些运行语义。多 Agent 可用于真正独立的子任务；最终仍需聚合验收与总预算。","example":"审查彼此独立的模块，可以分派只读子任务；每个子任务在独立工作区生成报告，由协调器去重和核对跨模块调用。多个 Agent 同时修改同一文件时，应避免共享工作树，合并冲突由确定的负责人处理。","code":"先问：是否有独立且可验收的子任务？\n  否 → 单 Agent / 固定工作流\n  是 → 限额并行 + 独立状态 + 统一聚合验证\n\n不要把“多个角色提示词”当作天然的独立审查。","pitfall":"工具数量多、角色名字多都不是可靠性证明。检查一个框架的示例是否包含真实失败、重放和审批，而不只是顺利完成任务。","practice":"为同一任务画单 Agent 和多 Agent 两个版本，列出额外的状态、权限与测试项；只有收益可测时才选择复杂版本。","check":"能够说明为何需要并行；每个子任务有范围与预算；聚合阶段能处理部分失败，而不是把所有报告拼接后宣告成功。","sources":["h-agent","h-persist","h-context"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":11,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"h-12","topic":"harness","title":"从教学 Harness 走到可上线系统","subtitle":"先只读，再审批写入，最后才考虑有限自动执行。","intro":"本专题的示例刻意不连接生产系统。它让你看见循环、权限、预算与验收的配合，但不替你解决身份认证、并发、分布式事务、密钥管理和长期维护。真正上线应按风险逐步扩大能力。","mechanism":"第一阶段只读，输出建议；第二阶段允许草稿和隔离环境内的改动；第三阶段在明确授权下执行可回滚的小范围操作。模型密钥保存在服务端，公网接口有鉴权与限流；状态库、任务队列、审计和备份分别设计。网页前端只是控制台，不应直接持有生产权限。","example":"将本站新闻助手上线：抓取来源按白名单和频率限制运行，提取发布日期与原文，生成带来源的草稿，由编辑审批后发布。采集器、整理 Agent、发布器使用不同权限。来源失效时保留错误，不伪造当天新闻。","code":"浏览器控制台\n  ↓ 用户认证 / 权限 / 请求限流\n后端任务入口 → 队列 → Harness Worker\n                  ↔ 模型适配器\n                  ↔ 受控工具 / 数据源\n                  ↔ 状态库 / 审计 / 产物库\n  ↑ 审批、事件与可验证结果","pitfall":"把运行器搬到 VPS 并不会自动得到沙箱。容器、文件权限、网络出口、服务账号和回滚机制各有边界；真实业务的安全测试不能被教学用例替代。","practice":"填写上线检查单：数据来源、权限、预算、失败恢复、人工介入、监控、回滚、版本升级、下线流程。所有未确认项必须可见。","check":"旧模型不可用、外部工具超时、检查点损坏和用户撤销权限时，都有明确行为；任何成功通知都能回查真实产物。","sources":["h-owasp","h-persist","h-engineering"],"level":"入门 → 工程","checked":"2026-09-11","series":"harness","chapter":12,"table":[],"contentType":"原创教学解释 / 设计示例"},{"id":"m-transformer","topic":"museum","title":"Transformer：从向量到下一 Token","subtitle":"用一个小型观察台理解核心计算。","intro":"分词后的离散标识会转为向量表示。注意力让不同位置的信息按计算出的权重组合，后续层继续变换这些表示。","mechanism":"本馆展示的是教学用单头注意力，使用显式给定的 Q、K、V 与因果掩码，真实模型有更多层、头与其他组件。推理时的权重计算不等于模型训练时参数的更新。","practice":"切换一个查询位置，开启因果掩码，观察后续位置的权重是否归零。","check":"每一行可见权重之和约为 1；被屏蔽的位置权重为 0。","pitfall":"注意力强弱不是对语义理解或因果关系的完整证明。","sources":["m-attention","m-token"],"level":"入门","checked":"2026-09-11"},{"id":"m-agi","topic":"museum","title":"AGI：如何讨论而不混淆","subtitle":"把表现、通用程度和自主性分开。","intro":"讨论 AGI 时，先说清在什么任务范围内、以什么表现和可靠性作为条件。本站不设置 AGI 百分比或到来倒计时。","mechanism":"Levels of AGI 是一种研究框架，不是唯一标准。它把任务能力的广度和表现程度分别讨论，也关注自主性如何影响部署风险。","practice":"选择一条宏大的 AGI 宣称，把它改写为可检验的任务、比较基线、失败条件和时间窗口。","check":"能区分模型的任务表现、产品的工具权限与系统的自主执行程度。","pitfall":"一次精彩演示不能外推为所有场景都可靠；没有统一采用的单一数字能概括本馆这些维度。","sources":["m-agi"],"level":"入门"
